 {"id":"jauche","titel":"Pflanzenjauche","text":"Gärender Pflanzenauszug als Flüssigdünger. Kraut wird in Wasser angesetzt, gärt 1–3 Wochen und wird verdünnt (meist 1:10) auf den Boden gegossen. Gesteinsmehl bindet Geruch. Gefäße aus Kunststoff, Holz oder Ton, kein Metall.","pflanzen":["p01#selbstversorgung-jauche"]},
 {"id":"auszug","titel":"Kaltwasserauszug und Brühe","text":"Kurz angesetzte, nicht gärende Auszüge zum Spritzen. Kaltwasserauszug: 12–24 Stunden ziehen lassen. Brühe: Kraut einweichen und anschließend aufkochen. Beide frisch verwenden.","pflanzen":["p01#selbstversorgung-kaltwasserauszug"]},
 {"id":"trocknen","titel":"Kräuter trocknen","text":"Kräuter vormittags bei trockenem Wetter ernten, nicht waschen wenn sauber. In Bündeln kopfüber oder locker ausgebreitet an einem schattigen, luftigen Ort trocknen, bis die Blätter rascheln. Dunkel, trocken und luftdicht lagern und innerhalb eines Jahres verbrauchen. Im Dörrgerät höchstens 40 °C.","pflanzen":["p01#rezepte-salz"]},
 {"id":"einfrieren","titel":"Blanchieren und Einfrieren","text":"Grünes Blattgemüse kurz (30–60 Sekunden) in kochendes Wasser geben, in Eiswasser abschrecken, ausdrücken und portioniert einfrieren. Haltbar etwa 6–10 Monate. Eignet sich für Suppe, Spinat und Teig.","pflanzen":["p01#rezepte-spinat"]},
 {"id":"samen","titel":"Samen ernten","text":"Samenstände im Spätsommer schneiden, wenn sie bräunlich werden und schwer hängen. Kopfüber in einer Papiertüte trocknen, dann ausreiben und durch ein Sieb von Stielen trennen. Dunkel und trocken lagern.","pflanzen":["p01#rezepte-samen-crunch","p01#heilkunde-samen"]}
],
"biochemie":[
 {"id":"amine","titel":"Biogene Amine","text":"Stickstoffhaltige Botenstoffe, die auch im menschlichen Körper vorkommen. In den Brennhaaren: **Histamin** erweitert die feinen Blutgefäße (Rötung) und lässt Flüssigkeit ins Gewebe treten (Quaddeln, Juckreiz). **Acetylcholin** reizt Nervenenden. **Serotonin** verstärkt das Schmerzempfinden.","stichworte":["Histamin","Serotonin","Acetylcholin","Brennhaare","Quaddeln"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"ameisensaeure","titel":"Ameisensäure","text":"Einfachste organische Säure (HCOOH). Sie kommt in den Brennhaaren vor, aber nur in sehr kleiner Menge und gilt heute nicht mehr als Hauptursache des Brennens.","stichworte":["Säure","HCOOH"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"flavonoide","titel":"Flavonoide","text":"Große Gruppe gelber bis roter Pflanzenfarbstoffe aus der Familie der Polyphenole. Beispiele: Quercetin, Kämpferol, Rutin. Im Labor wirken sie antioxidativ und entzündungshemmend; wie viel davon im Körper ankommt, ist unklar.","stichworte":["Quercetin","Kämpferol","Rutin","Polyphenole","antioxidativ"],"pflanzen":["p01#inhaltsstoffe","p02#inhaltsstoffe"]},
 {"id":"kaffeoylaepfelsaeure","titel":"Kaffeoyläpfelsäure","text":"Phenolsäure aus Kaffeesäure und Äpfelsäure. Typisch für die Brennnessel und wird zur Qualitätsprüfung von Brennnesselblättern herangezogen, zusammen mit Chlorogensäure.","stichworte":["Phenolsäure","Chlorogensäure","Kaffeesäure"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"kieselsaeure","titel":"Kieselsäure","text":"Siliziumverbindungen, die Pflanzen in Zellwände einlagern. Die Spitzen der Brennhaare sind verkieselt und brechen deshalb wie Glas. In der Volksheilkunde gilt Kieselsäure als gut für Haare, Haut und Bindegewebe [T].","stichworte":["Silizium","Silikat"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"chlorophyll","titel":"Chlorophyll","text":"Grüner Blattfarbstoff, mit dem Pflanzen Licht für die Photosynthese einfangen. Im Zentrum des Moleküls sitzt ein Magnesium-Atom. Brennnesseln sind besonders reich daran.","stichworte":["Blattgrün","Photosynthese","Magnesium"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"carotinoide","titel":"Carotinoide","text":"Gelb-orange Farbstoffe wie Beta-Carotin (Vorstufe von Vitamin A) und Lutein. Fettlöslich: zusammen mit etwas Öl oder Butter gegessen, nimmt der Körper sie besser auf.","stichworte":["Beta-Carotin","Lutein","Provitamin A","Vitamin A"],"pflanzen":["p01#inhaltsstoffe","p02#inhaltsstoffe"]},
 {"id":"vitamin-k","titel":"Vitamin K","text":"Fettlösliches Vitamin (in Pflanzen als K1, Phyllochinon), nötig für die Blutgerinnung. Grünes Blattgemüse wie Brennnessel enthält viel davon. Wer Vitamin-K-Antagonisten wie Marcumar nimmt, sollte gleichmäßige Mengen essen und Änderungen mit dem Arzt besprechen.","stichworte":["Phyllochinon","Gerinnung","Marcumar","Blutverdünner"],"pflanzen":["p01#sicherheit"]},
 {"id":"phytosterole","titel":"Phytosterole","text":"Pflanzliche Sterole, dem Cholesterin im Aufbau ähnlich. Beta-Sitosterin kommt in der Brennnesselwurzel vor und wird als einer der Stoffe diskutiert, die bei Prostatabeschwerden helfen.","stichworte":["Beta-Sitosterin","Sitosterin","Sterole","Prostata"],"pflanzen":["p01#heilkunde-wurzeltee"]},
 {"id":"lektine","titel":"Lektine","text":"Eiweiße, die sich an Zuckerstrukturen binden. In der Brennnesselwurzel: UDA (Urtica-dioica-Agglutinin), das in Laborversuchen untersucht wird.","stichworte":["UDA","Agglutinin","Eiweiß"],"pflanzen":["p01#inhaltsstoffe"]},
 {"id":"nitrat","titel":"Nitrat","text":"Stickstoffverbindung aus dem Boden. Pflanzen an überdüngten Standorten speichern viel davon in den Blättern. Deshalb besser an ungedüngten Orten sammeln.","stichworte":["Stickstoff","Dünger"],"pflanzen":["p01#botanik"]},
 {"id":"bitterstoffe","titel":"Bitterstoffe","text":"Sammelbegriff für bitter schmeckende Pflanzenstoffe, oft Sesquiterpenlactone (z. B. Taraxacin im Löwenzahn). Sie reizen Bitterrezeptoren auf der Zunge und lösen über Reflexe Speichel, Magensaft und Galle aus. Deshalb wirken Bittertees am besten ungesüßt und vor dem Essen. Aus vielen Gemüsen wurden sie weggezüchtet.","stichworte":["Sesquiterpenlactone","Taraxacin","Lactucopicrin","Calendulin","Verdauung","Galle","Appetit"],"pflanzen":["p03#inhaltsstoffe","p05#inhaltsstoffe"]},
 {"id":"inulin","titel":"Inulin","text":"Ein Ballaststoff aus Fruchtzucker-Ketten, den Pflanzen wie Löwenzahn, Chicorée und Topinambur in den Wurzeln speichern. Der Mensch kann ihn nicht verdauen; er gelangt in den Dickdarm und füttert dort nützliche Bakterien (präbiotisch). In großen Mengen kann er Blähungen machen.","stichworte":["Ballaststoff","Präbiotikum","Fruktane","Darmflora","Mikrobiom"],"pflanzen":["p03#inhaltsstoffe"]},
 {"id":"anthocyane","titel":"Anthocyane","text":"Wasserlösliche rote bis blauviolette Farbstoffe aus der Gruppe der Flavonoide, z. B. in Holunderbeeren, Heidelbeeren und Rotkohl. Ihre Farbe hängt vom Säuregrad ab: sauer rot, basisch blau. Im Labor wirken sie stark antioxidativ.","stichworte":["Sambucyanin","Farbstoff","Polyphenole","antioxidativ"],"pflanzen":["p04#inhaltsstoffe"]},
 {"id":"sambunigrin","titel":"Sambunigrin (cyanogene Glykoside)","text":"Ein cyanogenes Glykosid in Samen, unreifen Beeren, Blättern und Rinde des Holunders. Beim Kauen und Verdauen kann daraus Blausäure (Cyanwasserstoff) entstehen, die Übelkeit, Erbrechen und Durchfall auslöst. Erhitzen über 80 °C zerstört bzw. verflüchtigt den Stoff weitgehend. Ähnliche Verbindungen stecken in bitteren Mandeln und Steinobstkernen (Amygdalin).","stichworte":["Blausäure","Cyanid","cyanogen","Glykosid","Amygdalin","giftig"],"pflanzen":["p04#sicherheit"]},
 {"id":"saponine","titel":"Saponine","text":"Pflanzenstoffe, die mit Wasser schäumen wie Seife (lateinisch sapo). In der Ringelblume als Triterpensaponine (Calenduloside). Sie wirken an der Haut entzündungshemmend und können Schleim lösen. Im Darm werden sie kaum aufgenommen.","stichworte":["Triterpene","Faradiol","Calendulosid","Seife","schaumbildend"],"pflanzen":["p05#inhaltsstoffe"]},
 {"id":"iridoide","titel":"Iridoide (Aucubin)","text":"Bitter schmeckende Pflanzenstoffe, die Pflanzen gegen Fraßfeinde schützen. Aucubin im Spitzwegerich wird beim Zerkleinern gespalten; das Spaltprodukt wirkt im Labor antibakteriell. Aucubin ist hitzeempfindlich und zerfällt beim langsamen Trocknen – dann werden die Blätter schwarz.","stichworte":["Aucubin","Catalpol","Iridoidglykoside","antibakteriell"],"pflanzen":["p06#inhaltsstoffe"]},
 {"id":"schleimstoffe","titel":"Schleimstoffe","text":"Quellfähige Vielfachzucker (Polysaccharide), die mit Wasser einen schützenden Film bilden. Sie legen sich auf gereizte Schleimhäute in Mund und Rachen und dämpfen so den Hustenreiz. Kaltauszüge erhalten sie besonders gut. Beispiele: Spitzwegerich, Eibisch, Leinsamen.","stichworte":["Mucilago","Polysaccharide","Reizhusten","Kaltauszug"],"pflanzen":["p06#inhaltsstoffe"]},
 {"id":"azulene","titel":"Azulene (Chamazulen)","text":"Blaue Verbindungen, die beim Erhitzen oder bei der Wasserdampfdestillation aus farblosen Vorstufen (Proazulenen) entstehen – daher das tiefblaue Öl von Schafgarbe und Kamille. Chamazulen wirkt entzündungshemmend. Nur bestimmte Schafgarben-Kleinarten bilden Proazulene.","stichworte":["Chamazulen","Proazulene","Achillicin","blau","entzündungshemmend","Kamille"],"pflanzen":["p07#inhaltsstoffe"]},
 {"id":"hypericin","titel":"Hypericin & Hyperforin","text":"Die Leitstoffe des Johanniskrauts. **Hypericin** ist ein roter Farbstoff, der beim Zerreiben der Blüten sichtbar wird; er macht Haut lichtempfindlich (phototoxisch). **Hyperforin** gilt als wesentlich für die stimmungsaufhellende Wirkung und regt gleichzeitig Leberenzyme an – daher die vielen Wechselwirkungen mit Medikamenten.","stichworte":["Hypericin","Hyperforin","phototoxisch","CYP3A4","Wechselwirkungen","Rotöl","Depression"],"pflanzen":["p08#inhaltsstoffe","p08#sicherheit"]},
 {"id":"gluten","titel":"Gluten (Kleber)","text":"Das Klebereiweiß von Weizen, Dinkel, Emmer, Einkorn, Roggen und Gerste. Es besteht aus Prolaminen (im Weizen Gliadin, im Roggen Secalin, in der Gerste Hordein, im Hafer Avenin) und Gluteninen. Gliadine machen den Teig dehnbar, Glutenine elastisch. Mit Wasser und Kneten bilden sie ein Netz, das Gärgase hält. Dinkel hat mehr Gliadin und weniger Glutenin als Weizen: sein Teig ist dehnbarer, aber weniger stabil. Bei Zöliakie löst vor allem die Gliadin-Fraktion die Entzündung aus.","stichworte":["Gliadin","Glutenin","Kleber","Prolamine","Secalin","Hordein","Avenin","Zöliakie","Seitan"],"pflanzen":[]},
 {"id":"staerke","titel":"Stärke","text":"Der Hauptbestandteil des Mehls: lange Ketten aus Traubenzucker (Amylose und Amylopektin). Beim Backen nimmt sie ab ca. 60 °C Wasser auf und verkleistert – die Krume wird fest. Beim Abkühlen und Lagern kristallisiert sie langsam wieder (Retrogradation): Brot wird altbacken. Kochstücke und Sauerteig verzögern das.","stichworte":["Amylose","Amylopektin","Verkleisterung","altbacken","Retrogradation","Amylase"],"pflanzen":[]},
 {"id":"beta-glucane","titel":"Beta-Glucane","text":"Lösliche Ballaststoffe vor allem in Hafer und Gerste. Sie bilden im Darm ein Gel, das Cholesterin und Gallensäuren bindet und den Blutzuckeranstieg dämpft. In der EU ist zugelassen: 3 g Beta-Glucane täglich aus Hafer oder Gerste können einen erhöhten Cholesterinspiegel senken.","stichworte":["Ballaststoff","Hafer","Gerste","Cholesterin","Blutzucker"],"pflanzen":[]},
 {"id":"phytinsaeure","titel":"Phytinsäure","text":"Der Phosphorspeicher im Getreidekorn, vor allem in den Randschichten. Sie bindet Eisen, Zink, Calcium und Magnesium und macht sie schlechter verfügbar. Keimen, Einweichen, Sauerteig und lange Teigführung aktivieren das Enzym Phytase, das Phytinsäure abbaut.","stichworte":["Phytat","Phytase","Mineralstoffe","Vollkorn","Sauerteig"],"pflanzen":[]},
 {"id":"fagopyrin","titel":"Fagopyrin","text":"Roter Farbstoff im Kraut und in der Fruchtschale des Buchweizens, chemisch verwandt mit dem Hypericin des Johanniskrauts. In größeren Mengen gegessen macht er die Haut lichtempfindlich (Fagopyrismus) – bekannt vor allem bei Weidetieren. Geschälte Buchweizenkörner enthalten nur sehr wenig; Vorsicht bei großen Mengen Buchweizenkraut, -sprossen oder -grün.","stichworte":["Fagopyrismus","Buchweizen","phototoxisch","Lichtempfindlichkeit"],"pflanzen":[]},
 {"id":"amylasen","titel":"Amylasen","text":"Enzyme, die Stärke in Zucker zerlegen. Sie sind im Speichel, im Darm und im Getreidekorn aktiv, besonders im keimenden Korn (Malz). Beta-Amylase arbeitet am besten bei ca. 62–65 °C und bildet vergärbaren Malzzucker, Alpha-Amylase bei ca. 70–72 °C. Beim Brotbacken liefern sie der Hefe Futter; im Roggen sind sie so aktiv, dass Sauerteig sie bremsen muss.","stichworte":["Enzyme","Malz","Maischen","Verzuckerung","Maltose","Roggen"],"pflanzen":[]},
 {"id":"cn-verhaeltnis","titel":"C:N-Verhältnis","text":"Das Verhältnis von Kohlenstoff (C) zu Stickstoff (N) in organischem Material. Bodenlebewesen brauchen etwa 25–30 Teile C auf 1 Teil N. Material mit viel C (Holz, Stroh) bindet beim Abbau vorübergehend Stickstoff aus dem Boden (Stickstoffsperre); Material mit wenig C (Gras, Mist, Brennnessel) setzt ihn frei. Grundlage für Kompost, Mulch, Jauche und das Hügelbeet.","stichworte":["Kohlenstoff","Stickstoff","Stickstoffsperre","Immobilisierung","Kompost","Rotte","Humus","Lignin"],"pflanzen":[]},
 {"id":"cumarine","titel":"Cumarine","text":"Duftende Pflanzenstoffe, bekannt vom Waldmeister- und Heugeruch. In Doldenblütlern wie Giersch kommen verschiedene Cumarin-Abkömmlinge vor. In großen Mengen kann reines Cumarin die Leber belasten; in Wildgemüse in üblichen Mengen spielt das keine Rolle.","stichworte":["Waldmeister","Duftstoff"],"pflanzen":["p02#inhaltsstoffe"]},
 {"id":"polyacetylene","titel":"Polyacetylene","text":"Fettlösliche Pflanzenstoffe mit Dreifachbindungen, typisch für Doldenblütler wie Möhre und Giersch (z. B. Falcarinol). Sie dienen der Pflanze als Abwehrstoff, können bei empfindlichen Menschen die Haut reizen und werden im Labor auf entzündungshemmende Wirkung untersucht.","stichworte":["Falcarinol","Doldenblütler"],"pflanzen":["p02#inhaltsstoffe"]},
 {"id":"lithium","titel":"Lithium","nr":"B-Li","text":"Leichtestes Metall, in Spuren in Gestein, Wasser und Nahrung. In hoher Dosis ein bewährtes Psychiatrie-Medikament. Ob es in kleinen Mengen ein lebenswichtiges Spurenelement ist, ist umstritten; Dr. Michael Nehls vertritt das in seinem Buch „Das Lithium-Komplott“.","stichworte":["Li","Spurenelement","Nehls","Lithium-Komplott","Lithiumorotat","Mikrodosis","Trinkwasser","Alzheimer","Demenz","Depression","Suizid"],"pflanzen":[],
  "kurz":"Leichtestes Metall der Welt und Spurenelement in Wasser und Nahrung. In hoher Dosis ist es ein bewährtes Medikament gegen bipolare Störungen. Ob kleine Mengen lebenswichtig sind und vor Demenz oder Depression schützen, ist eine der spannendsten offenen Fragen der Ernährungsmedizin.",
  "steckbrief":[["Symbol","Li, Ordnungszahl 3, Alkalimetall"],["Vorkommen","Gestein, Boden, Grund- und Mineralwasser, Pflanzen"],["Essenziell?","in der EU nicht anerkannt, keine amtliche Zufuhrempfehlung"],["Vorgeschlagene Zufuhr","1 mg pro Tag für Erwachsene (Vorschlag Schrauzer 2002, nicht amtlich)"],["Als Medikament","Lithiumsalze, verschreibungspflichtig, mit Blutspiegelkontrolle"],["Als Nahrungsergänzung","in Deutschland und der EU nicht erlaubt; Lithiumorotat ist kein zugelassenes Novel Food"],["Typische Aufnahme","je nach Region sehr unterschiedlich, von Mikrogramm bis einige Milligramm pro Tag"]],
  "reiter":[
   {"id":"grundlagen","titel":"Grundlagen","bloecke":[
    {"typ":"text","text":"Lithium wirkt im Körper nicht als Baustein, sondern als Regler: Es greift in Signalwege von Nervenzellen ein. Am besten untersucht sind zwei Angriffspunkte."},
    {"typ":"abschnitt","titel":"Wie Lithium in der Zelle wirkt","liste":["**GSK-3β-Hemmung [W]:** Lithium bremst das Enzym Glykogensynthase-Kinase 3 beta. Es ist an der Bildung der Tau-Fasern und Eiweißablagerungen bei Alzheimer beteiligt. Das ist im Labor gut belegt, beim Menschen aber noch nicht als Schutz nachgewiesen.","**Inositol-Signalweg [W]:** Lithium hemmt die Inositol-Monophosphatase und dämpft damit überaktive Botenstoff-Signale. Das gilt als ein Grund für die stimmungsstabilisierende Wirkung.","**Nervenschutz und Neubildung [W]:** In Zell- und Tierversuchen fördert Lithium das Überleben von Nervenzellen und die Bildung neuer Nervenzellen im Hippocampus."]},
    {"typ":"abschnitt","titel":"Formen","liste":["**Lithiumcarbonat, Lithiumcitrat:** Medikamente in der Psychiatrie.","**Lithiumorotat:** Salz der Orotsäure. In einer Rattenstudie von 1978 war der Hirnspiegel etwa dreimal so hoch wie nach Carbonat. Vergleichsstudien am Menschen fehlen.","**Natürliches Lithium:** gelöst in Wasser und in Pflanzen, aufgenommen über Nahrung und Getränke."]},
    {"typ":"tabelle","kopf":["Bereich","Größenordnung pro Tag","Einordnung"],"zeilen":[
     ["Aufnahme über Nahrung","regional von Mikrogramm bis einige mg; Kanarische Inseln im Schnitt ca. 3,7 mg","[W] Studien zur Aufnahme"],
     ["Vorgeschlagene Zufuhr","1 mg","[A] Vorschlag Schrauzer 2002, nicht amtlich"],
     ["Medikament (bipolare Störung)","600–1.200 mg Lithiumcarbonat","[W] ärztliche Therapie mit Blutkontrolle"]]},
    {"typ":"text","text":"Die Spanne zwischen Nahrung und Medikament ist riesig. Studien zu Trinkwasser und Ernährung bewegen sich im Bereich der Nahrung, nicht der Therapie."}
   ]},
   {"id":"vorkommen","titel":"Vorkommen & Nahrung","bloecke":[
    {"typ":"text","text":"Wie viel Lithium ein Lebensmittel enthält, hängt vor allem vom Boden und Wasser ab, auf dem es gewachsen ist. Eine rumänische Studie fand die höchsten Werte in Blattgemüse."},
    {"typ":"tabelle","kopf":["Lebensmittelgruppe","Mittelwert Lithium","Bemerkung"],"zeilen":[
     ["Blattgemüse","9,4 mg/kg","höchster Wert, bis 17,8 mg/kg"],
     ["Mandeln, Erdnüsse","ca. 9–10 mg/kg","Literaturwerte"],
     ["Sojabohnen","ca. 8–11 mg/kg","Literaturwerte"],
     ["Zwiebelgemüse","1,6 mg/kg","stark schwankend"],
     ["Kartoffeln, Tomaten","1,4 mg/kg","Nachtschattengewächse"],
     ["Hülsenfrüchte","1,1 mg/kg",""],
     ["Milchprodukte","0,35 mg/kg",""],
     ["Fleisch, Eigelb","ca. 0,03 mg/kg","sehr wenig"],
     ["Tee, Kaffee","sehr wenig",""]]},
    {"typ":"abschnitt","titel":"Wasser","liste":["**Leitungswasser in Dänemark:** 0,6 bis 30,7 µg pro Liter, im Mittel 11,6 µg.","**Mineralwasser:** je nach Quelle von wenigen µg bis über 1 mg pro Liter. Das Schweizer Mineralwasser aus Zurzach enthält rund 1,3 mg pro Liter.","Laut Literatur kann Mineralwasser rund ein Drittel der Lithiumaufnahme ausmachen."]},
    {"typ":"text","text":"Quelle Tabelle: [Studie zu Lebensmitteln in Rumänien (2024)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10888284). Wer Lithium über die Ernährung aufnehmen möchte, findet es vor allem in Blattgemüse, Nüssen und Hülsenfrüchten – wildes Blattgrün wie {{p:p01|Brennnessel}} und {{p:p02|Giersch}} gehört zur reichsten Gruppe, eigene Messwerte fehlen aber."}
   ]},
   {"id":"forschung","titel":"Forschung","bloecke":[
    {"typ":"text","text":"Gut belegt ist Lithium als Medikament bei bipolarer Störung, auch zur Suizidvorbeugung. Für kleine Mengen aus Wasser und Nahrung gibt es Zusammenhänge in Beobachtungsstudien, aber noch keinen Beweis, dass sie schützen."},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["therapie","Therapie"],["wasser","Trinkwasser"],["demenz","Demenz"]],"eintraege":[
     {"id":"cipriani","titel":"Lithium-Therapie senkt Suizidrisiko","kat":"therapie","beleg":"W","teil":"BMJ 2013, Cipriani u. a.","kurz":"Bei affektiven Störungen senkt Lithium das Suizidrisiko deutlich, in der Auswertung um bis zu 87 Prozent.","zutaten":["Metaanalyse randomisierter Studien","Therapiedosis mit Blutkontrolle"],"schritte":["Gilt als eine der stärksten Belege in der Psychiatrie.","Gilt nur für die ärztliche Therapie, nicht für Mikrodosen."]},
     {"id":"oita","titel":"Japan: Suizide und Leitungswasser","kat":"wasser","beleg":"W","teil":"Präfektur Oita, 2009","kurz":"In 18 Gemeinden war die Suizidrate dort niedriger, wo mehr Lithium im Wasser war.","zutaten":["Beobachtungsstudie"],"schritte":["Kritik: Arbeitslosigkeit, Isolation und Zugang zu Ärzten wurden nicht berücksichtigt."]},
     {"id":"memon","titel":"Metaanalyse Trinkwasser und Suizid","kat":"wasser","beleg":"W","teil":"British Journal of Psychiatry 2020, Memon u. a.","kurz":"15 Studien aus sieben Ländern zeigen insgesamt weniger Suizide bei mehr Lithium im Wasser.","zutaten":["Zusammenfassung von Beobachtungsstudien"],"schritte":["Die Studien weichen stark voneinander ab.","Eine Untersuchung in England mit 5,7 Millionen Menschen fand keinen Zusammenhang."]},
     {"id":"kessing","titel":"Dänemark: Demenz und Leitungswasser","kat":"demenz","beleg":"W","teil":"JAMA Psychiatry 2017, Kessing u. a.","kurz":"Über 800.000 Menschen: Ab 15 µg Lithium pro Liter Wasser rund 17 Prozent weniger Demenz als bei 2–5 µg.","zutaten":["79.731 Demenzfälle mit je etwa 10 Vergleichspersonen","Wasserwerte 0,6–30,7 µg/l"],"schritte":["Bei 5–10 µg/l war das Risiko dagegen 22 Prozent höher – kein gleichmäßiger Verlauf.","Nur ein Zusammenhang, kein Beweis. Die Autoren raten zur Vorsicht und sehen keine Grundlage, Trinkwasser anzureichern."]},
     {"id":"nature2025","titel":"Harvard: Lithiummangel und Alzheimer bei Mäusen","kat":"demenz","beleg":"W","teil":"Nature 2025, Yankner-Labor","kurz":"Bei Mäusen verhinderte niedrig dosiertes Lithiumorotat Hirnschäden und stellte das Gedächtnis wieder her.","zutaten":["Tierversuch, Gewebeanalysen"],"schritte":["Die Forscher fanden Hinweise, dass Alzheimer-Ablagerungen Lithium binden und so einen Mangel im Gehirn erzeugen.","Yankner selbst betont, dass es erst Studien am Menschen braucht."]},
     {"id":"medtransparent","titel":"Direkte Studien zu Lithium gegen Demenz","kat":"demenz","beleg":"W","teil":"Zusammenfassung Medizin transparent","kurz":"Bisher zeigt nur eine mangelhafte Studie einen kleinen Effekt; mehrere sorgfältige Studien fanden keinen Schutz.","zutaten":["wenige Teilnehmende, meist nur Wochen Laufzeit"],"schritte":["Ein vorbeugender Effekt gegen Demenz ist damit nicht belegt.","Bei bipolar Erkrankten unter Lithium gibt es weniger Alzheimer – das kann aber an deren höherem Ausgangsrisiko liegen."]}
    ]}
   ]},
   {"id":"nehls","titel":"Dr. Nehls","bloecke":[
    {"typ":"text","text":"PD Dr. med. Michael Nehls ist Arzt und habilitierter Molekulargenetiker und Bestsellerautor („Alzheimer ist heilbar“). Sein Buch „Das Lithium-Komplott – Plädoyer für ein essenzielles Spurenelement“ ist die bekannteste deutschsprachige Stimme für Lithium als Spurenelement."},
    {"typ":"tabelle","kopf":["Buch","Angabe"],"zeilen":[
     ["Titel","Das Lithium-Komplott – Plädoyer für ein essenzielles Spurenelement"],
     ["Verlag","Mental Enterprises"],
     ["Erschienen","30. April 2025, 464 Seiten, ISBN 978-3-9814048-9-0"],
     ["Englisch","The Conspiracy Against Lithium"]]},
    {"typ":"abschnitt","titel":"Seine Kernthesen [A]","nummern":["**Lithium ist essenziell:** Das Gehirn brauche Lithium als Spurenelement; die vorhandenen Studien reichten schon jetzt, es als lebenswichtig einzustufen.","**Weit verbreiteter Mangel:** Ein chronischer Mangel senke die Lebensqualität und begünstige Depression, Alzheimer, Gewalt, Suizid und eine kürzere Lebenserwartung.","**Schutzstoff:** Lithium schütze vor chronischen Entzündungen, Stress für das Gehirn und Angststörungen und fördere die Neubildung von Nervenzellen.","**Lithiumorotat:** Es erreiche das Gehirn besser und wirke schon in einem Bruchteil der Therapiedosis.","**Komplott:** Behörden erkennten die Bedeutung nicht an; dass Lithium-Nahrungsergänzung in Europa verboten ist, nütze den Herstellern teurer Medikamente.","**Vorbeugung:** Die Medizin solle stärker darauf achten, was der Körper braucht, um gesund zu bleiben."]},
    {"typ":"abschnitt","titel":"Was dafür spricht [W]","liste":["Beobachtungsstudien zu Trinkwasser zeigen öfter weniger Suizide und Demenz bei mehr Lithium ({{b:lithium-forschung|Forschung}}).","Lithium greift nachweislich in Alzheimer-relevante Signalwege ein (GSK-3β).","Die Harvard-Studie 2025 stützt die Idee eines Lithiummangels im Gehirn, bisher bei Mäusen.","Lithium als Medikament ist bei bipolarer Störung sehr wirksam."]},
    {"typ":"abschnitt","titel":"Was Kritiker einwenden [W]","liste":["Lithium ist in der EU nicht als essenziell anerkannt; einen nachgewiesenen Mangelzustand beim Menschen gibt es bisher nicht.","Trinkwasserstudien zeigen nur Zusammenhänge; Bildung, Wohlstand und Gesundheitsversorgung können die Unterschiede erklären.","Die Orotat-These stützt sich auf eine Rattenstudie von 1978; Tierversuche lassen sich nicht direkt übertragen.","Langzeitstudien zu Mikrodosen beim Menschen fehlen.","Verbraucherschützer und Ärzte raten von Selbstversuchen mit Präparaten aus dem Internet ab."]},
    {"typ":"hinweis","text":"**Dosis:** Im Interview bei Ungeskriptet nennt Nehls 1 mg Lithium pro Tag für 70 kg Körpergewicht, als Lithiumorotat vom Arzt verordnet und in der Apotheke hergestellt, oder über Heilwasser mit ca. 1 mg pro Liter. Er beruft sich auf Schrauzer 2002. Eine amtliche Empfehlung gibt es nicht ({{a:nehls-videos-ungeskriptet|Video-Zusammenfassung}})."},
    {"typ":"text","text":"Alles über Nehls, seine weiteren Bücher und Ideen: {{a:nehls|Autorenporträt Dr. Michael Nehls}}."}
   ]},
   {"id":"praxis","titel":"Praxis","bloecke":[
    {"typ":"text","text":"Was man ohne Rezept und ohne Rechtsprobleme tun kann, ist die Aufnahme über Wasser und Nahrung. Alles darüber hinaus gehört in ärztliche Hände."},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[
     {"id":"ernaehrung","titel":"Lithiumreich essen","kat":"alle","beleg":"W","teil":"Ernährung","kurz":"Blattgemüse, Nüsse und Hülsenfrüchte gehören zu den lithiumreichsten Lebensmitteln.","zutaten":["Blattgemüse und Wildkräuter","Mandeln, Erdnüsse","Soja und andere Hülsenfrüchte"],"schritte":["Täglich eine Portion Blattgrün einplanen, z. B. {{p:p02#rezepte-salat|Gierschsalat}} oder {{p:p01#rezepte-spinat|Brennnesselspinat}}.","Nüsse als Snack.","Der Gehalt schwankt stark mit dem Boden."]},
     {"id":"mineralwasser","titel":"Mineralwasser vergleichen","kat":"alle","beleg":"W","teil":"Getränke","kurz":"Der Lithiumgehalt steht oft auf dem Etikett oder in der Analyse des Herstellers.","zutaten":["Etikett oder Wasseranalyse"],"schritte":["Angabe in mg/l oder µg/l suchen.","Wasser mit nennenswertem Gehalt bevorzugen, wenn man möchte.","Bei Nierenerkrankung oder Lithiumtherapie vorher mit dem Arzt sprechen."]},
     {"id":"arzt","titel":"Mit dem Arzt sprechen","kat":"alle","beleg":"W","teil":"Medizin","kurz":"Lithiumsalze gibt es nur auf Rezept, mit Blutspiegelkontrolle.","zutaten":["Fragen zu Depression, Stimmung oder Gedächtnis"],"schritte":["Beschwerden ärztlich abklären lassen.","Lithium-Blutspiegel kann bei Bedarf gemessen werden."],"hinweis":"Präparate aus dem Ausland sind in der EU nicht zugelassen, Inhalt und Reinheit sind ungeprüft."}
    ]}
   ]},
   {"id":"sicherheit","titel":"Sicherheit","bloecke":[
    {"typ":"text","text":"Lithium hat eine schmale therapeutische Breite: Zwischen wirksamer und giftiger Menge liegt wenig Spielraum. Das gilt vor allem für Medikamentendosen."},
    {"typ":"abschnitt","titel":"Risiken der Therapie","liste":["**Niere:** Nach zehn Jahren Therapie entwickeln 10–20 Prozent eine chronische Nierenerkrankung.","**Schilddrüse:** Unterfunktion möglich, daher regelmäßige Kontrollen.","**Nebenwirkungen:** Zittern, Gewichtszunahme, Durst, Wassereinlagerungen.","**Vergiftung:** Übelkeit, Erbrechen, Schwindel, Verwirrtheit bis Koma."]},
    {"typ":"abschnitt","titel":"Wechselwirkungen","liste":["Schmerzmittel (NSAR wie Ibuprofen)","Entwässerungstabletten (Diuretika)","Bestimmte Blutdrucksenker (z. B. ACE-Hemmer)","Diese können den Lithiumspiegel gefährlich erhöhen, mit Nervenschäden und Herzrhythmusstörungen als Folge."]},
    {"typ":"hinweis","text":"**Kein Selbstversuch mit Präparaten:** Verbraucherschützer und Fachleute raten davon ab. Bei Nierenerkrankungen, Herzschwäche, Schwangerschaft oder bei Einnahme der genannten Medikamente ist auch bei kleinen Mengen ärztlicher Rat nötig."}
   ]},
   {"id":"quellen","titel":"Quellen","bloecke":[
    {"typ":"quellen","eintraege":[
     ["Spektrum: Wundermittel Lithium? Umstrittenes Microdosing","https://www.spektrum.de/news/wundermittel-spurenelement-lithium-umstrittenes-microdosing/2301935"],
     ["apotheken.de: Schützt Lithium vor Demenz?","https://apotheken.de/news/14251-schuetzt-lithium-vor-demenz"],
     ["Plattform J: Lithium-Kontroverse (2026)","https://www.plattformj.ch/artikel/247000/"],
     ["Pressetext: Interview mit Dr. Michael Nehls (2026)","https://www.pressetext.com/news/freitag-21-august-2026-ab-19-uhr-dr-michael-nehls-im-interview-ueber-lithium-und-praevention.html"],
     ["Lesejury: Das Lithium-Komplott","https://www.lesejury.de/michael-nehls/buecher/das-lithium-komplott/9783981404890"],
     ["Alzforum: Kessing 2017, Lithium im Leitungswasser und Demenz","https://alzforum.org/node/875701"],
     ["Lithiumgehalt in Lebensmitteln, Rumänien (2024)","https://pmc.ncbi.nlm.nih.gov/articles/PMC10888284"],
     ["Schrauzer 2002: Lithium – Vorkommen, Aufnahme, Essenzialität","https://pubmed.ncbi.nlm.nih.gov/11838882/"]]},
    {"typ":"text","text":"Noch offen: Originalzitate aus dem Buch, Lithiumgehalte deutscher Mineralwässer."}
   ]}
  ]}
]
}

<script>
(function(){
const D = JSON.parse(document.getElementById('daten').textContent);
const main = document.getElementById('inhalt');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const belegName = {W:'W · belegt',T:'T · traditionell',A:'A · alternativ'};
const badge = k => `<span class="b b-${k}" title="${belegName[k]}">${k}</span>`;
const pflanzenName = id => (D.pflanzen.find(p=>p.id===id)||{}).name || id;

function inline(t){
  let s = esc(t);
  s = s.replace(/\[([^\]]{2,}?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\[(W|T|A)\]/g,(m,k)=>badge(k));
  s = s.replace(/\{\{(b|s|p|a|g):([^|}]+)\|([^}]+)\}\}/g,(m,teil,id,txt)=>{
    const h = teil==='p' ? id.replace('#','-') : teil+'-'+id;
    return `<a href="#${h}">${txt}</a>`;
  });
  return s;
}
function zielLink(ref){ // "p01#rezepte-salz"
  const [pid, rest] = ref.split('#');
  const pf = D.pflanzen.find(p=>p.id===pid);
  let label = pf ? pf.name : pid;
  if(rest && pf){
    const [rid, ...e] = rest.split('-'); const eid = e.join('-');
    const r = pf.reiter.find(x=>x.id===rid);
    if(r){ label += ' · ' + r.titel;
      if(eid){ for(const b of r.bloecke){ if(b.eintraege && b.typ==='karten'){ const x=b.eintraege.find(z=>z.id===eid); if(x) label += ' · '+x.titel; } } }
    }
  }
  return `<a href="#${pid}${rest?'-'+rest:''}">${esc(label)}</a>`;
}

/* ---------- Suchindex ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
const kurz = s => norm(s).replace(/(.)\1+/g,'$1'); // Brennessel = Brennnessel
const index = [];
function add(label, art, wo, hash, extra){
  const text = [label, extra||''].join(' ');
  index.push({label, art, wo, hash, n:norm(text), k:kurz(text), nl:norm(label)});
}
D.pflanzen.forEach(p=>{
  add(p.name,'Pflanze',p.nr,p.id,[p.botan,...p.volksnamen].join(' '));
  p.reiter.forEach(r=>{
    add(p.name+' · '+r.titel,'Reiter',p.nr,p.id+'-'+r.id,'');
    r.bloecke.forEach(b=>{
      if(b.typ==='karten') b.eintraege.forEach(e=>add(e.titel, b.art==='rezept'?'Rezept':'Anwendung', p.name+' · '+r.titel, p.id+'-'+r.id+'-'+e.id, [e.kurz||'',...(e.zutaten||[])].join(' ')));
      if(b.typ==='abschnitt') add(b.titel,'Abschnitt',p.name+' · '+r.titel,p.id+'-'+r.id,(b.liste||b.nummern||[]).join(' '));
    });
  });
});
function addKapitel(e, pre, art, teilName){
  add(e.titel, art, teilName, pre+e.id, [(e.stichworte||[]).join(' '), e.text||''].join(' '));
  (e.reiter||[]).forEach(r=>{
    add(e.titel+' · '+r.titel,'Reiter',teilName,pre+e.id+'-'+r.id,'');
    r.bloecke.forEach(b=>{
      if(b.typ==='karten') b.eintraege.forEach(x=>add(x.titel,'Eintrag',e.titel+' · '+r.titel,pre+e.id+'-'+r.id+'-'+x.id,[x.kurz||'',...(x.zutaten||[])].join(' ')));
      if(b.typ==='abschnitt') add(b.titel.replace(/^\d+\.\s*/,''),'Abschnitt',e.titel+' · '+r.titel,pre+e.id+'-'+r.id,(b.liste||b.nummern||[]).join(' '));
    });
  });
}
D.biochemie.forEach(e=>addKapitel(e,'b-','Biochemie','Teil B'));
D.selbstversorgung.forEach(e=>addKapitel(e,'s-','Selbstvers.','Teil S'));
D.getreide.forEach(e=>addKapitel(e,'g-','Getreide','Teil G'));
D.autoren.forEach(a=>{
  add(a.name,'Autor',a.nr,'a-'+a.id,[a.botan,a.name.replace('Dr. ','')].join(' '));
  a.reiter.forEach(r=>{
    add(a.name+' · '+r.titel,'Reiter',a.nr,'a-'+a.id+'-'+r.id,'');
    r.bloecke.forEach(b=>{
      if(b.typ==='karten') b.eintraege.forEach(x=>add(x.titel, b.art==='buch'?'Buch':'Praxis', a.name.replace('Dr. ','')+' · '+r.titel,'a-'+a.id+'-'+r.id+'-'+x.id,[x.kurz||'',...(x.zutaten||[])].join(' ')));
      if(b.typ==='abschnitt') add(b.titel.replace(/^\d+\.\s*/,''),'Abschnitt',a.name.replace('Dr. ','')+' · '+r.titel,'a-'+a.id+'-'+r.id,(b.liste||b.nummern||[]).join(' '));
    });
  });
});

function suchen(q){
  const n = norm(q.trim()), k = kurz(q.trim());
  if(n.length<2) return [];
  return index.map(e=>{
    let score = 0;
    if(e.nl.startsWith(n)) score = 4; else if(e.nl.includes(n)) score = 3;
    else if(e.k.includes(k) && kurz(e.label).includes(k)) score = 2.5;
    else if(e.n.includes(n) || e.k.includes(k)) score = 1;
    return {e,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || a.e.label.length-b.e.label.length).slice(0,12).map(x=>x.e);
}

const box = document.getElementById('suchbox'), inp = document.getElementById('sucheingabe'), liste = document.getElementById('trefferliste');
let aktiv = -1, aktuelle = [];
function zeigeTreffer(){
  aktuelle = suchen(inp.value); aktiv = aktuelle.length?0:-1;
  if(!inp.value.trim()){ liste.hidden = true; box.setAttribute('aria-expanded','false'); return; }
  liste.innerHTML = aktuelle.length ? aktuelle.map((t,i)=>`<button role="option" id="t${i}" aria-selected="${i===aktiv}" data-hash="${t.hash}"><span class="art">${esc(t.art)}</span><span>${esc(t.label)}</span><span class="wo">${esc(t.wo)}</span></button>`).join('')
    : `<div class="leer">Kein Eintrag zu „${esc(inp.value)}“. Neue Begriffe kommen mit jedem Kapitel dazu.</div>`;
  liste.hidden = false; box.setAttribute('aria-expanded','true');
}
function waehle(hash){ liste.hidden = true; box.setAttribute('aria-expanded','false'); inp.value=''; inp.blur(); if(location.hash==='#'+hash) route(); else location.hash = hash; }
inp.addEventListener('input', zeigeTreffer);
inp.addEventListener('keydown', ev=>{
  if(liste.hidden) return;
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); if(!aktuelle.length) return; aktiv=(aktiv+(ev.key==='ArrowDown'?1:-1)+aktuelle.length)%aktuelle.length; liste.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',i===aktiv)); }
  if(ev.key==='Enter' && aktiv>=0){ ev.preventDefault(); waehle(aktuelle[aktiv].hash); }
  if(ev.key==='Escape'){ liste.hidden = true; }
});
liste.addEventListener('click', ev=>{ const b = ev.target.closest('button'); if(b) waehle(b.dataset.hash); });
document.addEventListener('click', ev=>{ if(!box.contains(ev.target)) liste.hidden = true; });
document.querySelectorAll('.teile button').forEach(b=>b.addEventListener('click',()=>{ location.hash = b.dataset.ziel; }));

/* ---------- Darstellung ---------- */
function block(b, pid, rid){
  if(b.typ==='text') return `<p>${inline(b.text)}</p>`;
  if(b.typ==='hinweis') return `<p class="hinweis">${inline(b.text)}</p>`;
  if(b.typ==='abschnitt'){
    const items = b.liste ? `<ul>${b.liste.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>` : `<ol>${b.nummern.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`;
    return `<section class="abschnitt"><h3>${esc(b.titel)}</h3>${items}</section>`;
  }
  if(b.typ==='tabelle') return `<div class="tab-wrap"><table><thead><tr>${b.kopf.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.zeilen.map(z=>`<tr>${z.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.typ==='schichten'){
    const n = b.eintraege.length;
    return `<figure class="schnitt" aria-label="${esc(b.titel)}"><figcaption class="unter">${esc(b.titel)}</figcaption>
      ${b.eintraege.map(([name,dicke,info],i)=>`<div class="lage lage-${i}" style="--w:${Math.round(42+58*i/(n-1))}%"><span class="lage-name">${esc(name)}</span><span class="lage-dicke">${esc(dicke)}</span><span class="lage-info">${esc(info)}</span></div>`).join('')}
      <div class="grund">gewachsener Boden</div></figure>`;
  }
  if(b.typ==='quellen') return `<ul class="stack" style="padding-left:1.2em;margin:0">${b.eintraege.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul>`;
  if(b.typ==='karten'){
    const f = `<div class="filter" role="group" aria-label="Filter">${b.filter.map(([k,l],i)=>`<button data-f="${k}" aria-pressed="${i===0}">${esc(l)}</button>`).join('')}</div>`;
    const k = b.eintraege.map(e=>{
      const meta = b.art==='rezept' ? `<span>${esc(e.menge)}</span><span>${esc(e.zeit)}</span>`
        : b.art==='buch' ? `<span><strong>${esc(e.jahr)}</strong></span><span>${esc(e.verlag)}</span>`
        : `${badge(e.beleg)}<span>${esc(e.teil)}</span>`;
      const l1 = {rezept:'Zutaten',buch:'Angaben'}[b.art]||'Du brauchst', l2 = {rezept:'Zubereitung',buch:'Kernaussagen'}[b.art]||'So geht’s';
      return `<article class="karte" id="${pid}-${rid}-${e.id}" data-kat="${e.kat}">
        <button aria-expanded="false"><h3>${esc(e.titel)}</h3><div class="meta">${meta}<span class="auf">Öffnen</span></div>${e.kurz?`<p style="font-size:.95rem">${inline(e.kurz)}</p>`:''}</button>
        <div class="koerper" hidden>
          <div class="unter">${l1}</div><ul>${e.zutaten.map(z=>`<li>${inline(z)}</li>`).join('')}</ul>
          <div class="unter">${l2}</div>${b.art==='buch'?'<ul>':'<ol>'}${e.schritte.map(z=>`<li>${inline(z)}</li>`).join('')}${b.art==='buch'?'</ul>':'</ol>'}
          ${e.tipp?`<p><strong>Tipp:</strong> ${inline(e.tipp)}</p>`:''}${e.hinweis?`<p class="hinweis">${inline(e.hinweis)}</p>`:''}
        </div></article>`;
    }).join('');
    return `<div class="stack" data-karten>${f}<div class="karten">${k}</div></div>`;
  }
  return '';
}
function oeffne(karte, an){
  const btn = karte.querySelector(':scope>button'), k = karte.querySelector('.koerper');
  k.hidden = !an; btn.setAttribute('aria-expanded', an); btn.querySelector('.auf').textContent = an?'Schließen':'Öffnen';
}

function legende(){ return `<div class="legende"><span>${badge('W')} wissenschaftlich belegt oder amtlich anerkannt</span><span>${badge('T')} traditionell überliefert</span><span>${badge('A')} alternative Quelle, nicht geprüft</span></div>`; }

function pflanzenSeite(p, rid, eid, pre, teil){
  pre = pre || p.id; teil = teil || 'P';
  const r = p.reiter.find(x=>x.id===rid) || p.reiter[0];
  const unterzeile = [p.botan, (p.volksnamen||[]).join(', ')].filter(Boolean).join(' · ');
  main.innerHTML = `
  <div class="stack">
    <div class="eyebrow">Teil ${teil} · ${esc(p.nr)}</div>
    <h1>${esc(p.name||p.titel)}</h1>
    ${unterzeile?`<div class="botan">${esc(unterzeile)}</div>`:''}
    <p>${inline(p.kurz)}</p>
  </div>
  <dl class="steck" style="margin:0">${p.steckbrief.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${inline(v)}</dd></div>`).join('')}</dl>
  ${legende()}
  <div class="reiter" role="tablist" aria-label="Kapitel">${p.reiter.map(x=>`<button role="tab" id="tab-${x.id}" aria-selected="${x.id===r.id}" aria-controls="panel-${x.id}" data-r="${x.id}">${esc(x.titel)}</button>`).join('')}</div>
  ${p.reiter.map(x=>`<section class="panel" role="tabpanel" id="panel-${x.id}" aria-labelledby="tab-${x.id}" ${x.id===r.id?'':'hidden'}><h2>${esc(x.titel)}</h2>${x.bloecke.map(b=>block(b,pre,x.id)).join('')}</section>`).join('')}
  <p class="fuss">Stand 12.10.2026 · Kapitel ${esc(p.nr)} · ${teil==='A'?'Zusammenfassungen aus Verlags-, Presse- und Rezensionsquellen.':'Angaben ersetzen keine ärztliche Beratung.'}</p>`;
  main.querySelectorAll('.reiter button').forEach(b=>b.addEventListener('click',()=>{ history.replaceState(null,'','#'+pre+'-'+b.dataset.r); zeigeReiter(b.dataset.r); }));
  main.querySelectorAll('[data-karten]').forEach(g=>{
    g.querySelectorAll('.filter button').forEach(fb=>fb.addEventListener('click',()=>{
      g.querySelectorAll('.filter button').forEach(x=>x.setAttribute('aria-pressed', x===fb));
      g.querySelectorAll('.karte').forEach(c=>c.hidden = !(fb.dataset.f==='alle' || c.dataset.kat===fb.dataset.f));
    }));
  });
  main.querySelectorAll('.karte>button').forEach(b=>b.addEventListener('click',()=>{ const c=b.parentElement; oeffne(c, c.querySelector('.koerper').hidden); }));
  if(eid){
    const c = document.getElementById(pre+'-'+r.id+'-'+eid);
    if(c){ oeffne(c,true); c.classList.add('ziel'); requestAnimationFrame(()=>{ const y=c.getBoundingClientRect().top+scrollY-140; scrollTo({top:y,behavior:'smooth'}); }); return; }
  }
  if(rid){ const t=document.querySelector('.reiter'); scrollTo({top:t.getBoundingClientRect().top+scrollY-130}); } else scrollTo(0,0);
}
function zeigeReiter(id){
  main.querySelectorAll('.reiter button').forEach(b=>b.setAttribute('aria-selected', b.dataset.r===id));
  main.querySelectorAll('.panel').forEach(pn=>pn.hidden = pn.id!=='panel-'+id);
}

function teilSeite(teil, ziel){
  let kopf, liste;
  if(teil==='A'){
    kopf = ['Teil A','Autoren','Menschen, deren Wissen in diese Sammlung einfließt: Person, Bücher, Kernideen, Praxis und Einordnung, jeweils mit eigenen Reitern.'];
    liste = `<div class="teilkarten">${D.autoren.map(a=>`<a class="teilkarte" href="#a-${a.id}" style="text-decoration:none;color:inherit"><div class="eyebrow">${esc(a.nr)}</div><h2>${esc(a.name)}</h2><div class="botan" style="font-size:1rem">${esc(a.botan)}</div><p style="font-size:.95rem">${esc(a.kurz)}</p></a>`).join('')}</div>`;
  } else if(teil==='P'){
    kopf = ['Teil P','Pflanzenkunde','Ein Kapitel pro Pflanze, immer nach derselben Vorlage: Botanik, Inhaltsstoffe, Wirkung, Heilkunde, Rezepte, Selbstversorgung, Sicherheit, Quellen.'];
    liste = `<div class="teilkarten">${D.pflanzen.map(p=>`<a class="teilkarte" href="#${p.id}" style="text-decoration:none;color:inherit"><div class="eyebrow">${esc(p.nr)}</div><h2>${esc(p.name)}</h2><div class="botan" style="font-size:1rem">${esc(p.botan)}</div><p style="font-size:.95rem">${esc(p.kurz)}</p></a>`).join('')}</div>`;
  } else {
    const arr = {B:D.biochemie,S:D.selbstversorgung,G:D.getreide}[teil], pre = teil.toLowerCase()+'-';
    kopf = {B:['Teil B','Biochemie','Wirkstoffe und Stoffgruppen einfach erklärt, mit Verweis auf die Pflanzen, in denen sie vorkommen.'],
            S:['Teil S','Selbstversorgung','Allgemeine Verfahren für Garten und Vorrat. Die Pflanzenkapitel verweisen hierher.'],
            G:['Teil G','Getreide & Brot','Getreidearten, Mehl, Mahlen, Hefe, Sauerteig, Backen, Anbau und Gesundheit.']}[teil];
    liste = `<div class="stack">${arr.map(e=>`<article class="eintrag${ziel===e.id?' ziel':''}" id="${pre}${e.id}"><h2>${esc(e.titel)}</h2><p>${inline(e.text)}</p>${e.stichworte?`<div class="liste-links">${e.stichworte.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}<div class="liste-links"><span class="eyebrow" style="align-self:center">Vorkommen</span>${e.pflanzen.map(zielLink).join('')}</div>${e.reiter?`<p><a href="#${pre}${e.id}-${e.reiter[0].id}"><strong>Ganzes Kapitel öffnen →</strong></a> ${e.reiter.length} Reiter: ${e.reiter.map(r=>esc(r.titel)).join(', ')}</p>`:''}</article>`).join('')}</div>`;
  }
  main.innerHTML = `<div class="stack"><div class="eyebrow">${kopf[0]}</div><h1>${kopf[1]}</h1><p>${kopf[2]}</p></div>${teil==='B'?legende():''}${liste}`;
  if(ziel){ const el=document.getElementById(teil.toLowerCase()+'-'+ziel); if(el) requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'})); } else scrollTo(0,0);
}

function startSeite(){
  main.innerHTML = `
  <div class="stack"><div class="eyebrow">Wissenssammlung · später als Buch</div><h1>Selbstversorgung, Pflanzen und ihre Wirkstoffe</h1>
  <p>Gib oben einen Begriff ein, zum Beispiel <a href="#p02-rezepte-pesto">Gierschpesto</a>, <a href="#b-lithium-nehls">Nehls</a>, <a href="#b-amine">Histamin</a> oder <a href="#s-jauche">Jauche</a>, und du landest direkt bei der Erklärung.</p></div>
  ${legende()}
  <div class="teilkarten">
    <a class="teilkarte" href="#teil-P" style="text-decoration:none;color:inherit"><div class="buchst">P</div><h2>Pflanzenkunde</h2><p>${D.pflanzen.length} Kapitel</p><div class="liste-links">${D.pflanzen.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div></a>
    <a class="teilkarte" href="#teil-S" style="text-decoration:none;color:inherit"><div class="buchst">S</div><h2>Selbstversorgung</h2><p>${D.selbstversorgung.length} Verfahren</p><div class="liste-links">${D.selbstversorgung.map(e=>`<span class="chip">${esc(e.titel)}</span>`).join('')}</div></a>
    <a class="teilkarte" href="#g-brot" style="text-decoration:none;color:inherit"><div class="buchst">G</div><h2>Getreide & Brot</h2><p>${D.getreide.length} Kapitel</p><div class="liste-links">${D.getreide.map(e=>`<span class="chip">${esc(e.titel)}</span>`).join('')}<span class="chip">Weizen</span><span class="chip">Dinkel</span><span class="chip">Roggen</span><span class="chip">Sauerteig</span></div></a>
    <a class="teilkarte" href="#teil-B" style="text-decoration:none;color:inherit"><div class="buchst">B</div><h2>Biochemie</h2><p>${D.biochemie.length} Stoffe</p><div class="liste-links">${D.biochemie.map(e=>`<span class="chip">${esc(e.titel)}</span>`).join('')}</div></a>
    <a class="teilkarte" href="#teil-A" style="text-decoration:none;color:inherit"><div class="buchst">A</div><h2>Autoren</h2><p>${D.autoren.length} Porträts</p><div class="liste-links">${D.autoren.map(e=>`<span class="chip">${esc(e.name)}</span>`).join('')}</div></a>
  </div>`;
  scrollTo(0,0);
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let teil = null;
  if(!h || h==='start') startSeite();
  else if(h.startsWith('teil-')){ teil = h.slice(5); teilSeite(teil); }
  else if(h.startsWith('b-')){
    teil='B'; const rest = h.slice(2);
    const k = D.biochemie.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 'b-'+k.id, 'B'); }
    else teilSeite('B', rest);
  }
  else if(h.startsWith('g-')){
    teil='G'; const rest = h.slice(2);
    const k = D.getreide.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 'g-'+k.id, 'G'); }
    else teilSeite('G', rest);
  }
  else if(h.startsWith('s-')){
    teil='S'; const rest = h.slice(2);
    const k = D.selbstversorgung.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 's-'+k.id, 'S'); }
    else teilSeite('S', rest);
  }
  else if(h.startsWith('a-')){
    teil='A'; const rest = h.slice(2);
    const a = D.autoren.find(e=>rest===e.id || rest.startsWith(e.id+'-'));
    if(a){ const [rid,...e] = rest.slice(a.id.length+1).split('-'); pflanzenSeite(a, rid, e.join('-'), 'a-'+a.id, 'A'); }
    else teilSeite('A');
  }
  else {
    const [pid, rid, ...rest] = h.split('-');
    const p = D.pflanzen.find(x=>x.id===pid);
    if(p){ teil='P'; pflanzenSeite(p, rid, rest.join('-')); } else startSeite();
  }
  document.querySelectorAll('.teile button').forEach(b=>b.setAttribute('aria-current', b.dataset.ziel==='teil-'+teil));
}
addEventListener('hashchange', route);
route();
})();
</script>
