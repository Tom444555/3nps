"getreide":[
 {"id":"brot","titel":"Getreide & Brot","nr":"G-01","text":"Weizen, Dinkel, Roggen, Gerste, Hafer und Urgetreide: Aufbau des Korns, Kleber, Mehltypen, Mahlen, Hefe, Sauerteig, warum Dinkel anders backt, Rezepte, Anbau und Gesundheit.","stichworte":["Weizen","Dinkel","Roggen","Gerste","Hafer","Emmer","Einkorn","Grünkern","Gluten","Kleber","Mehltyp","Mahlen","Getreidemühle","Hefe","Sauerteig","Brot backen","Vorteig","Kochstück","Zöliakie"],"pflanzen":[],
  "kurz":"Getreide ist seit 10.000 Jahren die Grundlage der Selbstversorgung. Wer versteht, was im Korn steckt und was im Teig passiert, backt mit jedem Mehl gutes Brot – auch mit Dinkel, der anders behandelt werden will als Weizen.",
  "steckbrief":[["Getreidearten","Weizen, Dinkel, Emmer, Einkorn, Roggen, Gerste, Hafer; dazu Pseudogetreide wie Buchweizen"],["Backfähig durch Kleber","Weizen > Dinkel > Emmer > Einkorn; Roggen nur mit Sauerteig"],["Mehltyp","mg Mineralstoffe (Asche) pro 100 g Mehl-Trockenmasse"],["Hefe","1 Würfel Frischhefe (42 g) ≈ 2 Päckchen Trockenhefe (je 7 g)"],["Wohlfühltemperatur Hefe","ca. 24–32 °C; ab ca. 50 °C stirbt sie"],["Dinkel-Regel","kürzer und sanfter kneten, mehr Zeit, Wasser über ein Kochstück binden"],["Glutenfrei?","nein: Weizen, Dinkel, Emmer, Einkorn, Roggen, Gerste; Hafer nur als zertifiziert glutenfreier"],["Lagerung","Korn trocken jahrelang, helles Mehl ca. 1 Jahr, Vollkornmehl nur wenige Wochen"]],
  "reiter":[
   {"id":"ueberblick","titel":"Getreidearten","bloecke":[
    {"typ":"text","text":"Alle Getreide sind Gräser. Sie unterscheiden sich vor allem im Kleber, der bestimmt, wie gut ein Teig aufgeht, und darin, ob das Korn fest in Spelzen sitzt."},
    {"typ":"tabelle","kopf":["Getreide","Botanik","Kleber / Backverhalten","Geschmack","Typische Verwendung"],"zeilen":[
     ["Weizen","Triticum aestivum, Nacktgetreide","viel, sehr elastisch – geht hoch auf","mild","Brot, Brötchen, Kuchen, Nudeln, Pizza"],
     ["Dinkel","Triticum spelta, Spelzgetreide, eng mit Weizen verwandt","viel, aber weicher und weniger stabil – reißt leichter, läuft breit","nussig","Brot, Brötchen, Kuchen; unreif gedarrt als Grünkern"],
     ["Emmer","Triticum dicoccum, Urgetreide, Spelzgetreide","mittel, weich","kräftig, leicht würzig","Fladen, Mischbrote, Nudeln"],
     ["Einkorn","Triticum monococcum, ältestes Getreide, Spelzgetreide","wenig, sehr weich – kaum Volumen","nussig, gelbes Mehl (viel Lutein)","Kekse, Pfannkuchen, Mischbrote"],
     ["Roggen","Secale cereale","Kleber bildet kein Gerüst; braucht Sauerteig","herzhaft, säuerlich","Sauerteig-, Misch- und Vollkornbrote"],
     ["Gerste","Hordeum vulgare","wenig backfähig","mild-süßlich","Graupen, Malz, Bier, Gerstenkaffee, Fladen"],
     ["Hafer","Avena sativa","kein backfähiger Kleber","mild, cremig","Flocken, Brei, Kekse, als Beimischung"]]},
    {"typ":"abschnitt","titel":"Spelzgetreide","liste":["Dinkel, Emmer und Einkorn sitzen fest in ihren Spelzen. Nach dem Dreschen muss das Korn in einer Schälmühle entspelzt werden (Gerbgang).","Die Spelzen schützen das Korn vor Schädlingen und Umwelteinflüssen; darum gelten Spelzgetreide als robust und für den Bio-Anbau gut geeignet.","Für die Haushaltsmühle nur entspelztes Korn kaufen."]},
    {"typ":"abschnitt","titel":"Aufbau des Korns","liste":["**Mehlkörper (ca. 80–85 %):** Stärke und Kleber-Eiweiß – daraus besteht helles Mehl.","**Keimling (ca. 3 %):** Fett, Vitamin E, B-Vitamine; macht Vollkornmehl schnell ranzig.","**Randschichten und Schale (ca. 12–15 %):** Ballaststoffe, Mineralstoffe; die Aleuronschicht ist besonders eiweiß- und mineralstoffreich.","Vollkornmehl enthält alle drei Teile, helles Mehl fast nur den Mehlkörper."]},
    {"typ":"abschnitt","titel":"Gerste und Hafer im Haus","liste":["**Graupen:** geschliffene, polierte Gerstenkörner für Suppen und Eintöpfe; Rollgerste sind große Graupen.","**Malz:** Gerste keimen lassen und darren – die Keimung bildet Enzyme, die Stärke in Malzzucker umwandeln. Grundlage für Bier und Malzextrakt.","**Gerstenkaffee (Muckefuck):** geröstete Gerste als koffeinfreier Kaffee-Ersatz.","**Hafer:** wird gequetscht zu Flocken; ganz wichtig für Brei und Müsli.","Gerste und Hafer enthalten viele Beta-Glucane ({{b:beta-glucane|Beta-Glucane}})."]}
   ]},
   {"id":"chemie","titel":"Kleber & Chemie","bloecke":[
    {"typ":"text","text":"Was beim Backen passiert, ist Biochemie: Eiweiß bildet ein Netz, Hefe produziert Gas, Stärke verkleistert. Das erklärt, warum Dinkel anders reagiert als Weizen."},
    {"typ":"abschnitt","titel":"1. Der Kleber (Gluten)","liste":["Mehl enthält zwei Eiweißgruppen: **Gliadine** machen den Teig dehnbar und klebrig, **Glutenine** machen ihn elastisch und stabil.","Mit Wasser und Kneten verbinden sie sich zum Kleber – einem Netz, das wie ein Ballon die Gärgase festhält.","**Weizen:** ausgewogenes, stabiles Netz – hohes Volumen.","**Dinkel:** insgesamt viel Kleber, aber mehr Gliadin und weniger Glutenin. Der Teig ist sehr dehnbar, aber wenig stabil: Er reißt bei zu langem Kneten, läuft breit und hält das Gas schlechter. Mehr dazu: {{b:gluten|Gluten}}."]},
    {"typ":"abschnitt","titel":"2. Die Gärung","liste":["Hefe frisst Zucker aus dem Mehl und bildet Kohlendioxid (lässt den Teig aufgehen) und Alkohol (verfliegt beim Backen, gibt Aroma).","Enzyme im Mehl (Amylasen) spalten Stärke laufend in Zucker – Futter für die Hefe.","Lange, kühle Gare bringt mehr Aroma und bessere Verträglichkeit als viel Hefe und kurze Zeit."]},
    {"typ":"abschnitt","titel":"3. Warum Roggen Sauerteig braucht","liste":["Roggen hat viel aktive Amylase und viele Schleimstoffe (Pentosane). Sein Kleber bildet kein Gerüst.","Ohne Säure bauen die Enzyme beim Backen die Stärke ab – die Krume wird klebrig und nass.","Die Milchsäure im Sauerteig bremst die Enzyme und lässt die Schleimstoffe quellen. So entsteht eine schnittfeste Krume."]},
    {"typ":"abschnitt","titel":"4. Im Ofen","liste":["Ab ca. 50–60 °C stirbt die Hefe, das Gas dehnt sich noch einmal aus (Ofentrieb).","Ab ca. 60–70 °C verkleistert die Stärke und bindet Wasser – die Krume wird fest ({{b:staerke|Stärke}}).","Ab ca. 70 °C gerinnt der Kleber und fixiert die Form.","Ab ca. 150 °C bräunt die Kruste durch die Maillard-Reaktion (Zucker + Eiweiß) und Karamellisierung – das Aroma entsteht.","Kerntemperatur eines fertigen Brots: ca. 96–98 °C."]},
    {"typ":"tabelle","kopf":["Material","Temperatur","Was passiert"],"zeilen":[
     ["Teig nach dem Kneten","24–27 °C","ideale Teigtemperatur für die meisten Hefeteige"],
     ["Hefe","ca. 4 °C","fast still – für die kalte Übernachtgare"],
     ["Hefe","26–32 °C","höchste Gärleistung"],
     ["Sauerteig","28–32 °C mild, 22–25 °C säuerlicher","Temperatur steuert Säure und Aroma"],
     ["Hefe","ab ca. 50 °C","stirbt ab"],
     ["Brot im Kern","96–98 °C","durchgebacken"]]}
   ]},
   {"id":"mehl","titel":"Mehl & Mahlen","bloecke":[
    {"typ":"text","text":"Die Typenzahl gibt an, wie viele Milligramm Mineralstoffe (Asche) in 100 g Mehl-Trockenmasse stecken. Je höher die Zahl, desto mehr Randschichten und desto dunkler und kräftiger das Mehl."},
    {"typ":"tabelle","kopf":["Getreide","Typ","Farbe","Verwendung"],"zeilen":[
     ["Weizen","405","weiß","Kuchen, Kekse, Mürbteig, Soßen"],
     ["Weizen","550","hell","Brot, Brötchen, Pizza, Hefeteig – das Allroundmehl"],
     ["Weizen","812, 1050","hellbraun","kräftige Brote, Mischbrote"],
     ["Weizen","1600 / Vollkorn","dunkel","Vollkornbrote"],
     ["Dinkel","630","hell","ersetzt Weizen 550: Brot, Brötchen, Kuchen, Pizza"],
     ["Dinkel","812, 1050","hellbraun","kräftige Dinkelbrote"],

     ["Roggen","1370, 1800","dunkel","kräftige Roggenbrote"],
     ["alle","Vollkornmehl","ganzes Korn","ohne Typenzahl, da der Mineralgehalt mit der Ernte schwankt"]]},
    {"typ":"text","text":"Quelle: [Öko-Test, Mehltypen](https://www.oekotest.de/essen-trinken/mehl-typen-was-bedeuten-die-zahlen-auf-dem-mehl_11593_1.html). Faustregel beim Austauschen: Je dunkler das Mehl, desto mehr Wasser und Ruhezeit braucht der Teig."},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["muehle","Mühle"],["mahlen","Mahlen"]],"eintraege":[
     {"id":"muehle-waehlen","titel":"Die richtige Getreidemühle","kat":"muehle","beleg":"T","teil":"Ausstattung","kurz":"Für Selbstversorger lohnt eine eigene Mühle: frisches Mehl, lange haltbares Korn.","zutaten":["**Steinmahlwerk** (Naturstein oder Korund-Keramik): sehr feines Mehl, Klassiker für Brot","**Stahlmahlwerk** (Kegel): auch für ölhaltige Saaten und Gewürze, Mehl etwas gröber","**Handmühle**: für kleine Mengen und ohne Strom","**Flocker / Quetsche**: für Haferflocken und Frischkornmüsli"],"schritte":["Für regelmäßiges Brotbacken: elektrische Steinmühle mit ca. 100 g Mehl pro Minute oder mehr.","Auf stufenlose Einstellung von fein bis Schrot achten.","Keine öligen Saaten (Leinsamen, Mohn) und keinen Mais in Steinmühlen mahlen – sie verkleben die Steine."]},
     {"id":"mahlen","titel":"Richtig mahlen","kat":"mahlen","beleg":"T","teil":"Praxis","kurz":"Trockenes Korn, kurz vor dem Backen, nicht zu heiß.","zutaten":["sauberes, trockenes Korn (unter ca. 14 % Feuchte)","Mühle"],"schritte":["Korn auf Fremdkörper und Käferbefall prüfen.","Für Brot fein mahlen, für Schrotbrot grob, für Frischkornbrei mittel.","Möglichst kurz vor dem Backen mahlen; frisches Vollkornmehl kann sofort verbacken werden.","Mehl nicht zu heiß werden lassen (Faustwert: unter ca. 40–45 °C), damit Fett und Enzyme geschont werden.","Dinkel, Emmer und Einkorn nur entspelzt mahlen."]},
     {"id":"sieben","titel":"Helles Mehl aus Vollkorn sieben","kat":"mahlen","beleg":"T","teil":"Praxis","kurz":"Mit einem feinen Sieb aus Vollkornmehl ein helleres Mehl gewinnen.","zutaten":["Haarsieb oder Mehlsieb (ca. 0,2–0,3 mm Maschen)"],"schritte":["Fein gemahlenes Vollkornmehl sieben.","Das Feine ergibt ein helleres Mehl (etwa wie Typ 1050).","Die Kleie für Müsli, Brot oder als Streumittel verwenden."]},
     {"id":"lagern","titel":"Mehl und Korn lagern","kat":"mahlen","beleg":"W","teil":"Vorrat","kurz":"Korn hält Jahre, Vollkornmehl nur Wochen.","zutaten":["luftdichte, dunkle Behälter","16–20 °C, trocken"],"schritte":["Helles Mehl (405–812): ca. 12 Monate.","Dunkle Mehle (z. B. 1050, Roggen 1370): ca. 3–6 Monate.","Vollkornmehl: 3–4 Wochen, dann wird das Keimlingsfett ranzig – lieber frisch mahlen.","Ganzes Korn trocken und luftig gelagert: mehrere Jahre.","Gegen Mehlmotten: dicht schließende Gläser, regelmäßig kontrollieren, Lorbeerblatt dazulegen."]}
    ]}
   ]},
   {"id":"hefe","titel":"Hefe & Sauerteig","bloecke":[
    {"typ":"text","text":"Brot geht auf zwei Arten auf: mit Backhefe (schnell, mild) oder mit Sauerteig (langsam, aromatisch, haltbar). Beide lassen sich kombinieren."},
    {"typ":"tabelle","kopf":["Triebmittel","Menge für 1 kg Mehl","Gare","Eigenschaften"],"zeilen":[
     ["Frischhefe, schnell","20–42 g","1–2 Std.","schnell, mildes Aroma, trocknet schneller aus"],
     ["Frischhefe, lange kalte Gare","2–5 g","12–24 Std. im Kühlschrank","viel Aroma, bekömmlicher, planbar"],
     ["Trockenhefe","ca. ein Drittel der Frischhefe-Menge","wie Frischhefe","lange lagerfähig"],
     ["Sauerteig","150–300 g Anstellgut bzw. 20–40 % des Mehls versäuert","4–16 Std.","säuerlich, sehr haltbar, für Roggen nötig"]]},
    {"typ":"abschnitt","titel":"Hefe","liste":["Backhefe ist ein einzelliger Pilz (Saccharomyces cerevisiae).","Frischhefe hält im Kühlschrank ca. 2 Wochen und lässt sich einfrieren (danach etwas schwächer).","Salz und Zucker nicht direkt auf die Hefe geben; viel Fett und Zucker bremsen sie (darum gehen Hefezöpfe langsamer).","Wenig Hefe und viel Zeit ergibt das beste Brot."]},
    {"typ":"abschnitt","titel":"Sauerteig","liste":["Eine Lebensgemeinschaft aus Milchsäurebakterien und wilden Hefen.","Die Bakterien bilden Milch- und Essigsäure (Aroma, Haltbarkeit, Roggen wird backfähig), die Hefen lockern.","**Anstellgut:** ein Rest vom letzten Sauerteig, im Kühlschrank aufbewahrt, der den nächsten startet.","Säure und lange Gare bauen Phytinsäure ab – Mineralstoffe werden besser verfügbar ({{b:phytinsaeure|Phytinsäure}})."]},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[
     {"id":"sauerteig-ansetzen","titel":"Roggensauerteig ansetzen (5 Tage)","kat":"alle","beleg":"T","teil":"Grundrezept","kurz":"Aus Mehl und Wasser entsteht in fünf Tagen ein aktiver Sauerteig.","zutaten":["Roggenvollkornmehl","lauwarmes Wasser","ein Glas mit lose aufgelegtem Deckel","warmer Platz, ca. 26–28 °C"],"schritte":["Tag 1: 50 g Mehl + 50 g Wasser verrühren, abdecken.","Tag 2–4: jeden Tag 50 g Mehl + 50 g Wasser dazugeben und rühren.","Ab Tag 3 riecht es säuerlich und bildet Blasen; anfangs sind auch seltsame Gerüche normal.","Tag 5: Er verdoppelt sich in einigen Stunden und riecht angenehm säuerlich – fertig.","Vor dem Backen 1–2 EL als Anstellgut abnehmen und im Kühlschrank aufbewahren."],"hinweis":"Schimmel (pelzig, grün, schwarz, rosa) bedeutet: wegwerfen und neu beginnen."},
     {"id":"anstellgut","titel":"Anstellgut pflegen","kat":"alle","beleg":"T","teil":"Pflege","kurz":"So hält der Sauerteig jahrelang.","zutaten":["Anstellgut aus dem Kühlschrank","Mehl, Wasser"],"schritte":["Mindestens alle 1–2 Wochen füttern: 20 g Anstellgut + 50 g Mehl + 50 g Wasser.","Einige Stunden warm anspringen lassen, dann zurück in den Kühlschrank.","Für längere Pausen: dünn ausstreichen, trocknen, zerbröseln und im Glas lagern."]},
     {"id":"vorteig","titel":"Vorteig (Poolish) für Weizen und Dinkel","kat":"alle","beleg":"T","teil":"Technik","kurz":"Ein Teil des Mehls gärt vorab mit einer Prise Hefe – für Aroma und Saftigkeit.","zutaten":["200 g Mehl","200 g Wasser","1 g Frischhefe (erbsengroß)"],"schritte":["Verrühren, abdecken, 12–16 Stunden bei Zimmertemperatur reifen lassen.","Am nächsten Tag mit dem restlichen Teig verkneten.","Die Hefemenge im Hauptteig dabei stark verringern."]}
    ]}

   {"id":"dinkel","titel":"Dinkel richtig backen","bloecke":[
    {"typ":"text","text":"Dinkel ist nicht schwerer als Weizen, er ist empfindlicher. Sein Kleber ist dehnbar, aber wenig stabil. Wer ihn wie Weizen knetet und schnell gehen lässt, bekommt flache, trockene Brote. Mit fünf Regeln gelingt er."},
    {"typ":"tabelle","kopf":["Problem","Ursache","Lösung"],"zeilen":[
     ["Teig wird klebrig und reißt","überknetet – das schwache Klebergerüst zerfällt","kürzer kneten: ca. 5 Min. langsam + 1–2 Min. schnell; lieber dehnen und falten"],
     ["Brot läuft breit","wenig stabiler Kleber","Kastenform oder Gärkörbchen; straff wirken; Teig etwas fester halten"],
     ["Brot ist trocken und krümelt","Dinkel nimmt Wasser schnell auf, gibt es aber schnell wieder ab","Kochstück, Brühstück oder Quellstück; Vorteig; kühle, lange Gare"],
     ["Kaum Volumen","Gas entweicht, Übergare","kühle Gare, nicht übergehen lassen; Vorteig für Stabilität"],
     ["Teig zu weich","zu viel Wasser auf einmal","Wasser zurückhalten und nach und nach zugeben"]]},
    {"typ":"abschnitt","titel":"Die fünf Dinkel-Regeln [T]","nummern":["**Sanft und kurz kneten.** Teig nur so lange kneten, bis er sich glatt anfühlt. Danach während der Gare 2–3-mal dehnen und falten – das stärkt das Netz ohne es zu zerreißen.","**Wasser binden statt nur zugeben.** Ein Kochstück oder Brühstück macht das Brot saftig und länger frisch (siehe unten).","**Kühl und lange gehen lassen.** Teigtemperatur ca. 24–26 °C; am besten über Nacht im Kühlschrank.","**Mit Vorteig oder Sauerteig arbeiten.** Säure und Vorteig stabilisieren den Kleber und bringen Aroma.","**Form geben.** Kastenform oder Gärkörbchen; nicht übergehen lassen – lieber etwas zu früh in den Ofen."]},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[
     {"id":"kochstueck","titel":"Kochstück","kat":"alle","beleg":"T","teil":"Technik","kurz":"Ein kleiner Teil des Mehls wird mit Wasser zu einem Pudding gekocht. Die verkleisterte Stärke hält viel mehr Wasser.","zutaten":["5 % des Mehls (z. B. 25 g bei 500 g)","die fünffache Menge Wasser oder Milch (125 g)"],"schritte":["Unter Rühren aufkochen, bis ein fester Pudding entsteht.","Abgedeckt abkühlen lassen (mind. auf Zimmertemperatur).","Mit in den Hauptteig geben; das Wasser aus dem Kochstück zählt zur Gesamtmenge."]},
     {"id":"bruehstueck","titel":"Brühstück","kat":"alle","beleg":"T","teil":"Technik","kurz":"Für Vollkornschrot, Haferflocken oder Saaten: mit kochendem Wasser überbrühen.","zutaten":["Schrot, Flocken oder Saaten","gleiche bis doppelte Menge kochendes Wasser","etwas Salz aus dem Rezept"],"schritte":["Überbrühen, abdecken, mindestens 4 Stunden oder über Nacht quellen lassen.","In den Hauptteig geben."]},
     {"id":"dehnen-falten","titel":"Dehnen und Falten","kat":"alle","beleg":"T","teil":"Technik","kurz":"Stärkt den Teig ohne langes Kneten.","zutaten":["nasse Hand","Schüssel"],"schritte":["Teigrand greifen, nach oben dehnen und zur Mitte falten.","Schüssel um ein Viertel drehen, 4-mal wiederholen.","In der ersten Stunde der Gare 2–3-mal im Abstand von 20–30 Minuten."]}
    ]}
   ]},
   {"id":"rezepte","titel":"Rezepte","bloecke":[
    {"typ":"text","text":"Alle Rezepte sind für Haushaltsöfen. „Ober-/Unterhitze“ ist gemeint, wenn nicht anders angegeben. Eine feuerfeste Schale mit Wasser im Ofen sorgt für Dampf und eine bessere Kruste."},
    {"typ":"karten","art":"rezept","filter":[["alle","Alle"],["dinkel","Dinkel"],["weizen","Weizen"],["roggen","Roggen & Sauerteig"],["sonstiges","Gerste, Hafer & mehr"]],"eintraege":[
     {"id":"dinkel-kasten","titel":"Dinkel-Vollkornbrot in der Kastenform (über Nacht)","kat":"dinkel","menge":"1 Kastenform (30 cm)","zeit":"20 Min. + 12 Std. + 60 Min. Backen","zutaten":["500 g Dinkelvollkornmehl (frisch gemahlen)","Kochstück aus 25 g Dinkelmehl + 125 g Wasser","300 g kaltes Wasser","5 g Frischhefe","12 g Salz","1 EL Apfelessig","100 g Saaten (Sonnenblumenkerne, Leinsamen), überbrüht"],"schritte":["Am Vorabend Kochstück und Brühstück vorbereiten, abkühlen lassen.","Alle Zutaten ca. 5 Minuten langsam zu einem weichen Teig verkneten.","In die gefettete Form füllen, glatt streichen, abdecken.","Über Nacht 10–12 Stunden im Kühlschrank gehen lassen.","Morgens 30 Minuten temperieren, Ofen auf 230 °C vorheizen.","Mit Dampf 15 Minuten bei 230 °C, dann 40–45 Minuten bei 200 °C backen.","Aus der Form nehmen und auf einem Gitter auskühlen."],"tipp":"Der Essig stabilisiert den Dinkelkleber; das Kochstück hält das Brot tagelang saftig."},
     {"id":"dinkel-broetchen","titel":"Dinkelbrötchen über Nacht","kat":"dinkel","menge":"10 Brötchen","zeit":"15 Min. + 12 Std. + 20 Min.","zutaten":["500 g Dinkelmehl Typ 630","320 g kaltes Wasser","3 g Frischhefe","10 g Salz","10 g Butter oder Öl"],"schritte":["Alles 5 Minuten langsam, 1 Minute schnell kneten.","In der ersten Stunde 2-mal dehnen und falten.","Abgedeckt 10–12 Stunden in den Kühlschrank.","Teig auf bemehlte Fläche geben, 10 Stücke abstechen, rund schleifen.","30–45 Minuten gehen lassen, Ofen auf 240 °C vorheizen.","Mit Dampf 18–20 Minuten goldbraun backen."]},
     {"id":"weizen-bauernbrot","titel":"Weizen-Bauernbrot mit Vorteig","kat":"weizen","menge":"1 Laib","zeit":"14 Std. gesamt","zutaten":["Vorteig: 200 g Weizenmehl 550, 200 g Wasser, 1 g Hefe","300 g Weizenmehl 1050","130 g Wasser","5 g Frischhefe","12 g Salz"],"schritte":["Vorteig 12–16 Stunden reifen lassen.","Mit allen Zutaten 8–10 Minuten kneten, bis der Teig glatt und elastisch ist.","90 Minuten gehen lassen, dabei einmal falten.","Rund wirken, im Gärkörbchen 45–60 Minuten gehen lassen.","Bei 250 °C mit Dampf einschießen, nach 10 Minuten auf 210 °C, insgesamt ca. 45 Minuten."]},
     {"id":"roggenmisch","titel":"Roggenmischbrot mit Sauerteig","kat":"roggen","menge":"1 Laib (ca. 1 kg)","zeit":"Vortag + 4 Std.","zutaten":["Sauerteig: 200 g Roggenmehl 1150, 200 g Wasser, 20 g Anstellgut","200 g Roggenmehl 1150","200 g Weizenmehl 1050","220 g Wasser","5 g Frischhefe (optional, für sicheren Trieb)","14 g Salz","1 TL Brotgewürz (Kümmel, Koriander, Fenchel)"],"schritte":["Sauerteig verrühren, 12–16 Stunden bei Zimmertemperatur reifen lassen.","Mit allen Zutaten 6–8 Minuten verkneten (Roggenteig bleibt klebrig).","30 Minuten ruhen lassen.","Mit nassen Händen zum Laib formen, ins bemehlte Gärkörbchen.","60–90 Minuten gehen lassen, bis Risse an der Oberfläche entstehen.","Bei 250 °C mit Dampf 10 Minuten, dann bei 200 °C ca. 45 Minuten backen."],"tipp":"Erst nach 24 Stunden anschneiden – Roggenbrot muss nachreifen."},
     {"id":"roggen-vollkorn","titel":"Saftiges Roggen-Vollkornbrot","kat":"roggen","menge":"1 Kastenform","zeit":"Vortag + 4 Std. + 2 Std. Backen","zutaten":["Sauerteig: 300 g Roggenvollkornschrot, 300 g Wasser, 30 g Anstellgut","Brühstück: 100 g Roggenschrot, 50 g Sonnenblumenkerne, 200 g kochendes Wasser","200 g Roggenvollkornmehl","100 g Wasser","15 g Salz","1 EL Rübensirup"],"schritte":["Sauerteig und Brühstück am Vortag ansetzen.","Alles gut verrühren (nicht kneten), Teig wird breiig.","In gefettete Kastenform füllen, mit nassem Löffel glätten.","2–3 Stunden gehen lassen, bis die Oberfläche Risse zeigt.","Bei 220 °C 15 Minuten, dann bei 180 °C ca. 75 Minuten backen.","In Tuch gewickelt 1–2 Tage ruhen lassen."]},
     {"id":"hefezopf","titel":"Hefezopf","kat":"weizen","menge":"1 Zopf","zeit":"3 Std.","zutaten":["500 g Weizenmehl 550 oder Dinkel 630","200 ml lauwarme Milch","20 g Frischhefe","70 g Zucker","80 g weiche Butter","1 Ei","1 Prise Salz, Zitronenabrieb","1 Eigelb zum Bestreichen"],"schritte":["Alles außer der Butter 5 Minuten kneten, dann Butter nach und nach einkneten.","Abgedeckt 60–90 Minuten gehen lassen.","In 3 Stränge teilen, flechten, auf das Blech legen.","Nochmals 30–45 Minuten gehen lassen, mit Eigelb bestreichen.","Bei 180 °C ca. 30 Minuten backen."],"tipp":"Mit Dinkel 630 etwas weniger Milch nehmen und kürzer kneten."},
     {"id":"pizza","titel":"Pizzateig mit langer Gare","kat":"weizen","menge":"4 Pizzen","zeit":"10 Min. + 24 Std.","zutaten":["500 g Weizenmehl 550 (oder Tipo 00, oder Dinkel 630)","325 g kaltes Wasser","2 g Frischhefe","12 g Salz","1 EL Olivenöl"],"schritte":["Alles zu glattem Teig kneten (Dinkel nur kurz).","Abgedeckt 24 Stunden in den Kühlschrank.","In 4 Kugeln teilen, 2 Stunden bei Zimmertemperatur entspannen lassen.","Von Hand ausziehen, belegen, auf dem heißesten Blech oder Pizzastein bei maximaler Hitze 7–10 Minuten backen."]},
     {"id":"gerstenfladen","titel":"Gerstenfladen","kat":"sonstiges","menge":"6 Fladen","zeit":"30 Min.","zutaten":["250 g Gerstenmehl","100 g Weizen- oder Dinkelmehl","250 ml Wasser oder Joghurt","1 TL Salz","1 TL Backpulver","2 EL Öl"],"schritte":["Alles zu einem weichen Teig verrühren, 10 Minuten ruhen lassen.","6 Kugeln formen, flach drücken.","In einer heißen Pfanne ohne Fett je Seite 2–3 Minuten backen."],"tipp":"Gerste allein hält kaum zusammen; etwas Weizen oder Dinkel hilft."},
     {"id":"graupensuppe","titel":"Graupeneintopf","kat":"sonstiges","menge":"4 Portionen","zeit":"60 Min.","zutaten":["150 g Perlgraupen","2 Möhren, 1 Stück Sellerie, 1 Stange Lauch","2 Kartoffeln","1,5 l Brühe","Lorbeer, Majoran, Petersilie","nach Wunsch Räucherwurst"],"schritte":["Graupen abspülen.","Gemüse würfeln, mit Graupen und Brühe aufkochen.","45 Minuten köcheln, bis die Graupen weich sind.","Mit Majoran und Petersilie abschmecken."]},
     {"id":"gruenkern","titel":"Grünkernbratlinge","kat":"dinkel","menge":"8 Stück","zeit":"45 Min.","zutaten":["150 g Grünkern, grob geschrotet","300 ml Gemüsebrühe","1 Zwiebel, 1 Möhre","1 Ei","2 EL Haferflocken","Majoran, Salz, Pfeffer","Öl zum Braten"],"schritte":["Grünkern in Brühe 10 Minuten köcheln, 20 Minuten quellen lassen.","Zwiebel und geriebene Möhre andünsten, mit Ei, Flocken und Gewürzen untermischen.","Bratlinge formen, in Öl je Seite 4 Minuten braten."],"tipp":"Grünkern ist halbreif geernteter, gedarrter Dinkel mit würzigem Rauchgeschmack."},
     {"id":"haferbrot","titel":"Schnelles Haferflockenbrot ohne Hefe","kat":"sonstiges","menge":"1 Kastenform","zeit":"10 Min. + 60 Min.","zutaten":["300 g Haferflocken","200 g Dinkelvollkornmehl","500 g Joghurt oder Buttermilch","1 Päckchen Backpulver","1 TL Natron","1,5 TL Salz","Saaten nach Wunsch"],"schritte":["Alles verrühren.","In die gefettete Form füllen.","Bei 180 °C ca. 60 Minuten backen."]}
    ]}

   {"id":"anbau","titel":"Anbau & Ernte","bloecke":[

     {"id":"dreschen","titel":"Schneiden, dreschen, reinigen","kat":"alle","beleg":"T","teil":"Handarbeit","kurz":"So geht es ohne Maschinen.","zutaten":["Sichel oder Schere","Kissenbezug oder Dreschflegel","Ventilator oder Wind"],"schritte":["Halme schneiden, zu Garben binden, 1–2 Wochen trocken nachreifen lassen.","Ähren in einen Kissenbezug geben und mit einem Stock schlagen.","Worfeln: Korn vor dem Ventilator von einer Schüssel in die andere rieseln lassen – die Spreu fliegt weg.","Korn nachtrocknen und luftig lagern."]},

   {"id":"gesundheit","titel":"Gesundheit","bloecke":[
    {"typ":"text","text":"Getreide liefert Energie, Eiweiß, Ballaststoffe, B-Vitamine und Mineralstoffe – vor allem als Vollkorn. Für manche Menschen ist Gluten allerdings ein Problem."},
    {"typ":"tabelle","kopf":["Thema","Was gilt","Einordnung"],"zeilen":[
     ["Zöliakie","Autoimmunerkrankung durch Gluten (vor allem die Gliadin-Fraktion). Betroffene müssen Weizen, Dinkel, Emmer, Einkorn, Roggen und Gerste streng meiden – auch Dinkel ist nicht geeignet.","[W]"],
     ["Hafer bei Zöliakie","Hafer-Eiweiß (Avenin) wird meist vertragen, normaler Hafer ist aber oft mit Weizen verunreinigt. Nur als zertifiziert glutenfrei.","[W]"],
     ["Weizen- oder Glutensensitivität","Beschwerden ohne Zöliakie oder Allergie; Ursachen noch unklar, diskutiert werden u. a. FODMAPs und bestimmte Eiweiße (ATIs).","[W] Forschung läuft"],
     ["Lange Teigführung","Lange Gare baut schwer verdauliche Zucker (Fruktane, FODMAPs) und Phytinsäure ab – Brot wird für viele bekömmlicher.","[W]"],
     ["Vollkorn","mehr Ballaststoffe, Mineralstoffe, Vitamine; sättigt länger, verbunden mit geringerem Risiko für Herz-Kreislauf-Erkrankungen und Typ-2-Diabetes.","[W]"],
     ["Beta-Glucane aus Hafer und Gerste","3 g täglich können einen erhöhten Cholesterinspiegel senken (in der EU zugelassene Gesundheitsangabe).","[W]"],
     ["Dinkel ist gesünder als Weizen","Die Nährstoffe sind sehr ähnlich; Unterschiede hängen mehr von Sorte, Mehltyp und Teigführung ab.","[W] Mythos teilweise"],
     ["Frischkorn und Urgetreide nach Hildegard","Dinkel als bestes Korn für Leib und Seele","[A] Hildegard-Heilkunde"]]},
    {"typ":"hinweis","text":"Bei Verdacht auf Zöliakie nicht vorher glutenfrei essen, sondern zuerst ärztlich testen lassen – sonst kann der Test falsch ausfallen."}
   ]},

 {"id":"mais","titel":"Mais, Hirse & Buchweizen","nr":"G-02","text":"Glutenfreie Körner für die Selbstversorgung: Mais aus Amerika, Hirse als altes europäisches Grundnahrungsmittel und Buchweizen als Pseudogetreide.","stichworte":["Mais","Polenta","Popcorn","Nixtamalisierung","Masa","Hirse","Sorghum","Buchweizen","Pseudogetreide","Quinoa","Amaranth","glutenfrei","Drei Schwestern"],"pflanzen":[],
  "kurz":"Drei Körner ohne Kleber: Mais, Hirse und Buchweizen. Sie backen kein lockeres Brot, sind aber nahrhaft, glutenfrei und für Garten und Küche wertvoll – Buchweizen wächst sogar auf magerem Boden in nur zehn Wochen.",

  "reiter":[

    {"typ":"hinweis","text":"**Zöliakie:** Glutenfrei heißt nur, dass das Korn selbst kein Gluten hat. Bei Zöliakie nur Produkte mit Glutenfrei-Kennzeichnung verwenden – Verunreinigungen in Mühle und Verarbeitung sind häufig."}

   {"id":"mais","titel":"Mais","bloecke":[
    {"typ":"abschnitt","titel":"Sorten","liste":["**Zuckermais:** süß, in der Milchreife geerntet, als Gemüse.","**Hartmais / Flint:** harte, glasige Körner für Polenta und Grieß.","**Zahnmais / Dent:** weiche Stärke, für Mehl und Tierfutter.","**Popcornmais:** sehr harte Schale; das Wasser im Korn verdampft und sprengt es.","**Alte Sorten** in Rot, Blau oder Bunt bieten mehr Farbstoffe ({{b:anthocyane|Anthocyane}})."]},
    {"typ":"abschnitt","titel":"Nixtamalisierung","liste":["In Mittelamerika werden Maiskörner seit Jahrtausenden in Kalkwasser gekocht, dann gewaschen und gemahlen – daraus wird Masa für Tortillas.","Dabei wird das Vitamin Niacin (B3) freigesetzt, das im Mais sonst gebunden ist, und der Teig wird formbar [W].","Wo Mais ohne dieses Verfahren zur Hauptnahrung wurde, etwa im Süden Europas und der USA, trat die Mangelkrankheit Pellagra auf [W].","Für den Haushalt: fertiges Masa-Harina-Mehl kaufen oder nach Anleitung mit Speisekalk (Calciumhydroxid) arbeiten."]},
    {"typ":"abschnitt","titel":"Anbau","liste":["Ab Mitte Mai säen oder vorgezogene Pflanzen setzen; Mais braucht Wärme.","**In Blöcken pflanzen**, nicht in einer Reihe: Mais wird vom Wind bestäubt. Mindestens 4 × 4 Pflanzen, Abstand ca. 40 cm.","**Drei Schwestern (Milpa):** Mais als Stütze, Stangenbohnen ranken daran und binden Stickstoff, Kürbis beschattet den Boden. Ein altes Mischkultursystem der amerikanischen Ureinwohner [T].","Starkzehrer – ideal im 1. Jahr auf dem {{s:huegelbeet|Hügelbeet}}.","Verschiedene Sorten nicht nebeneinander, sie kreuzen sich (Zuckermais wird sonst mehlig)."]},
    {"typ":"abschnitt","titel":"Ernte","liste":["**Zuckermais:** wenn die Fäden braun sind und beim Eindrücken eines Korns milchiger Saft austritt. Sofort essen – der Zucker wandelt sich schnell in Stärke.","**Körnermais und Popcorn:** am Stängel ausreifen lassen, bis die Körner hart sind; Kolben aufhängen und nachtrocknen."]}
   ]},
   {"id":"hirse","titel":"Hirse","bloecke":[
    {"typ":"text","text":"Bevor Kartoffel und Weizen sich durchsetzten, war Hirsebrei in Mitteleuropa über Jahrhunderte eine Grundnahrung – man denke an den süßen Brei im Märchen."},
    {"typ":"abschnitt","titel":"Arten","liste":["**Rispenhirse (Goldhirse):** die übliche geschälte Speisehirse.","**Braunhirse:** ungeschälte, gemahlene Hirse; in der Naturkost als Mineralstoffquelle beliebt [T].","**Kolbenhirse:** bekannt als Vogelfutter, auch essbar.","**Sorghum (Mohrenhirse):** Grundnahrung in Afrika, extrem hitzefest.","**Teff:** Zwerghirse aus Äthiopien, für Injera-Fladen."]},
    {"typ":"abschnitt","titel":"In der Küche","liste":["Vor dem Kochen in einem Sieb mit heißem Wasser waschen: Das entfernt Staub und Bitterstoffe auf der Oberfläche [T].","Verhältnis: 1 Teil Hirse, 2–2,5 Teile Wasser, 10 Minuten köcheln, 10–15 Minuten quellen lassen.","Hirse wird schnell ranzig – kühl und dunkel lagern, rasch verbrauchen.","Hirse enthält Kieselsäure, Eisen und Magnesium; das Eisen wird zusammen mit Vitamin C besser aufgenommen [W]."]},
    {"typ":"abschnitt","titel":"Anbau","liste":["Aussaat Mitte Mai in warmen Boden, Reihenabstand 25–30 cm.","Sehr trockenheitsverträglich, reift in ca. 90–100 Tagen.","Ernte, wenn sich die Rispen neigen und die Körner hart sind; Vögel lieben Hirse – Netz verwenden.","Speisehirse muss geschält werden; das ist zu Hause aufwendig."]}
   ]},
   {"id":"buchweizen","titel":"Buchweizen","bloecke":[
    {"typ":"text","text":"Buchweizen ist ein Knöterichgewächs, verwandt mit Sauerampfer und Rhabarber. Seine dreikantigen Nüsschen ähneln Bucheckern – daher der Name."},
    {"typ":"abschnitt","titel":"Pflanze und Anbau","liste":["Einjährig, 20–60 cm, frostempfindlich; weiße bis rosa Blüten Juni–August.","**Schnell:** von der Aussaat bis zur Ernte nur 10–12 Wochen – auch als Zweitfrucht nach Frühkartoffeln.","**Genügsam:** wächst auf mageren, sauren und sandigen Böden.","**Bienenweide:** reich an Nektar; Buchweizenhonig ist dunkel und kräftig.","**Gründüngung:** unterdrückt Unkraut und lockert den Boden.","Aussaat Mitte Mai bis Juli, 50–60 g pro 10 m²."]},
    {"typ":"abschnitt","titel":"Inhaltsstoffe und Wirkung","liste":["Glutenfrei, eiweiß- und stärkereich [W].","Das Kraut enthält viel Rutin; Buchweizenkraut-Tee verringerte in einer kleinen Studie mit 67 Teilnehmenden Beinödeme bei Venenschwäche [W].","**Fagopyrin:** roter Farbstoff in Kraut und Fruchtschale. In größeren Mengen macht er die Haut lichtempfindlich (Fagopyrismus) – vor allem bekannt von Weidetieren ({{b:fagopyrin|Fagopyrin}}). Geschälte Körner enthalten nur sehr wenig."]},
    {"typ":"hinweis","text":"Buchweizen kann starke Allergien auslösen. Wer auf Buchweizen reagiert, sollte auch auf versteckten Buchweizen in Mehlmischungen und Nudeln achten."}
   ]},

     {"id":"polenta","titel":"Cremige Polenta","kat":"mais","menge":"4 Portionen","zeit":"40 Min.","zutaten":["250 g Maisgrieß (Polenta)","1 l Wasser oder Brühe","1 TL Salz","40 g Butter","50 g Parmesan"],"schritte":["Wasser mit Salz aufkochen.","Grieß unter ständigem Rühren einrieseln lassen.","Bei kleiner Hitze 30–40 Minuten unter häufigem Rühren garen (Instant-Polenta: 5 Minuten).","Butter und Käse einrühren."],"tipp":"Reste in eine Form streichen, fest werden lassen, in Scheiben braten oder grillen."},
     {"id":"maisbrot","titel":"Maisbrot (Cornbread)","kat":"mais","menge":"1 Form (20 × 20 cm)","zeit":"35 Min.","zutaten":["150 g Maismehl oder feiner Maisgrieß","150 g Weizen- oder Dinkelmehl","1 Päckchen Backpulver","1 TL Salz, 2 EL Zucker","2 Eier","250 ml Buttermilch","60 g geschmolzene Butter"],"schritte":["Trockene und feuchte Zutaten getrennt mischen, dann kurz verrühren.","In die gefettete Form füllen.","Bei 200 °C 20–25 Minuten backen."]},
     {"id":"popcorn","titel":"Popcorn aus eigenem Mais","kat":"mais","menge":"1 Schüssel","zeit":"10 Min.","zutaten":["60 g Popcornmais","2 EL Öl","Salz oder Zucker"],"schritte":["Öl in einem Topf mit Deckel erhitzen.","Mais zugeben, Deckel drauf, Topf leicht schwenken.","Wenn es kaum noch knallt, vom Herd nehmen, würzen."],"tipp":"Selbst gezogener Popcornmais muss einige Wochen trocknen, sonst poppt er schlecht."},
     {"id":"tortillas","titel":"Maistortillas aus Masa Harina","kat":"mais","menge":"12 Stück","zeit":"30 Min.","zutaten":["250 g Masa Harina (nixtamalisiertes Maismehl)","ca. 330 ml warmes Wasser","½ TL Salz"],"schritte":["Zu einem weichen, nicht klebenden Teig kneten, 15 Minuten ruhen lassen.","12 Kugeln formen, zwischen Backpapier flach drücken (Topfboden oder Tortillapresse).","In einer heißen Pfanne ohne Fett je Seite ca. 1 Minute backen.","In einem Tuch warm halten."],"tipp":"Normales Maismehl funktioniert nicht – der Teig hält nur nach der Nixtamalisierung."},
     {"id":"hirsebrei","titel":"Süßer Hirsebrei mit Apfel","kat":"hirse","menge":"2 Portionen","zeit":"25 Min.","zutaten":["100 g Hirse","400 ml Milch oder Hafermilch","1 Apfel","1 Prise Salz, Zimt","Honig, Nüsse"],"schritte":["Hirse heiß waschen.","Mit Milch und Salz aufkochen, 10 Minuten köcheln, 10 Minuten quellen lassen.","Geriebenen Apfel und Zimt unterrühren, mit Honig und Nüssen servieren."]},
     {"id":"hirsepfanne","titel":"Hirse-Gemüse-Pfanne","kat":"hirse","menge":"3 Portionen","zeit":"30 Min.","zutaten":["200 g Hirse","500 ml Gemüsebrühe","1 Zucchini, 1 Paprika, 1 Zwiebel","Kräuter, z. B. {{p:p02|Giersch}}","Feta nach Wunsch"],"schritte":["Hirse in Brühe garen.","Gemüse anbraten, Hirse untermischen.","Mit frischen Kräutern und Feta servieren."]},
     {"id":"hirsebratlinge","titel":"Hirsebratlinge","kat":"hirse","menge":"8 Stück","zeit":"40 Min.","zutaten":["150 g Hirse","300 ml Brühe","1 Möhre, 1 Zwiebel","1 Ei","3 EL Haferflocken","Kräuter, Salz, Pfeffer"],"schritte":["Hirse garen und abkühlen lassen.","Mit geriebener Möhre, gedünsteter Zwiebel, Ei, Flocken und Kräutern mischen.","Bratlinge formen und in Öl braten."]},
     {"id":"galettes","titel":"Buchweizen-Galettes","kat":"buchweizen","menge":"6 Stück","zeit":"15 Min. + 2 Std.","zutaten":["200 g Buchweizenmehl","1 Ei","450 ml Wasser","1 TL Salz","Butter","Füllung: Ei, Käse, Schinken oder Spinat"],"schritte":["Mehl, Ei, Salz und Wasser glatt rühren, 2 Stunden ruhen lassen.","In einer heißen, gebutterten Pfanne dünn ausbacken.","Belegen, Ränder einschlagen, kurz fertig garen."],"tipp":"Bretonische Spezialität, von Natur aus glutenfrei."},
     {"id":"kascha","titel":"Kascha (Buchweizengrütze)","kat":"buchweizen","menge":"3 Portionen","zeit":"25 Min.","zutaten":["200 g Buchweizen","400 ml Wasser","Salz, Butter","Zwiebeln und Pilze nach Wunsch"],"schritte":["Buchweizen in trockener Pfanne kurz rösten.","Mit Wasser und Salz aufkochen, 15 Minuten bei kleiner Hitze garen.","Mit Butter und gebratenen Zwiebeln und Pilzen servieren."]},

 {"id":"bier","titel":"Bier brauen","nr":"G-03","text":"Vom Gerstenkorn zum Hausbier: Mälzen, Maischen, Läutern, Hopfen kochen, Gären, Abfüllen – mit Grundrezept und den rechtlichen Regeln für Hobbybrauer.","stichworte":["Bier","brauen","Malz","Mälzen","Hopfen","Maischen","Läutern","Würze","Stammwürze","Plato","obergärig","untergärig","Hauptzollamt","Biersteuer"],"pflanzen":[],
  "kurz":"Bier ist flüssiges Getreide: Malz liefert den Zucker, Hopfen die Bittere, Hefe den Alkohol und die Kohlensäure. Mit Küchenausstattung und etwas Geduld braut man 20 Liter an einem Tag.",
  "steckbrief":[["Grundzutaten","Wasser, Malz, Hopfen, Hefe"],["Zeitaufwand","Brautag ca. 6–8 Std., dann 1 Woche Gärung, 2–4 Wochen Reifung"],["Ausstattung","Topf ab 30 l, Thermometer, Läuterhilfe, Gäreimer, Flaschen"],["Obergärig","Ale, Weizen, Kölsch: Gärung 15–24 °C"],["Untergärig","Pils, Helles: Gärung 8–12 °C"],["Recht","bis 200 l pro Jahr steuerfrei; vorher beim Hauptzollamt anmelden"]],
  "reiter":[
   {"id":"zutaten","titel":"Zutaten","bloecke":[
    {"typ":"tabelle","kopf":["Zutat","Aufgabe","Beispiele"],"zeilen":[
     ["Malz","liefert Zucker, Farbe, Körper","Pilsner Malz (hell), Münchner Malz (vollmundig), Weizenmalz, Karamellmalz (süß, Farbe), Röstmalz (dunkel)"],
     ["Hopfen","Bittere, Aroma, Haltbarkeit","Bitterhopfen (z. B. Magnum), Aromahopfen (z. B. Hallertauer, Tettnanger, Saazer)"],
     ["Hefe","vergärt Zucker zu Alkohol und Kohlensäure","obergärige Ale- und Weizenhefen, untergärige Lagerhefen"],
     ["Wasser","über 90 % des Biers","weiches Wasser für Pils, härteres für dunkle Biere"]]},
    {"typ":"abschnitt","titel":"Mälzen: aus Gerste wird Malz [T]","nummern":["**Weichen:** Gerste 2–3 Tage abwechselnd unter Wasser und an der Luft, bis sie ca. 45 % Wasser aufgenommen hat.","**Keimen:** 4–6 Tage bei ca. 15 °C ausgebreitet, täglich wenden. Der Blattkeim soll ca. zwei Drittel der Kornlänge erreichen. Dabei entstehen die Enzyme, die später die Stärke in Zucker umbauen.","**Darren:** schonend trocknen, für helles Malz zum Schluss ca. 80–85 °C; höhere Temperaturen ergeben dunkleres Malz.","**Entkeimen:** Wurzelkeime abreiben.","Für den Anfang ist gekauftes Malz einfacher; Selbermälzen ist ein Projekt für Fortgeschrittene."]},
    {"typ":"text","text":"Der Hopfen (Humulus lupulus) ist ein Hanfgewächs. Seine Dolden enthalten Bitterstoffe (Alpha-Säuren), die erst beim Kochen bitter werden, und ätherische Öle für das Aroma. Er wirkt zudem beruhigend und wird in Schlaftees genutzt [W]."}
   ]},
   {"id":"ablauf","titel":"Brauablauf","bloecke":[
    {"typ":"text","text":"Der Brautag folgt einer festen Reihenfolge. Sauberkeit ist ab dem Abkühlen der Würze das Wichtigste – alles, was danach die Würze berührt, muss desinfiziert sein."},
    {"typ":"abschnitt","titel":"Schritt für Schritt","nummern":["**Schroten:** Malz grob brechen, Spelzen sollen ganz bleiben (sie bilden später den Filter). Fertig geschrotetes Malz geht auch.","**Einmaischen:** Schrot in ca. 3–4 Liter Wasser pro kg Malz einrühren.","**Rasten (Maischen):** Die Temperatur stufenweise anheben und halten (siehe Tabelle). Malzenzyme bauen dabei Stärke zu Zucker ab ({{b:amylasen|Amylasen}}).","**Jodprobe:** Ein Tropfen Maische mit Jodlösung darf sich nicht mehr blau-schwarz färben – dann ist die Stärke verzuckert.","**Läutern:** Die Flüssigkeit (Würze) von den Treber-Resten trennen, z. B. über einen Läutereimer mit Siebboden.","**Nachgießen:** Den Treber mit ca. 75–78 °C heißem Wasser spülen, bis die Zielmenge erreicht ist.","**Würzekochen:** 60–90 Minuten sprudelnd kochen; Bitterhopfen zu Beginn, Aromahopfen in den letzten 10 Minuten.","**Ausschlagen und Kühlen:** Würze möglichst schnell auf Anstelltemperatur kühlen (Kühlspirale, Wasserbad).","**Stammwürze messen:** mit Spindel oder Refraktometer in Grad Plato (°P). 12 °P ergeben etwa 5 % Alkohol.","**Hefe anstellen:** Würze belüften, Hefe zugeben, Gäreimer mit Gärröhrchen verschließen.","**Hauptgärung:** ca. 5–8 Tage bei passender Temperatur, bis die Restextraktmessung zwei Tage gleich bleibt.","**Abfüllen:** Zur Karbonisierung pro Liter ca. 5–7 g Zucker zugeben, in Bügel- oder Kronkorkenflaschen füllen.","**Nachgärung und Reifung:** 1 Woche warm, dann 2–4 Wochen kühl lagern."]},
    {"typ":"tabelle","kopf":["Rast","Temperatur","Wirkung"],"zeilen":[
     ["Eiweißrast (optional)","50–55 °C","baut Eiweiß ab, besserer Schaum und Klarheit"],
     ["Maltoserast","62–65 °C","Beta-Amylase bildet vergärbaren Malzzucker – mehr Alkohol, schlanker"],
     ["Verzuckerungsrast","70–72 °C","Alpha-Amylase bildet auch unvergärbare Zucker – mehr Körper"],
     ["Abmaischen","76–78 °C","stoppt die Enzyme, Maische wird flüssiger"]]},
    {"typ":"text","text":"Rastdauer meist 30–60 Minuten je Stufe. Die Werte sind übliche Richtwerte aus Brauanleitungen."}
   ]},
   {"id":"rezept","titel":"Grundrezept","bloecke":[
    {"typ":"karten","art":"rezept","filter":[["alle","Alle"]],"eintraege":[
     {"id":"hausbier","titel":"Helles Hausbier (obergärig, 20 Liter)","kat":"alle","menge":"ca. 20 l, ca. 12 °P, ca. 5 % Alkohol","zeit":"Brautag 6–7 Std. + 4–5 Wochen","zutaten":["4,0 kg Pilsner Malz, geschrotet","0,5 kg Münchner Malz, geschrotet","15 l Hauptguss + ca. 15 l Nachguss","25 g Bitterhopfen (z. B. Magnum) zu Kochbeginn","30 g Aromahopfen (z. B. Hallertauer Mittelfrüh) 10 Min. vor Ende","1 Päckchen obergärige Trockenhefe (Ale)","120–140 g Zucker zum Abfüllen","Desinfektionsmittel, Gäreimer mit Gärröhrchen, ca. 40 Flaschen à 0,5 l"],"schritte":["Hauptguss auf ca. 57 °C erhitzen, Schrot einrühren – die Maische fällt auf ca. 52 °C.","52 °C 15 Minuten halten.","Auf 63 °C erhitzen, 45 Minuten rasten.","Auf 72 °C erhitzen, 30 Minuten rasten, Jodprobe machen.","Auf 78 °C erhitzen, in den Läutereimer umfüllen, 15 Minuten ruhen lassen.","Läutern, mit 78 °C heißem Nachguss auf ca. 25 l Würze auffüllen.","70 Minuten kochen: Bitterhopfen zu Beginn, Aromahopfen 10 Minuten vor Ende.","Rasch auf ca. 20 °C kühlen, in den desinfizierten Gäreimer füllen, Stammwürze messen.","Hefe einstreuen, verschließen, 7 Tage bei 18–20 °C gären lassen.","Mit Zucker abfüllen, 1 Woche bei Zimmertemperatur, dann 3 Wochen kühl reifen lassen."],"tipp":"Ein Brautagebuch mit Temperaturen und Messwerten hilft, beim nächsten Mal noch besser zu werden."}
    ]},
    {"typ":"text","text":"Die Mengen sind ein übliches Einsteigerrezept. Hopfenmengen hängen vom Alpha-Säure-Gehalt der jeweiligen Sorte ab – die Angabe auf der Packung beachten."}
   ]},
   {"id":"sicherheit","titel":"Sicherheit & Recht","bloecke":[
    {"typ":"abschnitt","titel":"Sicherheit","liste":["**Hygiene:** Alles, was die abgekühlte Würze berührt, desinfizieren – sonst verderben fremde Keime das Bier.","**Flaschenbomben:** Nie abfüllen, bevor die Hauptgärung beendet ist, und die Zuckermenge nicht überschreiten. Zu viel Druck lässt Flaschen platzen. Nur druckfeste Bierflaschen verwenden.","**Heiße Flüssigkeiten:** 25 Liter kochende Würze sind schwer – Topf sicher aufstellen, Kinder fernhalten.","**Methanol** entsteht beim Bierbrauen nur in unbedenklichen Spuren; das Risiko betrifft Destillieren, nicht Brauen.","Alkohol: Jugendschutz beachten; nicht in der Schwangerschaft."]},
    {"typ":"abschnitt","titel":"Recht in Deutschland","liste":["Haus- und Hobbybrauer dürfen **bis 200 Liter pro Kalenderjahr steuerfrei** brauen.","Vor dem ersten Brauen muss man dem zuständigen **Hauptzollamt** im Voraus mitteilen, wann und wo man braut.","Wer mehr braut, muss die Menge über 200 Liter anmelden und versteuern (Steueranmeldung für Bier im Einzelfall, Formular 2075; Steuersatz 0,787 € je Hektoliter und Grad Plato).","Zum Verkauf von Bier gelten weitere Regeln (Lebensmittel- und Gewerberecht) – dazu beim Hauptzollamt und der Gemeinde nachfragen."]},
    {"typ":"text","text":"Quelle: [BayernPortal: Biersteuer für Haus- und Hobbybrauer](https://www.bayernportal.de/dokumente/leistung/8449700896165). Die Angaben sind keine Rechtsberatung; Stand prüfen."}
   ]},

    {"typ":"text","text":"Temperaturen, Rasten und Rezeptmengen sind gängige Richtwerte aus der Hobbybrauer-Praxis."}

"selbstversorgung":[
 {"id":"huegelbeet","titel":"Hügelbeet","nr":"S-01","text":"Ein Beet als langgezogener Hügel aus Holz, Pflanzenresten, Kompost und Erde. Die Füllung verrottet langsam, liefert Wärme und Nährstoffe über etwa sechs Jahre und vergrößert die Anbaufläche.","stichworte":["Hügelkultur","Andrä","Beba","Holzer","Schichten","Rotte","Starkzehrer","Fruchtfolge","Wühlmausgitter","Permakultur"],"pflanzen":[],
  "kurz":"Ein langgezogener Hügel aus Holz, Pflanzenresten, Kompost und Erde. Das Innere verrottet über Jahre, gibt dabei Wärme und Nährstoffe ab und speichert Wasser. Dafür braucht das Beet eine gute Planung, die richtige Fruchtfolge und Schutz vor Austrocknung.",
  "steckbrief":[["Maße","ca. 1,5 m breit, 3–4 m oder länger, 0,5–1 m hoch"],["Ausrichtung","Nord-Süd, damit beide Flanken Sonne bekommen"],["Anlegen","Herbst (mehr Material, Setzzeit) oder Frühjahr, sobald der Boden offen ist"],["Lebensdauer","etwa 5–6 Jahre, dann neu anlegen"],["Vorteile","Wärme, Nährstoffe, mehr Fläche, Verwertung von Gartenabfall, bis ca. 6 Wochen längere Saison"],["Nachteile","viel Arbeit, trocknet leicht aus, Schnecken, sackt ab"],["Ursprung","Begriff 1962 durch Hermann Andrä, später Hans Beba, Sepp Holzer"],["Teil von","Permakultur und naturnahe Selbstversorgung"]],
  "reiter":[
   {"id":"ueberblick","titel":"Überblick","bloecke":[
    {"typ":"text","text":"Das Hügelbeet ist ein Komposthaufen, auf dem man Gemüse anbaut. Unten verrottet grobes Material langsam, oben wächst das Gemüse in Kompost und Erde. Damit liegt es zwischen Flachbeet und Hochbeet."},
    {"typ":"tabelle","kopf":["Merkmal","Flachbeet","Hügelbeet","Hochbeet"],"zeilen":[
     ["Aufwand Anlage","gering","hoch, aber ohne Baumaterial","hoch, mit Rahmen und Kosten"],
     ["Wärme","Bodentemperatur","wärmer durch Rotte und Schräge","wärmer durch Rotte und Abstand zum Boden"],
     ["Anbaufläche","1 m² pro m² Grund","rund ein Drittel mehr durch die Flanken","1 m² pro m² Grund"],
     ["Nährstoffe","nach Düngung","sehr hoch in den ersten Jahren","sehr hoch in den ersten Jahren"],
     ["Wasser","normal","trocknet an Krone und Südflanke schnell aus","trocknet schnell aus"],
     ["Schnecken","normal","eher mehr","weniger (Rahmen hilft)"],
     ["Lebensdauer","dauerhaft","ca. 5–6 Jahre","Füllung ca. 5–7 Jahre, Rahmen länger"],
     ["Rücken","Bücken","halb aufrecht","aufrecht"]]},
    {"typ":"abschnitt","titel":"Wofür es sich lohnt","liste":["Viel Gartenabfall wie Äste, Laub, Rasensoden: Der wird verwertet statt verbrannt oder abgefahren.","Schwerer, nasser oder sehr magerer Boden: Das Beet liegt darüber.","Wärmeliebendes Gemüse wie Tomaten, Paprika, Kürbis, Gurken.","Kleine Gärten, in denen jede Fläche zählt."]},
    {"typ":"hinweis","text":"**Gut zu wissen:** Wissenschaftlich ist das Hügelbeet wenig untersucht. Viele Aussagen stammen aus der Praxis. Einzelne Studien zeigen mehr Bodenkohlenstoff, weniger Staunässe und eine bessere Wasserspeicherung als flache Vergleichsflächen."}
   ]},
   {"id":"geschichte","titel":"Geschichte","bloecke":[
    {"typ":"text","text":"Haufen aus Holz und Pflanzenresten als Beet gibt es vermutlich seit Jahrhunderten in Mittel- und Osteuropa. Der Name und die heutige Form sind deutsch und erst gut 60 Jahre alt."},
    {"typ":"abschnitt","titel":"Zeitleiste","nummern":["**1924:** Rudolf Steiner hält den Landwirtschaftlichen Kurs, die Grundlage der biologisch-dynamischen Landwirtschaft. Andrä beruft sich später darauf.","**1962:** Hermann Andrä veröffentlicht ein Gartenheft und prägt den Begriff Hügelkultur. Angeregt hat ihn ein Reisighaufen im Garten seiner Großmutter, auf dem die Pflanzen prächtig wuchsen. Er wollte Holz verwerten, statt es zu verbrennen.","**1970er–1980er:** Hans Beba bringt das Buch zur Hügelkultur mit heraus; es erscheint in mehreren überarbeiteten Auflagen. Das Hügelbeet wird im Bio-Gartenbau bekannt.","**Ab 1980er:** Der österreichische Bergbauer Sepp Holzer entwickelt die Methode auf dem Krameterhof weiter, auch mit großen Hügeln am Hang. 2012 erscheint sein Buch zur Hügelkultur.","**Ab 2000er:** In der englischsprachigen Permakultur wird hugelkultur weltweit bekannt, unter anderem durch Paul Wheaton."]},
    {"typ":"text","text":"Verbindung zu den Autoren: Storl kommt wie Andrä aus dem Umfeld der biologisch-dynamischen Landwirtschaft ({{a:storl-garten|Storl · Garten-Praxis}})."}
   ]},
   {"id":"aufbau","titel":"Aufbau","bloecke":[
    {"typ":"text","text":"Der Aufbau folgt einer einfachen Regel: von grob nach fein, von langsam zu schnell verrottend. Unten liegt das Holz, oben die Pflanzerde."},
    {"typ":"schichten","titel":"Querschnitt (von oben nach unten)","eintraege":[
     ["Pflanzerde mit Humus","10–20 cm","Wurzelraum für Saat und Jungpflanzen"],
     ["Reifer bis halbreifer Kompost oder verrotteter Mist","15 cm","Hauptnährstoffquelle der ersten Jahre"],
     ["Feuchtes Laub oder Stroh","20 cm","Stickstoff und Struktur, verrottet in 1–2 Jahren"],
     ["Rasensoden, Grasseite nach unten","10 cm","dichtet ab, damit Erde nicht ins Holz rieselt"],
     ["Äste, Zweige, Häckselgut","30–40 cm","Kern: langsame Rotte, Wasserspeicher, Luft"],
     ["Engmaschiges Wühlmausgitter","Boden","Schutz vor Wühlmäusen und Maulwürfen"]]},
    {"typ":"text","text":"Die Dicken sind Faustwerte aus Gartenratgebern; sie unterscheiden sich je nach Quelle. Wichtig ist das Verhältnis: viel Grobes unten, genug Feines oben, damit auch flach wurzelnde Pflanzen versorgt sind."},
    {"typ":"abschnitt","titel":"Planung","liste":["**Ort:** sonnig, frei von Baumwurzeln, gut erreichbar mit Gießkanne oder Schlauch.","**Ausrichtung:** Nord-Süd, damit Ost- und Westflanke gleich viel Sonne bekommen. Am Hang quer zum Gefälle.","**Breite:** ca. 1,5 m, sodass man von beiden Seiten an die Mitte kommt.","**Länge:** 3–4 m oder mehr, je nach Material.","**Höhe:** 50 cm bis höchstens 1 m; Flanken nicht steiler als ca. 40 Grad, sonst rutscht die Erde.","**Weg:** rundherum mindestens 50 cm Platz zum Arbeiten."]},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[
     {"id":"anleitung","titel":"Schritt für Schritt anlegen","kat":"alle","beleg":"T","teil":"ca. 1 Tag zu zweit","kurz":"Die komplette Anleitung für ein Beet von 1,5 × 4 m.","zutaten":["4–6 Pflöcke und Schnur","Spaten, Schubkarre","verzinktes Wühlmausgitter (ca. 13 mm Masche), ca. 2 × 5 m","Äste und Häckselgut, ca. 2 m³","Rasensoden oder Grasschnitt","Laub oder Stroh, ca. 1 m³","Kompost oder verrotteter Mist, ca. 1 m³","Gartenerde, ca. 1 m³"],"schritte":["Fläche mit Pflöcken und Schnur abstecken, Nord-Süd ausgerichtet.","Rasensoden flach abstechen und beiseitelegen.","Boden ca. 25–30 cm tief ausheben, die Erde getrennt lagern.","Wühlmausgitter einlegen und an den Rändern hochziehen.","Grobes Holz in die Mitte, kleinere Äste und Häckselgut in die Lücken. Gut festtreten.","Rasensoden mit der Grasseite nach unten darauflegen.","Laub oder Stroh aufschichten und anfeuchten.","Kompost oder Mist auftragen.","Mit Gartenerde abschließen, gut andrücken.","Jede Lage beim Aufschichten wässern.","Mit Mulch oder Vlies abdecken, wenn erst später gepflanzt wird."],"hinweis":"Die Maße und Mengen sind grobe Richtwerte. Wer im Herbst anlegt, lagert Laub und Holz bis dahin trocken unter einer Plane."}
    ]},

   {"id":"chemie","titel":"Chemie & Biologie","bloecke":[
    {"typ":"text","text":"Im Inneren arbeiten Bakterien, Pilze, Asseln und Regenwürmer. Sie zerlegen das Material Schicht für Schicht. Was dabei passiert, erklärt fast alle Stärken und Probleme des Hügelbeets."},
    {"typ":"abschnitt","titel":"1. Die Rotte","liste":["Mikroorganismen bauen Zellulose, Hemizellulose und Eiweiße ab. Dabei entstehen Kohlendioxid, Wasser, Wärme und Nährsalze.","Holz enthält viel **Lignin**, das fast nur Pilze (z. B. Weißfäulepilze) abbauen. Deshalb verrottet der Holzkern so langsam.","Aus den Resten entsteht **Humus**: dunkle, stabile Verbindungen, die Wasser und Nährstoffe festhalten."]},
    {"typ":"abschnitt","titel":"2. Das C:N-Verhältnis","liste":["Mikroben brauchen zum Wachsen Kohlenstoff (C) als Energie und Stickstoff (N) für Eiweiß, ideal etwa 25–30 Teile C auf 1 Teil N.","Holz hat sehr viel Kohlenstoff und kaum Stickstoff. Fehlt der Stickstoff, holen ihn sich die Mikroben aus der Umgebung – er ist dann für Pflanzen vorübergehend blockiert (**Stickstoffsperre**, Immobilisierung).","Nach ein bis zwei Jahren kehrt sich das um: Die Mikroben sterben ab und geben den Stickstoff wieder frei.","Deshalb liegt das Holz tief unten und stickstoffreiches Material (Gras, Mist, Kompost) darüber. Mehr dazu: {{b:cn-verhaeltnis|C:N-Verhältnis}}."]},
    {"typ":"tabelle","kopf":["Material","C:N (Faustwert)","Wirkung"],"zeilen":[
     ["Holz, Sägemehl","200–500 : 1","bindet Stickstoff, verrottet sehr langsam"],
     ["Stroh","80–100 : 1","bindet Stickstoff"],
     ["Laub","40–60 : 1","mittel"],
     ["Kompost (reif)","10–20 : 1","gibt Stickstoff ab"],
     ["Stallmist","15–25 : 1","gibt Stickstoff ab"],
     ["Rasenschnitt, Brennnessel","12–20 : 1","gibt schnell Stickstoff ab"]]},
    {"typ":"abschnitt","titel":"3. Wärme","liste":["Bei der Rotte wird Energie als Wärme frei. Ein Hügelbeet ist deshalb besonders in den ersten ein bis zwei Jahren wärmer als der Gartenboden.","Dazu kommt die Schräge: Die Flanken stehen steiler zur Sonne und erwärmen sich schneller.","Folge: Pflanzen können früher ins Beet, die Saison verlängert sich um einige Wochen."]},
    {"typ":"abschnitt","titel":"4. Wasser","liste":["Morsches Holz wirkt wie ein Schwamm und gibt Wasser langsam wieder ab.","Die Krone und die Südflanke trocknen trotzdem schnell aus, besonders im ersten Jahr, solange das Holz noch trocken ist.","Wasser läuft an den Flanken ab – wer schnell gießt, spült Erde weg."]},
    {"typ":"abschnitt","titel":"5. Nitrat","liste":["Im ersten Jahr wird oben aus Kompost und Mist viel Stickstoff frei.","Blattgemüse wie Salat, Spinat, Mangold und Rote Bete speichert diesen Überschuss als Nitrat in den Blättern.","Darum gehören Blattgemüse erst ab dem 2. oder 3. Jahr aufs Beet ({{b:nitrat|Nitrat}})."]},
    {"typ":"abschnitt","titel":"6. Bodenleben","liste":["Holz und Laub sind Lebensraum für Pilzgeflechte, Asseln, Tausendfüßer und Regenwürmer.","Die Pilzfäden verbinden sich mit Pflanzenwurzeln (Mykorrhiza) und helfen bei der Aufnahme von Wasser und Phosphor.","Weil das Beet nicht umgegraben wird, bleibt dieses Netz erhalten."]}
   ]},
   {"id":"bepflanzung","titel":"Bepflanzung","bloecke":[
    {"typ":"text","text":"Die Bepflanzung folgt dem Nährstoffangebot: Es ist im ersten Jahr am höchsten und nimmt dann ab. Darum wandert man über die Jahre von Starkzehrern zu Schwachzehrern."},
    {"typ":"tabelle","kopf":["Jahr","Nährstoffe","Was anbauen","Was meiden"],"zeilen":[
     ["1","sehr hoch","Starkzehrer: Tomaten, Gurken, Zucchini, Kürbis, Paprika, Auberginen, Kohl, Sellerie, Lauch","Salat, Spinat, Mangold, Rote Bete (Nitrat); Kartoffeln"],
     ["2","hoch","Starkzehrer am Fuß, Mittelzehrer: Kohlrabi, Möhren, Zwiebeln, Rote Bete, Fenchel, Erdbeeren, Kräuter","Spinat noch zurückhaltend"],
     ["3","mittel","Mittel- und Schwachzehrer: Salat, Spinat, Bohnen, Erbsen, Radieschen, Feldsalat, Kräuter","Starkzehrer nur mit Nachdüngung"],
     ["4","gering","Schwachzehrer, Kräuter; oder Gründüngung (Phacelia, Klee, Senf)",""],
     ["5–6","gering, Beet flach","Erdbeeren, Kräuter, Gründüngung; dann neu anlegen oder Kompost verteilen",""]]},
    {"typ":"abschnitt","titel":"Wer wohin: die Zonen","liste":["**Krone (oben):** am trockensten und sonnigsten. Tomaten mit Stab, Paprika, Bohnen, Kräuter, die Trockenheit vertragen.","**Flanken:** Salat, Kohlrabi, Möhren, Erdbeeren, Zwiebeln. Erdbeeren halten mit ihren Ausläufern den Hang.","**Fuß (unten):** am feuchtesten und nährstoffreichsten. Kürbis und Zucchini, die dann über den Weg ranken.","**Hohe Pflanzen** auf die Nordseite oder in die Mitte, damit sie die anderen nicht beschatten."]},
    {"typ":"abschnitt","titel":"Pflanzen statt säen","liste":["In den ersten zwei Jahren lieber vorgezogene Jungpflanzen setzen; Saatgut wird an den Flanken leicht weggespült.","Kleine Pflanzmulden machen, damit das Gießwasser an der Pflanze bleibt."]},
    {"typ":"tabelle","kopf":["Monat","Arbeiten (mildes Klima wie im Saarland)"],"zeilen":[
     ["März","Beet abdecken lassen, Jungpflanzen auf der Fensterbank vorziehen"],
     ["April","robuste Kulturen pflanzen: Kohlrabi, Zwiebeln, Salat (ab 2. Jahr), Erbsen"],
     ["Mai","nach den Eisheiligen (Mitte Mai): Tomaten, Paprika, Gurken, Zucchini, Kürbis"],
     ["Juni–Juli","mulchen, gießen, Nachsaaten für den Herbst (Möhren, Radieschen)"],
     ["August","Wintergemüse pflanzen: Feldsalat, Grünkohl, Lauch"],
     ["September–Oktober","Abräumen, Gründüngung säen oder mit Laub und Stroh mulchen; guter Zeitpunkt für neue Beete"],
     ["November–Februar","abgedeckt ruhen lassen"]]},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[
     {"id":"plan-jahr1","titel":"Pflanzplan 1. Jahr (1,5 × 4 m)","kat":"alle","beleg":"T","teil":"Beispiel","kurz":"Ein bewährter Mischkulturplan für das erste Jahr.","zutaten":["4 Tomaten","2 Paprika","2 Zucchini oder 1 Kürbis","4 Kohlrabi","Basilikum, Tagetes"],"schritte":["Krone: Tomaten im Abstand von 60 cm, dazwischen Basilikum.","Westflanke: Paprika und Kohlrabi.","Ostflanke: Kohlrabi und Tagetes (lockt Schnecken weg von Gemüse, wehrt Fadenwürmer ab).","Fuß der Südseite: Zucchini oder Kürbis, darf in den Weg ranken."]},
     {"id":"plan-jahr3","titel":"Pflanzplan 3. Jahr","kat":"alle","beleg":"T","teil":"Beispiel","kurz":"Wenn die Nährstoffe nachlassen: Salate, Hülsenfrüchte, Kräuter.","zutaten":["Buschbohnen","Salat und Pflücksalat","Radieschen","Möhren","Kräuter: Petersilie, Schnittlauch, Thymian"],"schritte":["Krone: Buschbohnen, Thymian.","Flanken: Salat im Wechsel mit Radieschen und Möhren.","Fuß: Petersilie, Schnittlauch.","Bohnen sammeln Stickstoff aus der Luft und verbessern das Beet für das Folgejahr."]}
    ]}
   ]},
   {"id":"pflege","titel":"Pflege & Wachstum","bloecke":[
    {"typ":"text","text":"Bestes Wachstum hängt an drei Dingen: gleichmäßig Wasser, eine geschlossene Mulchdecke und die passende Fruchtfolge. Gedüngt wird in den ersten zwei Jahren meist gar nicht."},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["wasser","Wasser"],["boden","Boden & Dünger"],["jahr","Jahreslauf"]],"eintraege":[
     {"id":"giessen","titel":"Richtig gießen","kat":"wasser","beleg":"T","teil":"Wasser","kurz":"Das Hügelbeet braucht mehr Wasser als ein Flachbeet, besonders an der Krone.","zutaten":["Gießkanne mit Brause oder Tropfschlauch","Regenwasser"],"schritte":["Langsam und durchdringend gießen, lieber seltener und gründlich.","Morgens gießen, damit die Blätter abtrocknen.","Tropfschlauch in einer Mulde auf der Krone verlegen."]},
     {"id":"olla","titel":"Tontöpfe als Wasserspeicher (Ollas)","kat":"wasser","beleg":"T","teil":"Wasser","kurz":"Unglasierte Tontöpfe geben Wasser langsam an die Wurzeln ab.","zutaten":["unglasierte Tontöpfe","Korken oder Silikon für das Loch","Untersetzer als Deckel"],"schritte":["Loch im Topfboden verschließen.","Töpfe alle 60–80 cm auf der Krone bis zum Rand eingraben.","Mit Wasser füllen und abdecken; nach Bedarf nachfüllen."]},
     {"id":"mulch","titel":"Immer mulchen","kat":"boden","beleg":"W","teil":"Boden","kurz":"Eine Mulchdecke hält Feuchtigkeit, verhindert Abschwemmung und füttert das Bodenleben.","zutaten":["Rasenschnitt (angetrocknet), Stroh, Laub, Brennnessel- oder Beinwellblätter"],"schritte":["5 cm dick zwischen die Pflanzen legen.","Dünn halten, wenn viele Schnecken da sind, oder mit Stroh arbeiten.","Laufend nachlegen."]},
     {"id":"duengen","titel":"Düngen ab dem 3. Jahr","kat":"boden","beleg":"T","teil":"Dünger","kurz":"Nur organisch und gezielt bei Starkzehrern.","zutaten":["reifer Kompost","Hornspäne","Brennnesseljauche"],"schritte":["Im Frühjahr 2–3 cm Kompost auftragen und damit gleichzeitig das Beet aufstocken.","Starkzehrer alle 2 Wochen mit verdünnter {{p:p01#selbstversorgung-jauche|Brennnesseljauche}} gießen."]},
     {"id":"gruenduengung","titel":"Gründüngung","kat":"boden","beleg":"W","teil":"Boden","kurz":"Hält den Boden bedeckt und bringt Nährstoffe zurück.","zutaten":["Phacelia, Senf, Klee, Lupinen"],"schritte":["Nach der Ernte im Spätsommer aussäen.","Über Winter stehen lassen, im Frühjahr abschneiden und als Mulch liegen lassen.","Senf nicht vor Kohl, da beide Kreuzblütler sind."]},
     {"id":"winter","titel":"Winterschutz","kat":"jahr","beleg":"T","teil":"Herbst","kurz":"Ein unbedecktes Beet wird vom Regen abgetragen.","zutaten":["Stroh, Laub oder Vlies"],"schritte":["Nach dem Abräumen 10–15 cm Laub oder Stroh aufbringen.","Bei Bedarf mit Vlies oder Lochfolie sichern."]},
     {"id":"aufstocken","titel":"Aufstocken und neu anlegen","kat":"jahr","beleg":"T","teil":"Frühjahr","kurz":"Das Beet sackt jedes Jahr. Nach 5–6 Jahren ist es fast flach.","zutaten":["Kompost, Erde"],"schritte":["Jedes Frühjahr mit Kompost oder Erde auffüllen.","Nach 5–6 Jahren das flache Beet als Gemüsebeet weiter nutzen oder den Humus verteilen.","Ein neues Hügelbeet an anderer Stelle anlegen."]}
    ]}
   ]},
   {"id":"probleme","titel":"Probleme","bloecke":[
    {"typ":"text","text":"Die meisten Probleme lassen sich schon beim Aufbau vermeiden. Jede Karte zeigt die Ursache und die Lösung."},
    {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["bau","Bau"],["tiere","Tiere"],["wachstum","Wachstum"]],"eintraege":[
     {"id":"austrocknen","titel":"Beet trocknet aus","kat":"wachstum","beleg":"T","teil":"häufigstes Problem","kurz":"Ursache: Krone und Flanken sind Wind und Sonne ausgesetzt, das Holz ist anfangs noch trocken.","zutaten":["Vorbeugen: Holz vor dem Einbau wässern, Beet nicht zu steil bauen"],"schritte":["Immer mulchen.","Ollas oder Tropfschlauch einsetzen.","Trockenheitsverträgliche Pflanzen auf die Krone."]},
     {"id":"erosion","titel":"Erde rutscht ab","kat":"bau","beleg":"T","teil":"Erosion","kurz":"Ursache: zu steile Flanken, starker Regen, offener Boden.","zutaten":["Flanken höchstens ca. 40 Grad"],"schritte":["Mulchdecke geschlossen halten.","Erdbeeren oder Kapuzinerkresse an die Flanken.","Im Winter abdecken."]},
     {"id":"wuehlmaus","titel":"Wühlmäuse","kat":"tiere","beleg":"T","teil":"Tiere","kurz":"Ursache: Die lockere, warme Füllung ist ein idealer Bau.","zutaten":["verzinktes Gitter mit kleiner Maschenweite"],"schritte":["Gitter beim Bau unter das ganze Beet legen und seitlich hochziehen.","Nachträglich schwer zu beheben; Fallen nach Bedarf."]},
     {"id":"schnecken","titel":"Schnecken","kat":"tiere","beleg":"T","teil":"Tiere","kurz":"Ursache: feuchte Hohlräume und Mulch bieten Verstecke.","zutaten":["Schneckenzaun, Bretter als Falle, Laufenten (falls möglich)"],"schritte":["Morgens unter ausgelegten Brettern absammeln.","Morgens statt abends gießen.","Jungpflanzen gut vorgezogen setzen.","Tagetes als Ablenkung."]},
     {"id":"stickstoffsperre","titel":"Pflanzen bleiben gelb und klein","kat":"wachstum","beleg":"W","teil":"Stickstoffmangel","kurz":"Ursache: Holz oder Stroh liegt zu weit oben und bindet Stickstoff.","zutaten":["Vorbeugen: Holz tief, Kompost und Mist darüber"],"schritte":["Kurzfristig mit Brennnesseljauche oder Hornspänen nachdüngen.","Nächstes Jahr mehr Kompost in die obere Schicht."]},
     {"id":"nitrat","titel":"Zu viel Nitrat im Blattgemüse","kat":"wachstum","beleg":"W","teil":"Nitrat","kurz":"Ursache: hohe Stickstofffreisetzung in den ersten Jahren.","zutaten":["Fruchtfolge beachten"],"schritte":["Salat, Spinat, Mangold, Rote Bete erst ab Jahr 2–3.","Blattgemüse nachmittags ernten, dann ist der Nitratgehalt niedriger."]},
     {"id":"absacken","titel":"Beet sackt ungleich ab","kat":"bau","beleg":"T","teil":"Setzung","kurz":"Ursache: große Hohlräume zwischen dicken Ästen.","zutaten":["Häckselgut oder Laub zum Füllen"],"schritte":["Beim Bau Lücken füllen und jede Lage festtreten.","Herbstanlage gibt dem Beet einen Winter zum Setzen.","Senken im Frühjahr mit Kompost auffüllen."]},
     {"id":"unkraut","titel":"Unkraut und Durchwuchs","kat":"wachstum","beleg":"T","teil":"Beikräuter","kurz":"Ursache: Wurzelunkräuter oder Samen im Material, vergessene Kartoffeln.","zutaten":["sauberes Material"],"schritte":["Keine Quecke, Giersch-Wurzeln oder samentragendes Unkraut einbauen.","Keine Kartoffeln anbauen, da beim Ernten der Hügel aufgewühlt wird.","Mulchen."]},
     {"id":"ameisen","titel":"Ameisen im Beet","kat":"tiere","beleg":"T","teil":"Tiere","kurz":"Ursache: Das Beet ist zu trocken.","zutaten":["Wasser"],"schritte":["Regelmäßig und durchdringend gießen; Ameisen ziehen dann meist weg."]}
    ]}
   ]},
