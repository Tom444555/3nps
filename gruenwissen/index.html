  --l0:#2c3d22; --l1:#3d3224; --l2:#3a3326; --l3:#2a3622; --l4:#45351f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141912; --surface:#1b2218; --ink:#e4ead9; --muted:#9aa68f; --line:#303a2a;
  --accent:#8dbb6c; --accent-ink:#11170e; --accent-soft:#25331d; --sting:#e0a14a;
  --w:#8db8de; --w-soft:#1d2a36; --t:#8dbb6c; --t-soft:#25331d; --a:#c39ad3; --a-soft:#2d2233;
  --l0:#2c3d22; --l1:#3d3224; --l2:#3a3326; --l3:#2a3622; --l4:#45351f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 var(--body)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.kopf-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.marke{font:800 1.35rem/1 var(--display);color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.marke span{color:var(--accent)}
.suche{position:relative;flex:1 1 260px;min-width:0}
.suche input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 1rem var(--body)}
.suche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.treffer{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0 / .14);max-height:60vh;overflow:auto;padding:6px}
.treffer button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:8px 10px;border:0;background:none;border-radius:7px}
.treffer button[aria-selected="true"],.treffer button:hover{background:var(--accent-soft)}
.treffer .art{font:700 .7rem var(--label);letter-spacing:.06em;color:var(--muted);min-width:5.5em;text-transform:uppercase}
.treffer .wo{color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.treffer .leer{padding:10px;color:var(--muted)}
.teile{display:flex;gap:6px;flex-wrap:wrap}
.teile button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font:700 .82rem var(--label);letter-spacing:.04em}
.teile button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{max-width:960px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.12rem;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font:700 .78rem var(--label);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.botan{font:italic 400 1.2rem var(--display);color:var(--muted)}
.stack{display:grid;gap:12px}

.legende{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;color:var(--muted)}
.b{display:inline-block;font:700 .72rem/1 var(--label);letter-spacing:.05em;padding:4px 7px 3px;border-radius:5px;vertical-align:.12em;white-space:nowrap}
.b-W{background:var(--w-soft);color:var(--w)} .b-T{background:var(--t-soft);color:var(--t)} .b-A{background:var(--a-soft);color:var(--a)}

.steck{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.steck div{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.steck dt{font:700 .72rem var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.steck dd{margin:2px 0 0}

.reiter{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:thin}
.reiter button{border:0;background:none;padding:10px 14px;font:700 .95rem var(--body);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.reiter button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:grid;gap:22px}
.abschnitt{display:grid;gap:10px}
.abschnitt ul,.abschnitt ol{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:72ch}
.tab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .75rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.hinweis{border-left:3px solid var(--sting);padding:8px 14px;background:var(--surface);border-radius:0 8px 8px 0;max-width:72ch}

.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:500;font-size:.92rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.karte{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.karte>button{display:grid;gap:4px;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.karte .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--muted);align-items:center}
.karte .auf{font:700 .78rem var(--label);letter-spacing:.05em;color:var(--accent)}
.karte .koerper{padding:0 16px 16px;display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px;margin:0 0 0}
.karte .koerper ul,.karte .koerper ol{margin:0;padding-left:1.25em;display:grid;gap:4px}
.karte.ziel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.unter{font:700 .72rem var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.teilkarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.teilkarte{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:8px;align-content:start}
.teilkarte .buchst{font:800 2.2rem/1 var(--display);color:var(--accent)}
.liste-links{display:flex;flex-wrap:wrap;gap:6px}
.liste-links a,.chip{font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);text-decoration:none;border:0}
.eintrag{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:8px;scroll-margin-top:140px}
.eintrag.ziel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fuss{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}
.schnitt{margin:0;display:grid;gap:3px;justify-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.schnitt figcaption{justify-self:start;margin-bottom:6px}
.lage{width:var(--w);min-width:0;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 12px;border-radius:6px;color:var(--ink)}
.lage-name{font-weight:700;min-width:0}
.lage-dicke{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lage-info{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.lage-0{background:var(--l0);border-radius:40% 40% 6px 6px / 60% 60% 6px 6px;padding-top:12px}
.lage-1{background:var(--l1)} .lage-2{background:var(--l2)} .lage-3{background:var(--l3)} .lage-4{background:var(--l4)}
.lage-5{background:transparent;border:2px dashed var(--muted);padding-block:5px}
.grund{width:100%;text-align:center;font:700 .72rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--muted);padding-top:4px}
@media (max-width:520px){.lage{width:100%}}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px}
@media (prefers-reduced-motion:no-preference){.karte,.eintrag{transition:box-shadow .2s,border-color .2s}}
@media print{.kopf,.reiter,.filter,.auf{display:none!important}.panel[hidden]{display:grid!important}.koerper[hidden]{display:grid!important}body{background:#fff;color:#000}}
</style>

    {"id":"wurzeltee","titel":"Wurzeltee bei Prostatabeschwerden","kat":"innerlich","beleg":"W","teil":"Wurzel","kurz":"Lindert Beschwerden beim Wasserlassen bei gutartiger Vergrößerung im Anfangsstadium.","zutaten":["1,5 g grob gepulverte Wurzel","150 ml kaltes Wasser"],"schritte":["Wurzel kalt ansetzen und erhitzen.","1 Minute sieden, 10 Minuten ziehen lassen, abseihen.","Über längere Zeit regelmäßig trinken (Fertigpräparate sind genauer dosiert)."],"hinweis":"Lindert nur Beschwerden, verkleinert die Prostata nicht. Vorher ärztlich abklären, regelmäßige Kontrolle bleibt nötig."},
    {"id":"fruehjahrskur","titel":"Frühjahrskur","kat":"innerlich","beleg":"T","teil":"junge Blätter","kurz":"Vier Wochen frisches Grün und Tee als Start in die Saison.","zutaten":["täglich eine Handvoll junge Blätter","2–3 Tassen Tee"],"schritte":["Blätter in Suppe, Spinat, Smoothie oder Pesto essen.","Zusätzlich Tee trinken, dazu viel Wasser.","Nach 4 Wochen beenden."],"hinweis":"Der Begriff Entschlackung ist wissenschaftlich nicht belegt; belegt ist die harntreibende Wirkung."},
    {"id":"haarwasser","titel":"Brennnessel-Haarwasser","kat":"aeusserlich","beleg":"T","teil":"Kraut oder Wurzel","kurz":"Pflege für Kopfhaut und Haare nach altem Hausrezept.","zutaten":["100 g frisches Kraut oder 50 g getrocknete Wurzel","500 ml Wasser","250 ml Apfelessig"],"schritte":["Pflanzenteile mit Wasser aufkochen, 15 Minuten köcheln.","Abkühlen lassen, abseihen, Essig zugeben.","In eine saubere Flasche füllen, kühl lagern (ca. 2 Wochen).","Nach dem Waschen in die Kopfhaut einmassieren, nicht ausspülen."],"hinweis":"Wirkung auf Haarwuchs ist nicht wissenschaftlich belegt."},
    {"id":"hautoel","titel":"Brennnessel-Hautöl","kat":"aeusserlich","beleg":"T","teil":"Presssaft","kurz":"Massageöl, wie in der Stellungnahme der Rheumaliga erwähnt.","zutaten":["1 Teil frischer Brennnesselsaft","2 Teile Olivenöl"],"schritte":["Saft und Öl kräftig mischen.","Vor Gebrauch schütteln, auf schmerzende Muskeln oder Gelenke einreiben.","Kühl lagern und rasch aufbrauchen."],"hinweis":"Vorher an einer kleinen Hautstelle testen."},
    {"id":"urtikation","titel":"Urtikation (Nesselpeitschen)","kat":"aeusserlich","beleg":"T","teil":"frisches Kraut","kurz":"Alter Reiztherapie-Brauch bei Rheuma: Haut gezielt mit Nesseln berühren.","zutaten":["frische Brennnesseltriebe","Handschuhe"],"schritte":["Schmerzende Stelle kurz mit den Trieben bestreichen.","Die Haut rötet sich und wird warm (Gegenreiz).","Nicht täglich und nur auf gesunder Haut anwenden."],"hinweis":"Nicht bei empfindlicher Haut, Allergien oder Kindern. Wissenschaftlich kaum untersucht."},
    {"id":"samen","titel":"Nesselsamen zur Stärkung","kat":"alternativ","beleg":"A","teil":"Samen","kurz":"Volksheilkundliches Kräftigungsmittel bei Erschöpfung.","zutaten":["1–2 TL getrocknete Samen täglich"],"schritte":["Samen über Müsli, Salat oder Joghurt streuen.","Leicht geröstet schmecken sie nussig ({{p:p01#rezepte-samen-crunch|Samen-Crunch}})."],"hinweis":"Studien zur Wirkung fehlen."},
    {"id":"hildegard","titel":"Nesselmus nach Hildegard von Bingen","kat":"alternativ","beleg":"A","teil":"junge Blätter","kurz":"Hildegard schätzte die Brennnessel; in der Hildegard-Heilkunde gilt junges Nesselmus als stärkend.","zutaten":["junge Brennnesselblätter","etwas Fett oder Brühe","Salz"],"schritte":["Blätter weich kochen und fein hacken oder pürieren.","Mit wenig Fett oder Brühe zu einem Mus verrühren und warm essen."],"hinweis":"Originalstellen aus Hildegards Schriften werden noch ergänzt."}
   ]}
  ]},
  {"id":"rezepte","titel":"Rezepte","bloecke":[
   {"typ":"text","text":"Verwendet werden die oberen 4–6 Blätter junger Triebe, am besten von März bis Juni. Blanchieren oder Walzen mit dem Nudelholz entschärft die Brennhaare. Wer im Juni zurückschneidet, erntet im Spätsommer wieder junge Blätter."},
   {"typ":"karten","art":"rezept","filter":[["alle","Alle"],["gemuese","Gemüse & Suppen"],["wuerzen","Würzen & Vorrat"],["backen","Backen"],["getraenke","Getränke"]],"eintraege":[
    {"id":"spinat","titel":"Brennnesselspinat","kat":"gemuese","menge":"2 Portionen","zeit":"20 Min.","zutaten":["200 g junge Brennnesselblätter","1 Zwiebel","1 EL Butter","Salz, Pfeffer, Muskat","2 EL Sahne (nach Wunsch)"],"schritte":["Blätter mit Handschuhen pflücken und waschen.","1 Minute in Salzwasser blanchieren, kalt abschrecken, ausdrücken, hacken.","Zwiebel in Butter glasig dünsten, Brennnesseln dazu, 3 Minuten mitdünsten.","Würzen, nach Wunsch Sahne unterrühren."],"tipp":"Klassisch mit Spiegelei und Salzkartoffeln."},
    {"id":"suppe","titel":"Brennnesselsuppe","kat":"gemuese","menge":"4 Portionen","zeit":"35 Min.","zutaten":["150 g junge Brennnesselblätter","400 g mehlige Kartoffeln","1 Zwiebel","1 Knoblauchzehe","1 l Gemüsebrühe","1 EL Butter","100 ml Sahne","Salz, Pfeffer, Muskat"],"schritte":["Zwiebel und Knoblauch in Butter andünsten.","Kartoffeln würfeln, mit Brühe 15 Minuten kochen.","Gewaschene Brennnesseln zugeben, 3 Minuten mitkochen.","Fein pürieren, Sahne einrühren, abschmecken."],"tipp":"Mit gerösteten Nesselsamen oder Croûtons bestreuen."},
    {"id":"spaetzle","titel":"Brennnessel-Spätzle","kat":"gemuese","menge":"3 Portionen","zeit":"30 Min.","zutaten":["80 g blanchierte Brennnesseln","300 g Mehl","3 Eier","ca. 100 ml Wasser","1 TL Salz","Butter, Bergkäse"],"schritte":["Brennnesseln mit Eiern und Wasser fein pürieren.","Mit Mehl und Salz zu einem zähen Teig schlagen, bis er Blasen wirft.","Portionsweise in siedendes Salzwasser schaben oder pressen.","Wenn sie oben schwimmen, abschöpfen und in Butter schwenken, mit Käse bestreuen."]},
    {"id":"risotto","titel":"Brennnessel-Risotto","kat":"gemuese","menge":"2 Portionen","zeit":"35 Min.","zutaten":["150 g Risottoreis","100 g junge Brennnesseln, blanchiert und gehackt","1 Schalotte","100 ml Weißwein (oder Brühe)","ca. 600 ml heiße Brühe","30 g Parmesan","1 EL Butter"],"schritte":["Schalotte in Butter andünsten, Reis glasig mitdünsten.","Mit Wein ablöschen, dann nach und nach Brühe angießen und rühren.","Nach ca. 18 Minuten Brennnesseln unterheben.","Parmesan und ein Stück Butter einrühren, kurz ruhen lassen."]},
    {"id":"smoothie","titel":"Grüner Nessel-Smoothie","kat":"getraenke","menge":"2 Gläser","zeit":"5 Min.","zutaten":["1 Handvoll sehr junge Brennnesselspitzen","1 Banane","1 Apfel","Saft einer halben Zitrone","250 ml Wasser"],"schritte":["Brennnesseln waschen und mit dem Nudelholz walzen.","Alles im Mixer 1 Minute fein pürieren.","Sofort trinken."],"tipp":"Roh bleibt am meisten Vitamin C erhalten. Das kräftige Mixen zerstört die Brennhaare."},
    {"id":"limonade","titel":"Nessel-Zitronen-Limo","kat":"getraenke","menge":"1 Liter","zeit":"10 Min. + 4 Std.","zutaten":["2 Handvoll frische Brennnesseltriebe","1 Bio-Zitrone in Scheiben","2 EL Honig","1 l kaltes Wasser"],"schritte":["Brennnesseln und Zitrone in einen Krug geben.","Mit kaltem Wasser aufgießen, Honig einrühren.","4 Stunden im Kühlschrank ziehen lassen, abseihen."]},
    {"id":"tee-frisch","titel":"Frischer Brennnesseltee","kat":"getraenke","menge":"1 Tasse","zeit":"10 Min.","zutaten":["5–6 frische Triebspitzen","250 ml kochendes Wasser"],"schritte":["Triebspitzen kurz abspülen.","Mit kochendem Wasser übergießen, 8–10 Minuten ziehen lassen."],"tipp":"Mit Minze oder Zitronenmelisse mischen."},
    {"id":"pesto","titel":"Brennnesselpesto","kat":"wuerzen","menge":"1 Glas (ca. 200 ml)","zeit":"15 Min.","zutaten":["100 g junge Brennnesselblätter","40 g Walnüsse oder Sonnenblumenkerne","40 g Parmesan","1 Knoblauchzehe","ca. 120 ml Olivenöl","Salz, Zitronensaft"],"schritte":["Blätter 30 Sekunden blanchieren, kalt abschrecken, gut ausdrücken.","Nüsse ohne Fett anrösten.","Alles im Mixer grob pürieren, Öl nach und nach zugeben.","Abschmecken, ins Glas füllen, mit Öl bedecken."],"tipp":"Kühl gelagert und mit Öl bedeckt hält es etwa eine Woche. Portionsweise einfrieren geht auch."},
    {"id":"salz","titel":"Brennnesselsalz","kat":"wuerzen","menge":"1 kleines Glas","zeit":"10 Min. + Trocknen","zutaten":["2 Handvoll getrocknete Brennnesselblätter","100 g grobes Meersalz"],"schritte":["Blätter vollständig trocknen ({{s:trocknen|Kräuter trocknen}}).","Mit dem Salz im Mörser oder Mixer grob mahlen.","In ein dunkles Glas füllen."],"tipp":"Hält monatelang. Passt zu Kartoffeln, Eiern und Quark."},
    {"id":"samen-crunch","titel":"Samen-Crunch","kat":"wuerzen","menge":"1 kleines Glas","zeit":"10 Min.","zutaten":["4 EL getrocknete Brennnesselsamen","4 EL Sonnenblumenkerne","2 EL Sesam","1 Prise Salz"],"schritte":["Sonnenblumenkerne und Sesam ohne Fett goldbraun rösten.","Nesselsamen die letzte Minute mitrösten.","Salzen, abkühlen lassen, in ein Glas füllen."],"tipp":"Über Salat, Suppe oder Müsli. Samen ernten: {{s:samen|Samen ernten}}."},
    {"id":"butter","titel":"Brennnesselbutter","kat":"wuerzen","menge":"125 g","zeit":"10 Min.","zutaten":["125 g weiche Butter","30 g blanchierte Brennnesseln","1 kleine Knoblauchzehe","Salz, etwas Zitronenabrieb"],"schritte":["Brennnesseln gut ausdrücken und sehr fein hacken.","Mit Butter, Knoblauch und Gewürzen verrühren.","In Folie zur Rolle formen, kühlen oder einfrieren."]},
    {"id":"chips","titel":"Brennnesselchips","kat":"wuerzen","menge":"1 Schale","zeit":"15 Min.","zutaten":["30 große, ganze Brennnesselblätter","1 EL Olivenöl","Salz, Paprika"],"schritte":["Blätter waschen und gut trocken tupfen.","Mit Öl und Gewürzen vorsichtig mischen.","Auf Backpapier bei 150 °C 8–12 Minuten backen, bis sie knusprig sind."],"tipp":"Die Brennwirkung verschwindet beim Backen vollständig."},
    {"id":"quiche","titel":"Brennnessel-Quiche","kat":"backen","menge":"1 Form (26 cm)","zeit":"70 Min.","zutaten":["1 Rolle Mürbe- oder Quicheteig","200 g blanchierte Brennnesseln, gehackt","1 Zwiebel","3 Eier","200 g Schmand","100 g geriebener Käse","Salz, Pfeffer, Muskat"],"schritte":["Form mit Teig auslegen, Boden mehrfach einstechen.","Zwiebel andünsten, mit Brennnesseln mischen, auf dem Boden verteilen.","Eier, Schmand, Käse und Gewürze verquirlen, darübergießen.","Bei 180 °C Ober-/Unterhitze ca. 40 Minuten backen."]},
    {"id":"pfannkuchen","titel":"Grüne Pfannkuchen","kat":"backen","menge":"6 Stück","zeit":"25 Min.","zutaten":["50 g blanchierte Brennnesseln","200 g Mehl","3 Eier","300 ml Milch","1 Prise Salz","Butter zum Braten"],"schritte":["Brennnesseln mit Milch und Eiern fein pürieren.","Mehl und Salz einrühren, 10 Minuten quellen lassen.","In Butter dünne Pfannkuchen ausbacken."],"tipp":"Herzhaft gefüllt mit Ziegenkäse oder süß mit Apfelmus."}
   ]}
  ]},
  {"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[
   {"typ":"text","text":"Eine wilde Ecke im Garten liefert Nahrung, Tee und Dünger fürs ganze Jahr. Die Verfahren sind in Teil S allgemein beschrieben."},
   {"typ":"abschnitt","titel":"Anbau und Ernte","liste":["**Ansiedeln:** Ausläufer im Frühjahr oder Herbst an einen feuchten, nährstoffreichen Platz setzen; mit Wurzelsperre oder Rasenkante begrenzen.","**Ernten:** mit Handschuhen, nur die Triebspitzen; Rückschnitt im Juni sorgt für eine zweite Ernte im Spätsommer.","**Haltbar machen:** {{s:trocknen|Trocknen}} oder blanchiert einfrieren.","**Samen:** {{s:samen|Samen ernten}}."]},
   {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["duenger","Dünger"],["schutz","Pflanzenschutz"],["garten","Garten"]],"eintraege":[
    {"id":"jauche","titel":"Brennnesseljauche","kat":"duenger","beleg":"T","teil":"Kraut","kurz":"Stickstoffreicher Flüssigdünger für Starkzehrer.","zutaten":["ca. 1 kg frisches Kraut (ohne Samen)","10 l Regenwasser","1 Handvoll Gesteinsmehl gegen Geruch"],"schritte":["Kraut zerkleinern, in einem Kunststoff- oder Holzgefäß mit Wasser übergießen.","Offen oder mit Gitter abgedeckt an einen sonnigen Platz stellen, täglich umrühren.","Nach 1–2 Wochen, wenn nichts mehr schäumt, ist sie fertig.","1:10 verdünnt auf den Boden gießen, nicht über die Blätter."],"hinweis":"Kein Metallgefäß. Geeignet für Tomaten, Kohl, Kürbis; nicht für Erbsen, Bohnen und Zwiebeln. Mehr: {{s:jauche|Pflanzenjauche}}."},
    {"id":"kaltwasserauszug","titel":"Kaltwasserauszug gegen Blattläuse","kat":"schutz","beleg":"T","teil":"Kraut","kurz":"Kurz angesetzter Auszug zum Spritzen.","zutaten":["ca. 1 kg frisches Kraut","10 l kaltes Wasser"],"schritte":["Kraut im Wasser 12–24 Stunden ziehen lassen, nicht gären lassen.","Abseihen und unverdünnt auf befallene Pflanzen spritzen.","Mehrmals im Abstand von einigen Tagen wiederholen."],"hinweis":"Wirkung je nach Befall unterschiedlich; frisch verwenden. Mehr: {{s:auszug|Auszug und Brühe}}."},
    {"id":"mulch","titel":"Mulch und Kompoststarter","kat":"garten","beleg":"T","teil":"Kraut","kurz":"Grünschnitt düngt den Boden und beschleunigt den Kompost.","zutaten":["abgeschnittenes Kraut ohne Samen"],"schritte":["Als dünne Mulchschicht unter Beerensträucher oder Tomaten legen.","Oder lagenweise in den Kompost geben."],"hinweis":"Keine Pflanzen mit reifen Samen und keine Wurzelstücke verwenden, sonst breiten sie sich aus."},
    {"id":"raupenecke","titel":"Schmetterlingsecke","kat":"garten","beleg":"W","teil":"ganze Pflanze","kurz":"Futterpflanze für Raupen von Tagpfauenauge, Kleinem Fuchs und Admiral.","zutaten":["eine sonnige, ungestörte Ecke"],"schritte":["Einen Bestand stehen lassen und nicht vollständig abmähen.","Teilflächen zeitversetzt schneiden, damit immer junge Triebe da sind."]}
   ]}
  ]},
  {"id":"sicherheit","titel":"Sicherheit","bloecke":[
   {"typ":"text","text":"Brennnessel gilt als gut verträglich. Als Arzneimittel darf sie aber nicht bei Wasseransammlungen durch Herz- oder Nierenschwäche angewendet werden."},
   {"typ":"abschnitt","titel":"Gegenanzeigen (laut Beipackzetteln)","liste":["Überempfindlichkeit gegen Brennnessel","Wasseransammlungen (Ödeme) durch eingeschränkte Herz- oder Nierentätigkeit","Wenn der Arzt eine verringerte Trinkmenge empfohlen hat"]},
   {"typ":"abschnitt","titel":"Vorsicht","liste":["Kinder unter 12 Jahren, Schwangere und Stillende: nicht als Arzneimittel anwenden. Als Gemüse in üblichen Mengen gilt sie als unbedenklich.","Diabetes, Leber- oder Nierenerkrankungen: vorher mit dem Arzt sprechen.","Blutverdünner vom Typ Vitamin-K-Antagonist (z. B. Marcumar): keine großen, schwankenden Mengen essen ({{b:vitamin-k|Vitamin K}}).","Arzt aufsuchen bei Fieber, Blut im Urin, Krämpfen oder Beschwerden länger als eine Woche.","Wurzelpräparate lindern Prostatabeschwerden, ersetzen aber keine ärztliche Kontrolle."]},
   {"typ":"hinweis","text":"**Wechselwirkungen:** In den Beipackzetteln sind keine bekannt. An gedüngten Standorten kann sich {{b:nitrat|Nitrat}} anreichern."}
  ]},

{
 "id":"p02","nr":"P-02","name":"Giersch","botan":"Aegopodium podagraria L.","volksnamen":["Geißfuß","Zipperleinskraut","Podagrakraut","Gichtkraut"],
 "kurz":"Gefürchtetes Gartenunkraut und eines der besten Wildgemüse: mild-würzig nach Petersilie und Möhre, reich an Kalium und Vitamin C. Wichtig: Er hat giftige Doppelgänger.",
 "steckbrief":[["Familie","Doldenblütler (Apiaceae)"],["Lebensform","ausdauernde Staude mit unterirdischen Ausläufern"],["Größe","bis ca. 90 cm"],["Blütezeit","Mai bis September, weiße Doppeldolden"],["Sammelzeit","März bis September; am zartesten März bis Mai"],["Verwendete Teile","Blätter, Blattstiele, Blüten, Samen"],["Nicht essen","Wurzel (laut Altmeyers giftig)"],["Name","Aegopodium = Ziegenfuß (Blattform), podagraria = von Podagra, Gicht"]],
 "reiter":[
  {"id":"botanik","titel":"Botanik","bloecke":[
   {"typ":"hinweis","text":"**Verwechslungsgefahr:** Giersch gehört zu den Doldenblütlern. Zu ihnen zählen auch hochgiftige Arten wie Gefleckter Schierling, Hundspetersilie und Wasserschierling. Nur sammeln, was alle drei Merkmale unten zeigt."},
   {"typ":"abschnitt","titel":"Erkennen nach der 3-3-3-Regel","nummern":["**Drei Teile:** Das Blatt ist dreigeteilt, und jeder Teil ist noch einmal dreigeteilt.","**Dreikantig:** Der Blattstiel ist dreikantig mit einer Rinne auf der Oberseite.","**Duft:** Zerriebene Blätter riechen nach Möhre und Petersilie."]},
   {"typ":"tabelle","kopf":["Merkmal","Giersch","Gefleckter Schierling","Hundspetersilie"],"zeilen":[
    ["Blatt","3 × 3 Teilblättchen, breit, gesägt","fein, mehrfach gefiedert, farnartig","fein gefiedert, Unterseite glänzend"],
    ["Stiel","dreikantig, grün, behaart bis kahl","rund, bläulich bereift, rotbraun gefleckt","rund, oft rötlich überlaufen"],
    ["Geruch","Möhre, Petersilie","unangenehm nach Mäuseharn","unangenehm, knoblauchartig"],
    ["Wuchs","dichte Teppiche, Ausläufer","einzeln, bis 2 m hoch","einzeln, Äcker und Gärten"]]},
   {"typ":"text","text":"Die Merkmale der giftigen Arten beschreiben die typische Form. Im Zweifel nicht essen und eine Pflanzenführung oder ein Bestimmungsbuch hinzuziehen."},
   {"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März:** erste hellgrüne, glänzende Blätter, am mildesten im Geschmack.","**April–Mai:** Hauptsaison für Salat, Pesto, Spinat.","**Mai–September:** Blüte in weißen Doppeldolden; ältere Blätter werden herber.","**Spätsommer:** Samen reifen.","**Ganzjährig:** Ausbreitung über weiße, unterirdische Ausläufer. Schon kleine Wurzelstücke treiben neu aus."]},
   {"typ":"abschnitt","titel":"Standort","liste":["Frische, nährstoffreiche, lockere Böden","Halbschatten: Hecken, Waldränder, Gebüsche, Gärten, Parks","Bildet dichte Teppiche und verdrängt andere Pflanzen"]},
   {"typ":"text","text":"Die weißen Dolden sind eine Bienenweide. Der NABU nennt Dukatenfalter und Kleinen Eisvogel als Falter, die Giersch nutzen."}
  ]},
  {"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[
   {"typ":"text","text":"Giersch ist besonders reich an Kalium und enthält dazu Vitamin C, Provitamin A, Mineralstoffe und Eiweiß. Für frische Blätter werden etwa 576 mg Kalium und 99 mg Calcium pro 100 g angegeben."},
   {"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[

    ["Cumarine","verschiedene Cumarin-Abkömmlinge","{{b:cumarine|Cumarine}}"],
    ["Polyacetylene","Falcarinol-artige Verbindungen","{{b:polyacetylene|Polyacetylene}}"],
    ["Ätherisches Öl","Mono- und Sesquiterpene (Möhrenduft)","–"],

  {"id":"wirkung","titel":"Wirkung","bloecke":[

  {"id":"heilkunde","titel":"Heilkunde","bloecke":[

    {"id":"auflage","titel":"Blattauflage bei Gelenkschmerzen","kat":"aeusserlich","beleg":"T","teil":"frische Blätter","kurz":"Alter Umschlag auf schmerzende Gelenke.","zutaten":["1 Handvoll frische Blätter","ein Tuch"],"schritte":["Blätter mit dem Nudelholz quetschen oder im Mörser zerstoßen.","Auf das Gelenk legen, mit einem Tuch fixieren.","20–30 Minuten wirken lassen."],"hinweis":"Nicht auf offene Haut; bei Hautreizung entfernen."},
    {"id":"stich","titel":"Erste Hilfe bei Insektenstichen","kat":"aeusserlich","beleg":"T","teil":"frisches Blatt","kurz":"Ein Blatt zerreiben und auflegen, wie man es vom Spitzwegerich kennt.","zutaten":["1–2 frische Blätter"],"schritte":["Blatt zwischen den Fingern zerreiben, bis Saft austritt.","Auf den Stich drücken."]},

  {"id":"rezepte","titel":"Rezepte","bloecke":[
   {"typ":"text","text":"Giersch schmeckt mild nach Petersilie und Möhre. Am besten sind die jungen, glänzenden, noch gefalteten Blätter. Regelmäßiges Abschneiden hält sie zart."},
   {"typ":"karten","art":"rezept","filter":[["alle","Alle"],["roh","Roh & Salat"],["gemuese","Gemüse & Suppen"],["wuerzen","Würzen & Vorrat"],["getraenke","Getränke"]],"eintraege":[
    {"id":"salat","titel":"Gierschsalat mit Ei","kat":"roh","menge":"2 Portionen","zeit":"15 Min.","zutaten":["2 Handvoll junge Gierschblätter","1 Handvoll Feldsalat oder Löwenzahn","2 hartgekochte Eier","2 EL Öl, 1 EL Apfelessig","1 TL Senf, Salz, Pfeffer, Honig"],"schritte":["Blätter waschen, große Blätter zupfen.","Dressing aus Öl, Essig, Senf und Gewürzen rühren.","Mit Salat mischen, Eier in Scheiben darauflegen."]},
    {"id":"quark","titel":"Giersch-Kräuterquark","kat":"roh","menge":"4 Portionen","zeit":"10 Min.","zutaten":["1 Handvoll junge Gierschblätter","250 g Quark","3 EL Milch oder Joghurt","1 kleine Knoblauchzehe","Salz, Pfeffer, Zitronensaft"],"schritte":["Giersch sehr fein hacken.","Mit Quark, Milch und Knoblauch glattrühren.","Abschmecken."],"tipp":"Zu Pellkartoffeln, ein Klassiker im Saarland wie anderswo."},
    {"id":"smoothie","titel":"Giersch-Apfel-Smoothie","kat":"getraenke","menge":"2 Gläser","zeit":"5 Min.","zutaten":["1 Handvoll junge Gierschblätter","1 Apfel","1 Banane","Saft einer halben Zitrone","250 ml Wasser"],"schritte":["Alles im Mixer 1 Minute fein pürieren.","Sofort trinken."]},
    {"id":"wasser","titel":"Giersch-Gurken-Wasser","kat":"getraenke","menge":"1 Liter","zeit":"5 Min. + 2 Std.","zutaten":["5–6 Gierschstängel mit Blättern","eine halbe Gurke in Scheiben","1 l kaltes Wasser"],"schritte":["Alles in einen Krug geben.","2 Stunden kühl ziehen lassen."]},
    {"id":"spinat","titel":"Gierschspinat","kat":"gemuese","menge":"2 Portionen","zeit":"15 Min.","zutaten":["300 g Giersch (Blätter und zarte Stiele)","1 Zwiebel","1 EL Butter","Salz, Pfeffer, Muskat"],"schritte":["Giersch waschen und grob hacken.","Zwiebel in Butter dünsten, Giersch zugeben.","3–4 Minuten zusammenfallen lassen, würzen."],"tipp":"Fällt stark zusammen, also reichlich sammeln."},
    {"id":"suppe","titel":"Gierschsuppe","kat":"gemuese","menge":"4 Portionen","zeit":"30 Min.","zutaten":["200 g Giersch","300 g Kartoffeln","1 Zwiebel","1 l Gemüsebrühe","100 ml Sahne","Salz, Pfeffer, Muskat"],"schritte":["Zwiebel andünsten, Kartoffeln würfeln, mit Brühe 15 Minuten kochen.","Giersch zugeben, 3 Minuten mitkochen.","Pürieren, Sahne einrühren, abschmecken."]},
    {"id":"frittata","titel":"Giersch-Frittata","kat":"gemuese","menge":"2 Portionen","zeit":"20 Min.","zutaten":["2 Handvoll Giersch, gehackt","5 Eier","50 g geriebener Käse","1 Zwiebel","Öl, Salz, Pfeffer"],"schritte":["Zwiebel in einer ofenfesten Pfanne anbraten, Giersch kurz mitbraten.","Eier mit Käse und Gewürzen verquirlen, darübergießen.","Bei kleiner Hitze stocken lassen, dann 5 Minuten unter den Backofengrill."]},
    {"id":"pesto","titel":"Gierschpesto","kat":"wuerzen","menge":"1 Glas (ca. 200 ml)","zeit":"10 Min.","zutaten":["100 g junge Gierschblätter","40 g Sonnenblumenkerne oder Walnüsse","40 g Parmesan","1 Knoblauchzehe","ca. 120 ml Olivenöl","Salz, Zitronensaft"],"schritte":["Kerne ohne Fett anrösten.","Giersch roh mit allen Zutaten im Mixer pürieren, Öl nach und nach zugeben.","Ins Glas füllen und mit Öl bedecken."],"tipp":"Anders als Brennnessel muss Giersch nicht blanchiert werden. Hält gekühlt etwa eine Woche."},
    {"id":"wuerzpaste","titel":"Giersch-Würzpaste auf Vorrat","kat":"wuerzen","menge":"2 kleine Gläser","zeit":"15 Min.","zutaten":["200 g Giersch","20 g Salz","ca. 80 ml Öl"],"schritte":["Giersch fein hacken oder mixen.","Mit Salz und Öl verrühren, fest in saubere Gläser drücken.","Mit Öl abdecken, kühl lagern."],"tipp":"Durch das Salz einige Wochen haltbar. Löffelweise in Suppen und Soßen, dann nicht nachsalzen."},
    {"id":"samen","titel":"Gierschsamen als Gewürz","kat":"wuerzen","menge":"1 kleines Glas","zeit":"Ernte + Trocknen","zutaten":["reife Samendolden im Spätsommer"],"schritte":["Dolden schneiden, wenn die Samen bräunlich sind.","In einer Papiertüte trocknen, ausreiben, sieben ({{s:samen|Samen ernten}}).","Wie Kümmel zu Brot, Kohl und Kartoffeln verwenden."],"tipp":"Nur sammeln, wenn die Pflanze sicher bestimmt ist."}

  {"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[
   {"typ":"text","text":"Giersch wird man im Garten kaum wieder los. Der NABU empfiehlt, ihn durch häufiges Ernten statt durch Gift in Schach zu halten. So wird aus dem Unkraut ein Gemüsebeet, das sich selbst pflegt."},
   {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["duenger","Dünger"]],"eintraege":[
    {"id":"ernten","titel":"Aufessen statt bekämpfen","kat":"garten","beleg":"T","teil":"ganze Pflanze","kurz":"Regelmäßiges Schneiden schwächt die Pflanze und liefert laufend zarte Blätter.","zutaten":["Schere oder Sichel"],"schritte":["Bestand alle 2–3 Wochen bodennah abschneiden.","Blüte verhindern, damit er sich nicht aussät.","Ernte in die Küche."]},
    {"id":"abdecken","titel":"Fläche abdecken","kat":"garten","beleg":"T","teil":"Wurzelausläufer","kurz":"Ohne Licht stirbt der Bestand mit der Zeit ab.","zutaten":["Pappe oder lichtdichte Folie","Mulch zum Beschweren"],"schritte":["Fläche bodennah mähen.","Lückenlos mit Pappe oder Folie abdecken, Ränder überlappen.","Mindestens eine Saison liegen lassen."],"hinweis":"Wurzelstücke nicht auf den Kompost: Sie treiben wieder aus."},
    {"id":"jauche","titel":"Gierschjauche","kat":"duenger","beleg":"T","teil":"Kraut","kurz":"Wie {{p:p01#selbstversorgung-jauche|Brennnesseljauche}} als mild düngende Pflanzenjauche.","zutaten":["ca. 1 kg Kraut ohne Wurzeln","10 l Regenwasser"],"schritte":["Kraut zerkleinern und ansetzen, täglich umrühren.","Nach 1–2 Wochen 1:10 verdünnt gießen ({{s:jauche|Pflanzenjauche}})."]},
    {"id":"insekten","titel":"Blühinsel für Insekten","kat":"garten","beleg":"W","teil":"Blüten","kurz":"Eine kleine Ecke blühen lassen: Bienen und Falter besuchen die Dolden.","zutaten":["eine begrenzte Ecke, z. B. mit Wurzelsperre"],"schritte":["Ecke ausblühen lassen.","Vor der Samenreife abschneiden, damit er sich nicht verbreitet."]}
   ]}
  ]},
  {"id":"sicherheit","titel":"Sicherheit","bloecke":[
   {"typ":"text","text":"Das größte Risiko beim Giersch ist die Verwechslung mit giftigen Doldenblütlern. Ein sicher bestimmter Giersch gilt als gut verträglich."},
   {"typ":"abschnitt","titel":"Worauf achten","liste":["**Bestimmung:** nur Pflanzen mit 3-3-3-Blatt, dreikantigem Stiel und Möhrenduft sammeln ({{p:p02#botanik|Botanik}}).","**Wurzel:** nicht essen.","**Allergie:** Wer auf Beifuß- oder Birkenpollen reagiert, kann auch auf Giersch allergisch reagieren, bis hin zu Juckreiz im Mund.","**Hautkontakt:** Doldenblütler können bei empfindlicher Haut reizen; bei Rötung Handschuhe tragen.","**Gicht:** Giersch ersetzt keine ärztliche Behandlung."]},
   {"typ":"hinweis","text":"**Wechselwirkungen:** keine bekannt. Giersch ist kein geprüftes Arzneimittel, daher gibt es keine amtlichen Angaben."}
  ]},

{
 "id":"p03","nr":"P-03","name":"Löwenzahn","botan":"Taraxacum officinale (F. H. Wigg.)","volksnamen":["Pusteblume","Kuhblume","Butterblume","Bettsaicher (Saarland, Pfalz)"],
 "kurz":"Von der Wurzel bis zur Blüte essbar und eine der ältesten Bitterpflanzen der Volksmedizin. Die Bitterstoffe regen Appetit, Verdauung und Galle an, die Blätter treiben Wasser aus. Im Saarland kennt man ihn als Bettsaicher-Salat.",
 "steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","ausdauernde Staude mit langer Pfahlwurzel"],["Größe","10–40 cm"],["Blütezeit","Hauptblüte April–Mai, Nachblüte bis Herbst"],["Sammelzeit","Blätter März–Mai (vor der Blüte am mildesten), Blüten April–Mai, Wurzel Herbst oder zeitiges Frühjahr"],["Verwendete Teile","Wurzel, Blätter, Blüten, Knospen"],["Arzneidroge","Löwenzahnwurzel mit Kraut (Taraxaci radix cum herba), Qualität im Europäischen Arzneibuch"],["Name","Taraxacum vermutlich aus dem Arabischen/Persischen für Bitterkraut; Löwenzahn nach den gezähnten Blättern"]],
 "reiter":[
  {"id":"botanik","titel":"Botanik","bloecke":[
   {"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** in einer bodennahen Rosette, tief gezähnt wie Löwenzähne, kahl, mit hellem Mittelnerv.","**Blütenstand:** ein einzelner goldgelber Korb aus 100–200 Zungenblüten auf einem hohlen, blattlosen Stängel.","**Milchsaft:** alle Teile führen weißen, bitteren Milchsaft, der braune Flecken macht.","**Frucht:** die Pusteblume – Achänen mit Schirmchen, die der Wind kilometerweit trägt.","**Wurzel:** fleischige Pfahlwurzel, außen braun, innen weiß, bis über 1 m tief."]},
   {"typ":"hinweis","text":"**Verwechslung:** Ähnlich sehen Herbst-Löwenzahn, Ferkelkraut und Pippau aus; sie sind ungiftig. Ein sicheres Merkmal des echten Löwenzahns: hohler, unverzweigter Stängel mit nur einer Blüte und Blätter ganz ohne Haare."},
   {"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März:** Rosette treibt aus der Pfahlwurzel; zarteste Blätter.","**April–Mai:** Massenblüte, eine der ersten großen Bienenweiden.","**Mai–Juni:** Pusteblumen; die Blätter werden bitterer und zäher.","**Sommer–Herbst:** Nachblüte; die Wurzel speichert Inulin und ist im Herbst am süßesten.","**Winter:** Rosette zieht ein, Wurzel überdauert."]},
   {"typ":"text","text":"Die meisten Löwenzahn-Samen entstehen ohne Bestäubung (Apomixis) – jede Pflanze erzeugt genetische Kopien ihrer selbst. Darum gibt es Hunderte leicht verschiedener Kleinarten."},
   {"typ":"abschnitt","titel":"Standort","liste":["Fette Wiesen, Weiden, Wegränder, Rasen, Gärten – fast überall.","Zeigerpflanze für stickstoffreiche, gut gedüngte Böden.","Sammeln: nicht an Straßen, Hundewiesen und frisch gedüngten Wiesen ({{b:nitrat|Nitrat}})."]}
  ]},

  {"id":"heilkunde","titel":"Heilkunde","bloecke":[
   {"typ":"text","text":"Bitterstoffe wirken schon auf der Zunge: Sie lösen über Reflexe die Verdauungssäfte aus. Darum Bittertees vor dem Essen und ungesüßt trinken."},
   {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[
    {"id":"tee-verdauung","titel":"Wurzeltee für die Verdauung","kat":"innerlich","beleg":"W","teil":"Wurzel mit Kraut","kurz":"Bei Völlegefühl, Blähungen und Appetitlosigkeit.","zutaten":["3–4 g geschnittene Wurzel mit Kraut (ca. 1 gehäufter TL)","150 ml Wasser"],"schritte":["Mit kaltem Wasser ansetzen, aufkochen, 1 Minute köcheln.","10 Minuten ziehen lassen, abseihen.","Eine halbe Stunde vor dem Essen trinken, bis 3 Tassen am Tag."],"hinweis":"Nicht bei Gallengangsverschluss; bei Gallensteinen nur nach Rücksprache mit dem Arzt."},
    {"id":"tee-harnwege","titel":"Blättertee zur Durchspülung","kat":"innerlich","beleg":"W","teil":"Blätter","kurz":"Unterstützend bei leichten Harnwegsbeschwerden.","zutaten":["1 EL getrocknete Blätter","150 ml kochendes Wasser"],"schritte":["Übergießen, 10 Minuten ziehen lassen.","3 Tassen über den Tag verteilt, dazu mindestens 2 Liter trinken.","Nicht abends – er treibt Wasser."]},
    {"id":"presssaft","titel":"Frischpflanzen-Presssaft","kat":"innerlich","beleg":"T","teil":"ganze Pflanze","kurz":"Klassische Frühjahrskur über 4 Wochen.","zutaten":["frische Blätter mit Wurzel","Entsafter oder Mixer und Tuch"],"schritte":["Pflanzen gründlich waschen und entsaften.","3-mal täglich etwa 20 ml (ca. 1 EL) in Wasser.","Frisch verbrauchen."]},
    {"id":"tinktur","titel":"Löwenzahntinktur","kat":"innerlich","beleg":"T","teil":"Wurzel","kurz":"Haltbares Bittermittel für unterwegs.","zutaten":["50 g frische, gehackte Wurzel","250 ml Korn oder Wodka (38–40 %)","dunkles Schraubglas"],"schritte":["Wurzel ins Glas, mit Alkohol bedecken.","3–4 Wochen dunkel ziehen lassen, täglich schütteln.","Abseihen, in Tropfflasche füllen.","3-mal täglich 10–15 Tropfen in Wasser vor dem Essen."],"hinweis":"Enthält Alkohol – nicht für Kinder und bei Alkoholproblemen."},
    {"id":"kur","titel":"Löwenzahn-Frühjahrskur","kat":"innerlich","beleg":"T","teil":"Blätter, Stängel","kurz":"Täglich frisches Grün über 3–4 Wochen im April.","zutaten":["täglich eine Handvoll junge Blätter","nach Volksbrauch 5–10 rohe Blütenstängel"],"schritte":["Blätter in Salat oder Smoothie.","Die Stängel roh kauen – sie schmecken bitter-süß.","Mit {{p:p01#heilkunde-fruehjahrskur|Brennnessel}} und {{p:p02#heilkunde-kur|Giersch}} kombinieren."]},
    {"id":"warzen","titel":"Milchsaft gegen Warzen","kat":"aeusserlich","beleg":"T","teil":"Stängel","kurz":"Altes Hausmittel: täglich frischen Milchsaft auftupfen.","zutaten":["frisch abgebrochene Stängel"],"schritte":["Stängel abbrechen, den weißen Saft auf die Warze tupfen.","2–3-mal täglich über einige Wochen wiederholen."],"hinweis":"Nicht belegt. Der Saft färbt braun und kann bei Empfindlichen die Haut reizen."},
    {"id":"hautoel","titel":"Blütenöl für trockene Haut","kat":"aeusserlich","beleg":"T","teil":"Blüten","kurz":"Ölauszug als Massage- und Pflegeöl.","zutaten":["Blüten (über Nacht angewelkt)","Olivenöl oder Sonnenblumenöl","Schraubglas"],"schritte":["Blüten locker ins Glas füllen, mit Öl vollständig bedecken.","4 Wochen warm und hell stehen lassen, täglich schwenken.","Abseihen, dunkel lagern, binnen 6 Monaten verbrauchen."],"hinweis":"Blüten vorher anwelken lassen, sonst kann das Wasser das Öl verderben."}
   ]}

  {"id":"rezepte","titel":"Rezepte","bloecke":[
   {"typ":"text","text":"Junge Blätter vor der Blüte sind am mildesten. Wer es noch milder mag, legt sie 30 Minuten in lauwarmes Wasser oder bleicht die Pflanzen (siehe Selbstversorgung)."},
   {"typ":"karten","art":"rezept","filter":[["alle","Alle"],["salat","Salate"],["warm","Warme Gerichte"],["vorrat","Vorrat & Süßes"],["getraenke","Getränke"]],"eintraege":[
    {"id":"bettsaicher","titel":"Bettsaicher-Salat mit Speck","kat":"salat","menge":"4 Portionen","zeit":"30 Min.","zutaten":["300 g junge Löwenzahnblätter","500 g festkochende Kartoffeln","150 g durchwachsener Speck","1 Zwiebel","3 EL Essig, 2 EL Öl","Salz, Pfeffer, etwas Zucker","2 hartgekochte Eier (nach Wunsch)"],"schritte":["Kartoffeln kochen, pellen, in Scheiben schneiden.","Blätter waschen, in mundgerechte Stücke zupfen.","Speck würfeln und knusprig braten, Zwiebel mitbraten.","Pfanne vom Herd nehmen, Essig, Öl und Gewürze einrühren.","Die warme Marinade über Salat und Kartoffeln gießen, sofort servieren."],"tipp":"So isst man ihn im Saarland und in der Pfalz. Die warme Specksoße mildert die Bitterkeit."},
    {"id":"wildkraeutersalat","titel":"Wildkräutersalat mit Blüten","kat":"salat","menge":"2 Portionen","zeit":"15 Min.","zutaten":["2 Handvoll junge Löwenzahnblätter","1 Handvoll {{p:p02|Giersch}} und Gänseblümchen","1 Apfel","2 EL Walnüsse","Dressing: 3 EL Öl, 1 EL Apfelessig, 1 TL Honig, 1 TL Senf"],"schritte":["Blätter zupfen, Apfel in feine Scheiben schneiden.","Dressing verrühren, alles mischen.","Mit Nüssen und Löwenzahn-Blütenblättern bestreuen."]},
    {"id":"pesto","titel":"Löwenzahnpesto","kat":"vorrat","menge":"1 Glas (200 ml)","zeit":"10 Min.","zutaten":["80 g junge Blätter","40 g Sonnenblumenkerne, geröstet","40 g Parmesan","1 Knoblauchzehe","120 ml Olivenöl","Salz, Zitronensaft, 1 TL Honig"],"schritte":["Alles im Mixer grob pürieren, Öl nach und nach zugeben.","Mit Honig und Zitrone die Bitterkeit ausgleichen.","Ins Glas füllen, mit Öl bedecken, kühl lagern."]},

    {"id":"blueten-teig","titel":"Ausgebackene Löwenzahnblüten","kat":"warm","menge":"2 Portionen","zeit":"20 Min.","zutaten":["20 voll geöffnete Blüten mit kurzem Stiel","100 g Mehl","1 Ei","150 ml Milch oder Bier","Prise Salz","Öl zum Ausbacken"],"schritte":["Blüten ausschütteln, nicht waschen.","Mehl, Ei, Milch und Salz zu glattem Teig rühren.","Blüten am Stiel durch den Teig ziehen.","In heißem Öl goldgelb backen, auf Küchenpapier abtropfen."],"tipp":"Süß mit Zucker und Zimt oder herzhaft mit Kräuterquark."},

    {"id":"honig","titel":"Löwenzahnhonig (Blütensirup)","kat":"vorrat","menge":"ca. 3 Gläser","zeit":"1 Tag + 2 Std.","zutaten":["300 g Löwenzahnblüten (ca. 4 Handvoll)","1 l Wasser","1 Bio-Zitrone","1 kg Zucker"],"schritte":["Blüten ausschütteln, grüne Kelchblätter möglichst entfernen.","Mit Wasser und Zitronenscheiben aufkochen, über Nacht ziehen lassen.","Abseihen, gut ausdrücken.","Mit Zucker offen 1,5–2 Stunden einkochen, bis er honigartig fließt (Gelierprobe auf kaltem Teller).","Heiß in saubere Gläser füllen."],"tipp":"Vegane Honigalternative. Ohne Kelchblätter wird er milder und heller."},

 "reiter":[
  {"id":"botanik","titel":"Botanik","bloecke":[
   {"typ":"abschnitt","titel":"Aussehen","liste":["**Wuchs:** mehrstämmiger Strauch mit überhängenden Zweigen.","**Rinde:** graubraun, mit hellen Korkwarzen; junge Zweige mit weißem, weichem Mark.","**Blätter:** gegenständig, unpaarig gefiedert mit 5–7 gesägten Fiederblättern, riechen beim Zerreiben unangenehm.","**Blüten:** viele kleine, cremeweiße Sternblüten in flachen Schirmrispen bis 20 cm, süßer Duft.","**Früchte:** schwarzviolette Steinbeeren an rot werdenden, hängenden Dolden."]},
   {"typ":"hinweis","text":"**Verwechslung mit Zwergholunder (Attich, Sambucus ebulus):** Attich ist giftig und krautig, nur 1–2 m hoch, stirbt im Winter ab. Seine Fruchtstände stehen aufrecht, die Blüten haben rötliche Staubbeutel. Der Schwarze Holunder ist verholzt und seine reifen Dolden hängen. Auch Roter Holunder (Traubenholunder) mit roten Beeren in Trauben ist roh giftig."},
   {"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**April:** Blattaustrieb.","**Mai–Juni:** Blüte; Ernte für Sirup und Tee an trockenen, sonnigen Vormittagen.","**August–September:** Beerenreife, wenn alle Beeren der Dolde schwarz sind.","**Herbst–Winter:** Laubfall; Stecklinge schneiden."]},
   {"typ":"abschnitt","titel":"Standort","liste":["Waldränder, Hecken, Bachufer, Schuttplätze, alte Höfe.","Stickstoffzeiger; wächst gern dort, wo Menschen leben.","Früher stand an fast jedem Bauernhaus ein Holunder als Hausbaum. Im Volksglauben wohnte darin Frau Holle, die Schützerin von Haus und Hof [A]."]}

  {"id":"rezepte","titel":"Rezepte","bloecke":[
   {"typ":"text","text":"Blüten: an einem sonnigen Vormittag ernten, nicht waschen, nur ausschütteln – der Pollen trägt das Aroma. Beeren: nur ganz schwarze Dolden, Stiele entfernen und immer auf über 80 °C erhitzen."},

    {"id":"kuechle","titel":"Holunderküchle (ausgebackene Blüten)","kat":"blueten","menge":"4 Portionen","zeit":"20 Min.","zutaten":["12 Blütendolden mit Stiel","200 g Mehl","2 Eier","250 ml Milch oder Bier","1 EL Zucker, Prise Salz","Öl zum Ausbacken, Puderzucker, Zimt"],"schritte":["Teig aus Mehl, Eiern, Milch, Zucker und Salz rühren, 15 Minuten quellen lassen.","Dolden am Stiel in den Teig tauchen, abtropfen lassen.","In heißem Öl kopfüber goldgelb backen.","Dicke Stiele abschneiden, mit Puderzucker und Zimt bestreuen."],"tipp":"Dazu passt Apfel- oder Holunderbeerenmus."},

    {"id":"holundersekt","titel":"Holunderblüten-Spritz (gegoren)","kat":"getraenke","menge":"ca. 5 l","zeit":"20 Min. + 1–2 Wochen","zutaten":["10 Blütendolden","5 l Wasser","600 g Zucker","2 Bio-Zitronen","2 EL Weißweinessig"],"schritte":["Zucker in warmem Wasser lösen, abkühlen lassen.","Dolden, Zitronenscheiben und Essig zugeben, abgedeckt 3–5 Tage stehen lassen, bis es zu sprudeln beginnt.","Abseihen, in Bügelflaschen füllen.","Kühl lagern und innerhalb von 2 Wochen trinken; Flaschen täglich kurz entlüften."],"tipp":"Natürliche Hefen sorgen für Kohlensäure; enthält wenig Alkohol. Flaschen können bei Wärme platzen."},

    {"id":"saft","titel":"Holunderbeersaft","kat":"beeren","menge":"je nach Menge","zeit":"1–2 Std.","zutaten":["vollreife Beerendolden","Dampfentsafter oder großer Topf und Tuch","nach Wunsch Zucker oder Äpfel"],"schritte":["Beeren mit einer Gabel von den Stielen streifen.","Im Dampfentsafter etwa 1 Stunde entsaften.","Oder Beeren mit wenig Wasser 10 Minuten kochen und durch ein Tuch pressen.","Heiß (über 80 °C) in saubere Flaschen füllen."],"tipp":"Grüne Stiele und unreife Beeren gründlich aussortieren."},
    {"id":"beeren-gelee","titel":"Holunderbeergelee","kat":"beeren","menge":"5 Gläser","zeit":"20 Min.","zutaten":["750 ml Holunderbeersaft","500 g Gelierzucker 2:1","Saft einer Zitrone","nach Wunsch 1 Zimtstange"],"schritte":["Saft mit Gelierzucker, Zitrone und Zimt aufkochen.","4 Minuten sprudelnd kochen, Zimt entfernen, heiß abfüllen."]},

 "steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","einjährig, sät sich selbst aus"],["Größe","30–60 cm"],["Blütezeit","Juni bis zum ersten Frost"],["Sammelzeit","laufend, voll geöffnete Blüten an trockenen Vormittagen"],["Verwendete Teile","Blüten (ganze Körbe oder Zungenblüten)"],["Arzneidroge","Ringelblumenblüten (Calendulae flos), HMPC, ESCOP, Kommission E"],["Name","Calendula von lateinisch calendae (Monatsanfang): Sie blüht fast jeden Monat"]],

  {"id":"heilkunde","titel":"Heilkunde","bloecke":[

   {"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["salben","Salben & Öle"],["umschlag","Umschläge & Spülungen"]],"eintraege":[
    {"id":"salbe-fett","titel":"Ringelblumensalbe nach Großmutterart","kat":"salben","beleg":"T","teil":"frische Blüten","kurz":"Der Klassiker mit Schmalz – einfach, wirksam, gut haltbar im Kühlschrank.","zutaten":["250 g Schweineschmalz","2 Handvoll frische Blüten (ganze Körbe)"],"schritte":["Schmalz schmelzen, Blüten zugeben, kurz aufschäumen lassen, nicht braten.","Vom Herd nehmen, zugedeckt über Nacht stehen lassen.","Am nächsten Tag leicht erwärmen und durch ein Leinentuch abseihen.","In saubere Tiegel füllen, kühl lagern; ca. 1 Jahr haltbar."],"hinweis":"Auf trockene, kleine Wunden, Schrunden, raue Haut. Nicht auf tiefe oder eitrige Wunden."},
    {"id":"salbe-vegan","titel":"Ringelblumensalbe mit Öl und Bienenwachs","kat":"salben","beleg":"T","teil":"Ringelblumenöl","kurz":"Feinere Salbe aus dem Ölauszug.","zutaten":["100 ml Ringelblumenöl (siehe unten)","10–12 g Bienenwachs (vegan: Candelillawachs, ca. 7 g)","nach Wunsch 10 g Sheabutter"],"schritte":["Öl und Wachs im Wasserbad schmelzen.","Konsistenz prüfen: ein Tropfen auf kaltem Teller – mehr Wachs macht fester.","In Tiegel füllen, offen abkühlen lassen, dann verschließen."]},
    {"id":"oel","titel":"Ringelblumenöl (Ölauszug)","kat":"salben","beleg":"T","teil":"getrocknete Blüten","kurz":"Grundlage für Salben, Massage- und Babyöl.","zutaten":["getrocknete Blüten","Oliven- oder Mandelöl","Schraubglas"],"schritte":["Glas zu zwei Dritteln mit Blüten füllen, mit Öl vollständig bedecken.","4–6 Wochen hell und warm stehen lassen, täglich schwenken.","Abseihen, dunkel lagern."],"hinweis":"Getrocknete Blüten verwenden – frische enthalten Wasser, das Öl schimmelt."},
    {"id":"umschlag","titel":"Wundumschlag","kat":"umschlag","beleg":"W","teil":"Blüten","kurz":"Bei kleinen, schlecht heilenden Wunden und Hautentzündungen.","zutaten":["1–2 g Blüten (1–2 TL) pro 150 ml Wasser","sterile Kompresse"],"schritte":["Tee aufgießen, 10 Minuten ziehen lassen, gut abseihen, abkühlen lassen.","Kompresse tränken und mehrmals täglich auflegen."]},
    {"id":"mundspuelung","titel":"Mund- und Gurgelspülung","kat":"umschlag","beleg":"W","teil":"Blüten oder Tinktur","kurz":"Bei Zahnfleisch- und Mundschleimhautentzündung.","zutaten":["Tee wie beim Umschlag","oder 2–4 ml Tinktur auf 250–500 ml Wasser"],"schritte":["Lauwarm mehrmals täglich spülen und gurgeln.","Nicht schlucken."]},
    {"id":"lippenbalsam","titel":"Lippenbalsam","kat":"salben","beleg":"T","teil":"Ringelblumenöl","kurz":"Für rissige Lippen im Winter.","zutaten":["15 ml Ringelblumenöl","5 g Bienenwachs","5 g Kakaobutter"],"schritte":["Im Wasserbad schmelzen.","In kleine Döschen oder Stifthülsen füllen."]}

  {"id":"rezepte","titel":"Rezepte","bloecke":[
   {"typ":"text","text":"In der Küche nutzt man vor allem die Zungenblüten (die Blütenblätter). Sie schmecken mild-würzig, leicht herb und färben goldgelb – deshalb der alte Name „Safran des armen Mannes“."},
   {"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"],["getraenke","Getränke"]],"eintraege":[
    {"id":"salat","titel":"Sommersalat mit Ringelblumen","kat":"kueche","menge":"2 Portionen","zeit":"10 Min.","zutaten":["1 Kopf Pflücksalat","1 Gurke","Blütenblätter von 4–5 Blüten","Dressing aus Öl, Zitrone, Honig, Salz"],"schritte":["Salat und Gurke anrichten.","Mit Dressing mischen.","Erst kurz vor dem Servieren die Blütenblätter darüberstreuen."]},
    {"id":"goldreis","titel":"Goldener Reis","kat":"kueche","menge":"4 Portionen","zeit":"25 Min.","zutaten":["250 g Reis","500 ml Gemüsebrühe","2 EL getrocknete oder 4 EL frische Blütenblätter","1 Zwiebel, 1 EL Butter"],"schritte":["Zwiebel in Butter andünsten, Reis zugeben.","Mit Brühe aufgießen, Blütenblätter einrühren.","Zugedeckt 18 Minuten garen."],"tipp":"Färbt wie Safran, schmeckt aber milder."},
    {"id":"butter","titel":"Ringelblumen-Kräuterbutter","kat":"kueche","menge":"125 g","zeit":"10 Min.","zutaten":["125 g weiche Butter","Blütenblätter von 5 Blüten","1 EL Schnittlauch","Salz, Zitronenabrieb"],"schritte":["Alles verrühren, zur Rolle formen und kühlen."],"tipp":"Hübsch zu Brot und gegrilltem Gemüse."},
    {"id":"omelett","titel":"Blüten-Omelett","kat":"kueche","menge":"1 Portion","zeit":"10 Min.","zutaten":["3 Eier","1 EL Blütenblätter","Kräuter, Salz, Pfeffer","Butter"],"schritte":["Eier mit Blüten und Kräutern verquirlen.","In Butter stocken lassen, zusammenklappen."]},

    {"id":"essig","titel":"Ringelblumen-Essig","kat":"vorrat","menge":"500 ml","zeit":"5 Min. + 3 Wochen","zutaten":["1 Handvoll Blüten","500 ml Weißwein- oder Apfelessig"],"schritte":["Blüten in eine Flasche geben, mit Essig übergießen.","3 Wochen hell stehen lassen, abseihen."],"tipp":"Goldgelb, für Salate."},
    {"id":"tee","titel":"Sommerlicher Blütentee","kat":"getraenke","menge":"1 Kanne","zeit":"10 Min.","zutaten":["1 TL Ringelblumen","1 TL Pfefferminze","1 TL Zitronenmelisse"],"schritte":["Mit 500 ml heißem Wasser übergießen, 8 Minuten ziehen lassen.","Warm oder kalt trinken."]}

  {"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[
   {"typ":"text","text":"Die Ringelblume ist die ideale Einsteigerpflanze: einmal säen, jahrelang ernten. Im Gemüsebeet ist sie ein guter Nachbar."},

    {"id":"dauerernte","titel":"Ernten für ständige Blüte","kat":"ernte","beleg":"T","teil":"Blüten","kurz":"Je mehr man pflückt, desto mehr blüht nach.","zutaten":["Schere"],"schritte":["Voll geöffnete Blüten an trockenen Vormittagen abschneiden.","Verblühtes laufend entfernen."]},
    {"id":"trocknen","titel":"Blüten trocknen","kat":"ernte","beleg":"T","teil":"Blüten","kurz":"Für Tee, Öl und Würze im Winter.","zutaten":["Gitter oder Backpapier"],"schritte":["Blüten einzeln auslegen oder Blütenblätter abzupfen.","Im Schatten trocknen, bis sie rascheln.","Dunkel und luftdicht lagern ({{s:trocknen|Kräuter trocknen}})."]},
    {"id":"saatgut","titel":"Eigenes Saatgut","kat":"ernte","beleg":"T","teil":"Samen","kurz":"Die ringförmigen Samen sind leicht zu sammeln.","zutaten":["reife, braune Samenstände"],"schritte":["Im Spätsommer abschneiden und nachtrocknen.","In Papiertüten lagern ({{s:samen|Samen ernten}})."]}

  {"id":"sicherheit","titel":"Sicherheit","bloecke":[
   {"typ":"text","text":"Äußerlich gilt die Ringelblume als sehr gut verträglich. Das Hauptrisiko sind Allergien bei Menschen, die auf Korbblütler reagieren."},

 "id":"p08","nr":"P-08","name":"Johanniskraut","botan":"Hypericum perforatum L.","volksnamen":["Tüpfel-Johanniskraut","Herrgottsblut","Hexenkraut","Sonnwendkraut"],
 "kurz":"Die Sonnenpflanze um den Johannistag (24. Juni): Als Extrakt ist sie eines der am besten untersuchten pflanzlichen Mittel gegen leichte bis mittelschwere Depressionen, als Rotöl ein Hausmittel für Haut und Muskeln. Wichtig: viele Wechselwirkungen mit Medikamenten.",

   {"typ":"hinweis","text":"**Verwechslung:** Es gibt mehrere Johanniskraut-Arten. Das echte erkennt man an der Kombination: zweikantiger Stängel, durchscheinend punktierte Blätter und Blüten, die beim Zerreiben rot färben. Andere gelb blühende Pflanzen wie Jakobskreuzkraut (giftig!) haben keine punktierten Blätter und fiederteilige Blätter."},

"autoren":[
{
 "id":"nehls","nr":"A-01","name":"Dr. Michael Nehls","botan":"Arzt, Molekulargenetiker, Sachbuchautor","volksnamen":[],
 "kurz":"Michael Nehls verbindet Molekularbiologie, Evolution und Lebensstil zu einer Gesamtsicht auf Gehirngesundheit. Sein Leitgedanke: Zivilisationskrankheiten wie Alzheimer entstehen durch eine Lebensweise, die nicht zu unserer Natur passt, und lassen sich deshalb vermeiden.",
 "steckbrief":[["Geboren","20. Oktober 1962, Deutschland"],["Studium","Medizin in Freiburg und Heidelberg (1983–1989)"],["Promotion","1989 Heidelberg, Herzhormone in der Stammesgeschichte"],["Habilitation","1996 MH Hannover, Molekulargenetik der Thymusentwicklung; Lehrbefugnis 1997"],["Forschung","über 50 Fachveröffentlichungen, zwei mit den Nobelpreisträgern Paul Greengard und Martin Evans"],["Auszeichnung","2015 Hanse-Preis für Molekulare Psychiatrie (Universität Rostock)"],["Sport","Ultra-Radfahrer: Race Across America 2008, Platz 7 von 27 Solo-Fahrern"],["Kernthemen","Hippocampus, Alzheimer-Prävention, mentale Energie, Lithium, geistige Freiheit"]],
 "reiter":[
  {"id":"person","titel":"Person","bloecke":[
   {"typ":"text","text":"Nehls arbeitete nach Studium und Habilitation in der Forschung und in leitenden Positionen der Industrie. Seit Anfang der 2010er Jahre schreibt er Sachbücher für ein breites Publikum, zunächst über gesundes Altern, dann vor allem über Alzheimer und das Gehirn."},
   {"typ":"abschnitt","titel":"Werdegang","nummern":["**1983–1989:** Medizinstudium in Freiburg und Heidelberg, Promotion.","**1996/1997:** Habilitation in Hannover, Lehrbefugnis für Molekulargenetik.","**Danach:** Forschung und Management in der Industrie.","**2003:** Rückkehr zum Leistungssport nach rund 20 Jahren Pause.","**2008:** Race Across America, 4.800 km in 10 Tagen und 23 Stunden – mit über 90 Stunden Schlaf, mehr als die Konkurrenz. Für ihn ein Beleg, wie wichtig Erholung für das Gehirn ist.","**2014–2018:** Alzheimer-Bücher, Hanse-Preis 2015, 2016 Veröffentlichung seiner „Unified Theory of Alzheimer's Disease“ (UTAD).","**2021–2023:** Bücher zu Corona, mentaler Energie und geistiger Freiheit.","**2025:** „Das Lithium-Komplott“."]},
   {"typ":"text","text":"Zum Lithium-Kapitel: {{b:lithium-nehls|Lithium · Dr. Nehls}}."}
  ]},

   {"typ":"karten","art":"buch","filter":[["alle","Alle"],["gehirn","Gehirn & Alzheimer"],["ernaehrung","Ernährung"],["gesellschaft","Corona & Gesellschaft"],["sport","Sport"]],"eintraege":[
    {"id":"lithium-komplott","titel":"Das Lithium-Komplott","kat":"gehirn","jahr":"2025","verlag":"Mental Enterprises","kurz":"Plädoyer für Lithium als essenzielles Spurenelement.","zutaten":["Untertitel: Plädoyer für ein essenzielles Spurenelement","464 Seiten, ISBN 978-3-9814048-9-0","Englisch: The Conspiracy Against Lithium"],"schritte":["Lithium ist für das Gehirn lebenswichtig; ein weit verbreiteter Mangel fördert Depression, Alzheimer, Gewalt und Suizid.","Lithium schützt vor chronischer Entzündung, Stress fürs Gehirn und Angst und fördert die Neubildung von Nervenzellen.","Behörden verweigern die Anerkennung; das Verbot von Lithium-Nahrungsergänzung nützt teuren Medikamenten.","Ausführlich im Kapitel {{b:lithium-nehls|Lithium}}."]},
    {"id":"erschoepfte-gehirn","titel":"Das erschöpfte Gehirn","kat":"gehirn","jahr":"2022","verlag":"Heyne","kurz":"Woher unsere mentale Energie kommt und warum sie schwindet.","zutaten":["Untertitel: Der Ursprung unserer mentalen Energie – und warum sie schwindet"],"schritte":["Mentale Erschöpfung ist eine verbreitete Zivilisationskrankheit: Konzentration, Willenskraft und Kreativität lassen nach.","Die Energie des Frontalhirns entsteht im Zusammenspiel mit dem Hippocampus, der Erinnerungen speichert und abrufbar macht.","Der Hippocampus bildet lebenslang neue Nervenzellen (Neurogenese) – wenn wir ihn lassen.","Evolution: Omega-3-reiche Meeresnahrung half beim Wachstum unseres Gehirns.","Empfehlungen: Omega-3 (z. B. Algenöl), Entgiftung, Nähe und Berührung, viel Bewegung und vor allem Lebenssinn als stärkster Antrieb."]},
    {"id":"formel","titel":"Die Formel gegen Alzheimer","kat":"gehirn","jahr":"2018","verlag":"Heyne","kurz":"Praxisleitfaden für ein gehirngesundes Leben zur Vorbeugung und Heilung.","zutaten":["Fasst seine Alzheimer-Bücher als Lebensstil-Programm zusammen"],"schritte":["Alzheimer als Folge vieler Mangelzustände der modernen Lebensweise.","Das Programm setzt an allen Faktoren gleichzeitig an (siehe Reiter Praxis)."]},
    {"id":"kopfkueche","titel":"Kopfküche – Das Anti-Alzheimer-Kochbuch","kat":"ernaehrung","jahr":"2017","verlag":"Systemed","kurz":"Rezepte für ein gehirngesundes Essen.","zutaten":["Kochbuch zur Alzheimer-Prävention"],"schritte":["Frische, naturnahe Lebensmittel statt stark verarbeiteter Kost.","Omega-3-reiche Zutaten und wenig Zucker."]},
    {"id":"mediterran","titel":"Demenz vorbeugen: Mediterran essen","kat":"ernaehrung","jahr":"2017","verlag":"Fona","kurz":"Mittelmeerküche als Schutz für das Gehirn.","zutaten":["Rezept- und Ratgeberbuch"],"schritte":["Gemüse, Hülsenfrüchte, Fisch, Olivenöl und Nüsse als Basis."]},
    {"id":"algenoel","titel":"Algenöl","kat":"ernaehrung","jahr":"2018","verlag":"Heyne","kurz":"Die Ernährungsrevolution aus dem Meer.","zutaten":["Untertitel: Die Ernährungsrevolution aus dem Meer"],"schritte":["Die Omega-3-Fettsäure DHA ist ein Grundbaustein des Gehirns.","Algenöl liefert DHA direkt aus der Quelle, aus der auch Fische es haben, ohne Überfischung."]},
    {"id":"alzheimer-heilbar","titel":"Alzheimer ist heilbar","kat":"gehirn","jahr":"2015","verlag":"Heyne","kurz":"Rechtzeitig zurück in ein gesundes Leben.","zutaten":["Untertitel: Rechtzeitig zurück in ein gesundes Leben","Nachfolger der Alzheimer-Lüge"],"schritte":["Wird die Krankheit früh erkannt und die Lebensweise umfassend geändert, kann sie sich zurückbilden.","Der Hippocampus kann sich durch Neurogenese erholen."]},
    {"id":"alzheimer-luege","titel":"Die Alzheimer-Lüge","kat":"gehirn","jahr":"2014","verlag":"Heyne","kurz":"Die Wahrheit über eine vermeidbare Krankheit.","zutaten":["Untertitel: Die Wahrheit über eine vermeidbare Krankheit","Grundlage seiner Alzheimer-Theorie"],"schritte":["Alzheimer ist keine zwangsläufige Alterskrankheit; nur etwa 2 Prozent der Fälle sind rein erblich.","Der Hippocampus verwandelt Erlebnisse in Erinnerungen und braucht dafür ständig neue Nervenzellen.","Beta-Amyloid ist eigentlich ein Schutzeiweiß; zu viel davon wirkt aber giftig und startet einen Teufelskreis.","Ursachen: Bewegungsmangel, Schlafmangel, falsche Ernährung, soziale Isolation, geistige Unterforderung und Dauerstress (Cortisol).","Medikamente gegen Amyloid hält er für den falschen Weg, weil sie eine Schutzfunktion stören.","Neugier, neue Aufgaben, Gemeinschaft und Bewegung fördern die Neubildung von Nervenzellen."]},
    {"id":"methusalem","titel":"Die Methusalem-Strategie","kat":"gehirn","jahr":"2011","verlag":"Mental Enterprises","kurz":"Vermeiden, was uns daran hindert, gesund älter und weiser zu werden.","zutaten":["Sein erstes großes Gesundheitsbuch"],"schritte":["Gesundes Altern aus Sicht der Evolution: Der Körper ist auf ein aktives, naturnahes Leben ausgelegt.","Wer die modernen Störfaktoren meidet, altert gesund und wird weiser statt vergesslich."]},
    {"id":"corona-syndrom","titel":"Das Corona Syndrom","kat":"gesellschaft","jahr":"2021","verlag":"Heyne","kurz":"Wie das Virus unsere Schwächen offenlegt.","zutaten":["Untertitel: Wie das Virus unsere Schwächen offenlegt"],"schritte":["Schwere Verläufe treffen vor allem Menschen mit Mangelzuständen und Vorerkrankungen.","Ein gesunder Lebensstil stärkt die Abwehr nachhaltig, etwa durch Vitamin D, Omega-3, Bewegung und Schlaf."]},
    {"id":"herdengesundheit","titel":"Herdengesundheit","kat":"gesellschaft","jahr":"2022","verlag":"Mental Enterprises","kurz":"Der Weg aus der Corona-Krise und die natürliche Alternative zum globalen Impfprogramm.","zutaten":["Untertitel: Der Weg aus der Corona-Krise und die natürliche Alternative zum globalen Impfprogramm"],"schritte":["Statt Herdenimmunität durch Impfung setzt er auf Herdengesundheit: eine gesunde Bevölkerung durch bessere Lebensweise und Nährstoffversorgung."]},
    {"id":"indoktrinierte-gehirn","titel":"Das indoktrinierte Gehirn","kat":"gesellschaft","jahr":"2023","verlag":"Mental Enterprises / Skyhorse (englisch)","kurz":"Wie wir den globalen Angriff auf unsere mentale Freiheit erfolgreich abwehren.","zutaten":["Englisch: The Indoctrinated Brain"],"schritte":["Der Hippocampus ist Sitz unseres autobiografischen Gedächtnisses und damit unserer Identität und Urteilskraft.","Angst, Isolation, Dauerstress und Erschöpfung während der Pandemie-Maßnahmen schwächten ihn – Menschen würden dadurch leichter lenkbar.","Er sieht darin ein koordiniertes Vorgehen von Eliten und vermutet Schäden durch das Spike-Protein und die mRNA-Impfstoffe.","Schutz: Hippocampus und Gedächtnis stärken, kritisch denken, vielfältige Quellen nutzen, lokale Gemeinschaften aufbauen, unabhängig und gesund leben."]},

    {"id":"siegen","titel":"Du musst nicht siegen, um zu gewinnen","kat":"sport","jahr":"2010","verlag":"Eigenverlag","kurz":"Sport, Grenzerfahrung und Lebenseinstellung.","zutaten":["auch als DVD"],"schritte":["Persönliche Lehren aus dem Extremsport."]},
    {"id":"kilimanjaro","titel":"Gipfel der Freiheit","kat":"sport","jahr":"2011","verlag":"–","kurz":"Herausforderung Kilimanjaro.","zutaten":["Erfahrungsbericht"],"schritte":["Bergbesteigung als persönliche Herausforderung."]}

  {"id":"kernideen","titel":"Kernideen","bloecke":[
   {"typ":"text","text":"Fast alle seine Bücher kreisen um eine Idee: Der Hippocampus ist das Herz unserer geistigen Gesundheit, und unsere moderne Lebensweise lässt ihn verkümmern."},
   {"typ":"abschnitt","titel":"1. Der Hippocampus als Schlüssel","liste":["Er speichert Erlebnisse und macht sie abrufbar – er ist das Archiv unseres Lebens und unserer Identität.","Er bildet lebenslang neue Nervenzellen (Neurogenese). Bekanntes Beispiel: Londoner Taxifahrer haben einen größeren hinteren Hippocampus.","Ohne regelmäßige Anregung werden die neuen Zellen wieder abgebaut."]},
   {"typ":"abschnitt","titel":"2. Alzheimer als Mangelkrankheit der Lebensweise","liste":["Alzheimer ist keine Alterserscheinung, sondern das Ende einer jahrzehntelangen Fehlentwicklung.","Mehrere Mangelzustände wirken zusammen: Bewegung, Schlaf, Nährstoffe, soziale Bindung, Sinn.","Beta-Amyloid ist ein Schutzeiweiß, das bei Überlastung giftig wird. Medikamente gegen Amyloid greifen daher am falschen Punkt an.","Wird früh und umfassend gegengesteuert, kann sich das Gehirn erholen. Seine Theorie veröffentlichte er 2016 als „Unified Theory of Alzheimer's Disease“."]},
   {"typ":"abschnitt","titel":"3. Evolution als Maßstab","liste":["Unser Gehirn ist für ein Leben als Jäger und Sammler gebaut: viel Bewegung, Tageslicht, Gemeinschaft, Meeres- und Naturnahrung.","Großeltern hatten in der Evolution eine wichtige Rolle als Wissensträger – ein gesundes Gedächtnis im Alter ist daher vorgesehen.","Was davon abweicht, wird zum Risiko."]},
   {"typ":"abschnitt","titel":"4. Mentale Energie","liste":["Willenskraft, Konzentration und Kreativität hängen am Zusammenspiel von Hippocampus und Frontalhirn.","Dauerstress, Schlafmangel und Reizüberflutung erschöpfen dieses System."]},
   {"typ":"abschnitt","titel":"5. Lithium als vergessenes Spurenelement","liste":["Seit 2025 sein Schwerpunkt: Ein chronischer Lithiummangel schwäche Gehirn und Psyche.","Details und Studienlage: {{b:lithium|Lithium}}."]},
   {"typ":"abschnitt","titel":"6. Geistige Freiheit","liste":["Ein geschwächter Hippocampus macht Menschen lenkbar, weil Urteilskraft und Erinnerung leiden.","Gegenmittel: Gesundheit, Gemeinschaft, kritisches Denken."]}
  ]},

   {"typ":"karten","art":"buch","filter":[["alle","Alle"]],"eintraege":[
    {"id":"ungeskriptet","titel":"Ungeskriptet – Lithium, mentales Immunsystem, Vitamin D","kat":"alle","jahr":"2026","verlag":"Podcast Ungeskriptet","kurz":"Warum Lithiummangel laut Nehls das mentale Immunsystem schwächt und Menschen manipulierbar macht; dazu Vitamin D und scharfe Kritik an Corona-Politik, Pharmaindustrie und WHO.","zutaten":["Anlass: Besuch beim US-Gesundheitsminister Kennedy, Ziel: Lithium als essenziell anerkennen lassen","Themen: Hippocampus, Lithium, Vitamin D, Gesetz des Minimums, Corona, WHO","Ausführlich unten auf dieser Seite"],"schritte":["**Mentales Immunsystem:** Der Hippocampus bildet lebenslang neue Nervenzellen; sie machen neugierig, stressfest und schützen vor Manipulation.","**Lithium ist essenziell:** Mangel fördere Alzheimer, Depression, Suizid und Gewalt. Bedarf: ca. 1 mg pro Tag.","**Vitamin D:** Zielspiegel ca. 125 nmol/l; die offizielle Empfehlung von 800 IE sei viel zu niedrig.","**Corona:** Alternativen wie Vitamin D und Ivermectin seien unterdrückt worden; das Spike-Protein schädige den Hippocampus.","**Gesetz des Minimums:** Ein fehlender essenzieller Stoff lässt sich durch nichts ersetzen – das werde im Medizinstudium nicht gelehrt."]}
   ]},
   {"typ":"abschnitt","titel":"Mentales Immunsystem","liste":["Neben dem körperlichen gibt es laut Nehls ein mentales Immunsystem: Es wehrt schädliche Narrative ab, also Manipulation.","Der Hippocampus speichert Erlebnisse mit Ort und Zeit und bildet als einziger Hirnbereich lebenslang neue Nervenzellen (adulte hippokampale Neurogenese) [W].","Die neuen Zellen entstehen vor allem nachts. Werden sie tagsüber nicht durch Neues gebraucht, sterben sie ab – sie stehen für unsere Neugier.","Sie bremsen die Stressachse und verknüpfen Neues mit Erfahrung: Erst Schreck beim Rascheln im Gebüsch, dann erkennt man das Eichhörnchen, und der Stress fällt ab.","**Fördert:** Bewegung (Wachstumshormon, EPO), Nähe und Sexualität (Oxytocin, Prolaktin), neue Erlebnisse, Lithium.","**Hemmt:** Entzündung (Infekt, starker Muskelkater, Kopfverletzungen), Dauerstress und laut Nehls das Spike-Protein.","Kurzfristig ist der Rückzug bei Krankheit sinnvoll (Sickness Behavior). Bleibt er, folgen Angst, Depression und am Ende Alzheimer.","**Engels- oder Teufelskreis:** Wer rausgeht, bildet mehr Zellen und wird neugieriger; wer sich zurückzieht, wird ängstlicher.","Leichtgläubigkeit hat laut Nehls nichts mit dem IQ zu tun, sondern mit zu wenigen neuen Zellen."]},
   {"typ":"abschnitt","titel":"Die Evolution der Großmutter","liste":["Schimpansen sterben kurz nach der letzten fruchtbaren Phase mit etwa 40–50 Jahren; Menschen leben rund 50 Jahre länger.","Grund laut Nehls: Großeltern geben überlebenswichtige Erfahrung an die Enkel weiter.","Er nennt als Beleg: Bis Anfang des 20. Jahrhunderts wurden pro Lebensjahrzehnt einer Großmutter zwei Enkel mehr erwachsen.","Alzheimer zerstört genau diese Funktion; gehäuft trete die Krankheit erst seit den 1950er-Jahren auf."]},
   {"typ":"abschnitt","titel":"Lithium","liste":["Lithium ist eines der ersten Elemente des Universums und steckt in jedem Gestein (griechisch lithos = Stein).","Schon die ersten Zellen steuerten ihr Recycling (Autophagie) über das Enzym IMPase, das auf Lithium reagiert. Diesen Mechanismus fand er von Bakterien über Pflanzen bis zum Menschen.","**Autophagie:** Zellen zerlegen alte Eiweiße und Mitochondrien und bauen daraus Neues – auch eingedrungene Viren. Nervenzellen müssen bis zu 100 Jahre halten und sind darauf besonders angewiesen. Ohne Lithium keine Autophagie, so Nehls.","Tiere mit Lithiummangel zeigen Fruchtbarkeitsstörungen, Früh- und Totgeburten. Er spricht von einem „mentalen Immundefizienzsyndrom“.","Weitere Wirkungen laut Nehls: entzündungshemmend, gegen Brain Fog, fördert Neubildung von Nervenzellen, besserer Tiefschlaf und Tag-Nacht-Rhythmus.","**Woher die 1 mg kommen:** An der südafrikanischen Küste, der Wiege des Homo sapiens, nahmen Menschen über Muscheln 1–2 mg täglich auf; heute in Deutschland etwa 100-mal weniger. Schrauzer kam 2002 auf 1 mg für 70 kg.","7Up hieß ursprünglich „Lithiated Soda“ und enthielt pro Glas etwa 1 mg; Heilquellen wie die Hirschquelle haben ca. 0,7–1,3 mg pro Liter.","**Das Verbot von 1949:** Im selben Jahr, in dem John Cade Lithium gegen Manie entdeckte, bekamen herzkranke Patienten in US-Kliniken Lithiumchlorid grammweise als Salzersatz; 4 von 12 starben. Die FDA verbot Lithium als Nahrungsergänzung, Europa übernahm das. In den USA ist Lithiumorotat seit 1994 wieder frei verkäuflich.","Die Nature-Studie vom August 2025 sieht er als Bestätigung (siehe {{b:lithium-forschung-nature2025|Forschung}})."]},
   {"typ":"tabelle","kopf":["Lithium pro Tag","Bedeutung laut Video"],"zeilen":[["1 mg","essenzieller Bedarf (laut Nehls)"],["bis 85 mg","laut Europäischer Chemikalienagentur ohne Nebenwirkungen verträglich (wie von Nehls zitiert)"],["120–150 mg","Therapie bei bipolarer Störung, mit deutlichen Nebenwirkungen"]]},
   {"typ":"text","text":"Die Milligramm-Angaben beziehen sich auf reines Lithium, nicht auf das Salz. Lithiumcarbonat-Tabletten enthalten etwa ein Fünftel ihres Gewichts als Lithium."},
   {"typ":"abschnitt","titel":"Vitamin D","liste":["Vitamin D wird in der Leber erst zum Prohormon (25-OH-D3), daraus dann zum aktiven Hormon. Die Leber schafft nur einige Tausend Einheiten pro Tag – eine Stoßdosis von 100.000 IE wirkt deshalb erst nach 1–2 Wochen.","Bei schwerer Infektion verbrauche der Körper bis zu 10.000 IE täglich.","**Zielspiegel ca. 125 nmol/l** (= 50 ng/ml): Werte von Naturvölkern wie den Massai; laut den von ihm zitierten Studien höchste Lebenserwartung und niedrigstes Alzheimer-Risiko.","**Faustregel:** 50 IE täglich heben den Spiegel um etwa 1 nmol/l. Für 125 nmol/l also rund 6.000 IE, individuell 4.000–8.000. Mit 800 IE komme man aus leerem Speicher nur auf etwa 16 nmol/l.","Gefäßverkalkung drohe vor allem bei viel Calcium dazu; Vitamin K2 bilde ein gesundes Darm-Mikrobiom bei ballaststoffreicher Kost.","Winter sei der größte Risikofaktor für Atemwegsinfekte; nach RKI-Daten sei das Covid-Sterberisiko im Winter 72-mal höher gewesen.","Studien, die er nennt: Brenner (DKFZ) 2020, die Córdoba-Studie mit Prohormon (Intensiv-Risiko um über 95 % gesenkt), eine Brasilien-Studie, die er für falsch angelegt hält, und die VITAL-Studie 2022, deren Fazit er kritisiert.","Stillende mit 6.500 IE täglich versorgen laut ihm das Baby über die Muttermilch mit."]},
   {"typ":"abschnitt","titel":"Gesetz des Minimums und Maximums","liste":["Nach Carl Sprengel (1828): Fehlt einer Pflanze einer von 12 Mineralstoffen, wächst sie nicht – egal wie viel von den anderen da ist. Das gilt auch im Garten, z. B. beim {{s:huegelbeet-chemie|Hügelbeet}}.","Der Mensch braucht etwa 47–48 essenzielle Stoffe, dazu Bewegung, Schlaf, Sinn und Nähe.","Gesetz des Maximums: Jeder Stoff wird zu hoch dosiert giftig (Paracelsus).","Folgerung: Gesundheit liegt zwischen Minimum und Maximum. Ein Medikament gleicht keinen natürlichen Mangel aus – deshalb werde es nie ein Medikament gegen Alzheimer geben.","Seine Prüffragen für Empfehlungen: Was ist aus der Evolution sinnvoll? Welche Werte haben Naturvölker? Was zeigen Bevölkerungsstudien? Ist es biologisch erklärbar?"]},
   {"typ":"abschnitt","titel":"Corona, Spike-Protein und WHO","liste":["**Spike-Protein:** Die abgespaltene S1-Untereinheit gelange ins Gehirn, löse Entzündung aus und stoppe die Neubildung von Nervenzellen. Folgen laut Nehls: Long Covid, Post-Vac, Depression, schnellere Alzheimer-Verläufe; er nennt eine Studie aus Korea.","**Autophagie und Ivermectin:** Lithium und Ivermectin wirkten am selben Ziel (IMPase); beide seien mit schlecht angelegten Studien diskreditiert worden.","**Enquete-Kommission:** kein echter Untersuchungsausschuss; Kritik an PCR-Tests mit 45 Zyklen; Spahn-Zitat „Es ging nie um Fremdschutz“.","**Virusursprung:** laut Nehls ein Labor; er verweist auf die Furin-Spaltstelle und einen Projektantrag der EcoHealth Alliance von 2018.","**WHO:** etwa 80 % der Gelder von privaten Spendern mit Zweckbindung; Pandemie-Definition seit 2009 ohne Schweregrad; Investorenbroschüre von 2022.","Er warnt vor einer nächsten Pandemie, die Kinder trifft."]},
   {"typ":"abschnitt","titel":"Seine To-dos aus dem Video","nummern":["Vitamin-D-Spiegel beim Arzt messen lassen (Ziel ca. 125 nmol/l bzw. 50 ng/ml).","Vitamin D täglich nach gemessenem Spiegel ergänzen, im Mittel ca. 6.000 IE.","Mediterran und ballaststoffreich essen (Vitamin K2 aus dem Darm).","Omega-3 (EPA/DHA) ergänzen, bei veganer Ernährung auch B12.","Lithium ca. 1 mg täglich als Lithiumorotat: vom Arzt verordnen und in der Apotheke herstellen lassen. Ärzte und Apotheken listet Nehls auf seiner Webseite.","Alternativ lithiumhaltiges Heilwasser trinken (ca. 1 mg pro Liter).","Den Hippocampus fördern: täglich bewegen, Neues erleben, Nähe pflegen.","Weiterlesen: „Das Lithium-Komplott“ und „Herdengesundheit“."]},
   {"typ":"hinweis","text":"**Vor der Umsetzung:** Hohe Vitamin-D-Dosen dauerhaft nur mit Spiegelkontrolle beim Arzt – zu viel Vitamin D kann den Calciumspiegel gefährlich erhöhen. Lithium nur nach ärztlicher Rücksprache, besonders bei Nieren-, Herz- oder Schilddrüsenerkrankungen und bei Einnahme von Entwässerungs-, Blutdruck- oder Schmerzmitteln ({{b:lithium-sicherheit|Lithium · Sicherheit}})."},

    ["Vitamin D","Zielspiegel 125 nmol/l, ca. 6.000 IE täglich","Ein Mangel ist häufig und sollte behoben werden. Fachgesellschaften wie die DGE nennen ohne eigene Bildung 800 IE täglich und halten einen höheren Zielspiegel nicht für belegt. Hohe Dosen dauerhaft nur mit Kontrolle."],

  {"id":"denken","titel":"Denken","bloecke":[
   {"typ":"text","text":"Storl schaut auf Pflanzen mit drei Brillen zugleich: der des Botanikers, der des Völkerkundlers und der des Gärtners."},
   {"typ":"abschnitt","titel":"1. Pflanzen sind Wesen","liste":["Pflanzen haben kulturelle, sprachliche, heilkundliche und mythologische Bedeutung, die aus ihrer Beziehung zum Menschen entsteht.","Er spricht von der Seele der Pflanzen und von Pflanzendevas – geprägt von Anthroposophie und alten Naturreligionen.","Sammeln heißt für ihn: mit Respekt und Dank, nicht nur nehmen."]},
   {"typ":"abschnitt","titel":"2. Ur-Medizin","liste":["Unsere Volksmedizin reicht bis in die Steinzeit und zu schamanischen Kulturen zurück.","Kelten, Germanen, Indianer und indische Heiler kannten dieselben Grundprinzipien.","Viel von diesem Wissen ging durch Christianisierung und Hexenverfolgung verloren."]},
   {"typ":"abschnitt","titel":"3. „Unkräuter“ sind Begleiter","liste":["Die wichtigsten Heilpflanzen wachsen dort, wo Menschen leben – an Haustür, Weg und Gartenzaun.","Brennnessel, Löwenzahn und Co. sind Nahrung, Medizin und Nützlingsweide.","Siehe {{p:p01|Brennnessel}} und {{p:p02|Giersch}}."]},
   {"typ":"abschnitt","titel":"4. Selbstversorgung","liste":["Lokaler Anbau mit alten, samenfesten Sorten statt eng gezüchtetem Hybrid- und Gentechnik-Saatgut.","Der Garten ist ein Mikrokosmos und ein Lernort.","Jeder kann klein anfangen."]},
   {"typ":"abschnitt","titel":"5. Natur als Weg zu sich selbst","liste":["„Die Arbeit mit der Natur bringt einen näher zum eigenen Selbst, man kann sich selber finden.“","Gärtnern und Wandern als Meditation.","Der Mensch ist ein Geschöpf des Waldes."]}
