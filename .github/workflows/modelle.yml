name: Whisper-Modelle holen
on:
  push:
    branches: [modelle]
    paths: ['.github/workflows/modelle.yml']
# v4: volle Bibliothek; v3: Testsprache; v2: passende ORT-Laufzeit aus dem transformers-Paket
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: modelle }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bibliotheken (transformers.js, onnxruntime-web)
        shell: bash
        run: |
          set +e
          rm -rf asr/lib; mkdir -p asr/lib tmp && cd tmp
          npm pack @huggingface/transformers@3 onnxruntime-web@1.20.1 > ../asr/lib/PACK.txt 2>&1
          ls -la >> ../asr/lib/PACK.txt
          for f in *.tgz; do mkdir -p "x-${f%.tgz}"; tar -xzf "$f" -C "x-${f%.tgz}"; done
          T=$(ls -d x-huggingface-transformers-*/package | head -1); O=$(ls -d x-onnxruntime-web-*/package | head -1)
          echo "T=$T O=$O" >> ../asr/lib/PACK.txt
          ls -la $T/dist > ../asr/lib/LISTE-transformers.txt; ls -la $O/dist > ../asr/lib/LISTE-ort.txt
          cp $T/dist/transformers.min.js ../asr/lib/; cp $T/node_modules/onnxruntime-web/LICENSE ../asr/lib/LICENSE-onnxruntime.txt 2>/dev/null; cp $O/README.md ../asr/lib/README-onnxruntime.md 2>/dev/null
          cp $T/dist/ort-wasm-simd-threaded.jsep.wasm $T/dist/ort-wasm-simd-threaded.jsep.mjs ../asr/lib/
          cp $T/LICENSE ../asr/lib/LICENSE-transformers.txt; cp $O/LICENSE ../asr/lib/LICENSE-onnxruntime.txt
          grep '"version"' $T/package.json $O/package.json > ../asr/lib/VERSION.txt
          grep -o '"onnxruntime-web": *"[^"]*"' $T/package.json >> ../asr/lib/VERSION.txt
          exit 0
      - name: Modelle (Whisper tiny und base, mehrsprachig, 8 Bit)
        shell: bash
        run: |
          set +e
          for m in Xenova/whisper-tiny Xenova/whisper-base; do
            d=asr/models/$m; mkdir -p $d/onnx
            for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json special_tokens_map.json added_tokens.json normalizer.json vocab.json merges.txt; do
              curl -sfL -o $d/$f https://huggingface.co/$m/resolve/main/$f || rm -f $d/$f
            done
            for f in encoder_model_quantized.onnx decoder_model_merged_quantized.onnx; do
              curl -sfL -o $d/onnx/$f https://huggingface.co/$m/resolve/main/onnx/$f || rm -f $d/onnx/$f
            done
          done
          curl -sfL -o asr/models/LICENSE-whisper.txt https://raw.githubusercontent.com/openai/whisper/main/LICENSE || true
          du -ah asr | sort -h | tail -60 > asr/GROESSEN.txt; cat asr/GROESSEN.txt; exit 0
      - name: Testsprache (espeak-ng)
        shell: bash
        run: |
          set +e
          sudo apt-get install -y -q espeak-ng >/dev/null 2>&1
          mkdir -p asr/test
          espeak-ng -v de -s 140 -w asr/test/sprache_de.wav "Ich fahre auf der Straße bis zum Ende. Und die Nacht ist lang. Danach kommt nichts mehr an der Grenze aus Licht."
          espeak-ng -v en-us -s 140 -w asr/test/sprache_en.wav "Hold on to the night, we were young and free. Take my hand and sing along with me."
          ls -la asr/test; exit 0
      - name: Ablegen
        run: |
          rm -rf tmp
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add asr && git commit -qm "Whisper-Modelle und Bibliotheken" && git push
